      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/java/com/vueo/app/core/enrichment/RichDetailsClient.kt             app/src/main/java/com/vueo/app/core/stremio/StremioAddonProvider.kt

          if git diff --cached --quiet; then
            echo "No new source changes to commit."
          else
            git commit -m "fix: correct series season and cast enrichment"
            git push
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.6-details-season-cast-fix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
