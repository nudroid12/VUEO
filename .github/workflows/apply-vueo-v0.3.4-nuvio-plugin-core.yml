          archive = base64.b64decode(payload)

          with tarfile.open(
              fileobj=io.BytesIO(archive),
              mode="r:gz",
          ) as tf:
              for member in tf.getmembers():
                  target = Path(member.name)

                  if (
                      target.is_absolute() or
                      ".." in target.parts or
                      str(target).startswith(".github/")
                  ):
                      raise SystemExit(
                          f"Unsafe patch path: {member.name}"
                      )

              tf.extractall(".")

          old_cache = Path(
              "app/src/main/java/com/vueo/app/core/plugin/"
              "ProviderScriptCache.kt"
          )
          if old_cache.exists():
              old_cache.unlink()
              print("removed:", old_cache)

          print("Applied VUEO v0.3.4 source patch.")
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.3.4"'             app/build.gradle.kts

          grep -q 'quickjs-kt:1.0.14'             app/build.gradle.kts

          grep -q 'okhttp-dnsoverhttps:5.4.0'             app/build.gradle.kts

          grep -q 'class ProviderCodeStore'             app/src/main/java/com/vueo/app/core/plugin/ProviderCodeStore.kt

          grep -q 'nuvio_plugin_scrapers'             app/src/main/java/com/vueo/app/core/plugin/ProviderCodeStore.kt

          grep -q 'DnsOverHttps'             app/src/main/java/com/vueo/app/core/plugin/PluginHttp.kt

          grep -q 'quickJs'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q 'inside QuickJS'             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if test -f             app/src/main/java/com/vueo/app/core/plugin/ProviderScriptCache.kt; then
            echo "::error::Old provider cache source still exists."
            exit 1
          fi

          if git status --short | grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.3.4 sanity checks passed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||              [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name "github-actions[bot]"
            git config user.email               "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m                 "Replace plugin core with QuickJS local runtime"

              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Build VUEO v0.3.4 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR"             -maxdepth 1             -type f             -name "*.apk"             -print || true

          if ! find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit | grep -q .; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

