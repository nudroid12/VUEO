      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          BACKUP="app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt"
          UI_SETTINGS="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          GEMINI="app/src/main/java/com/vueo/app/core/enrichment/GeminiClient.kt"

          test "$(grep -c 'fun geminiApiKey()' "$SETTINGS")" -eq 1
          test "$(grep -c 'KEY_GEMINI_API_KEY' "$SETTINGS")" -ge 2
          grep -q '"gemini_api_key"' "$BACKUP"

          grep -q 'internal fun PersonalizationSettingsScreen' "$UI_SETTINGS"
          grep -q 'internal fun GeminiEnhancementSettingsScreen' "$UI_SETTINGS"
          grep -q 'onGemini: () -> Unit' "$UI_SETTINGS"

          grep -q 'SettingsPage.GEMINI' "$APP"
          grep -q 'details_gemini_insight' "$APP"
          grep -q '"More Like This"' "$APP"

          grep -q '/v1/interactions' "$GEMINI"
          grep -q 'gemini-3.7-flash' "$GEMINI"
          grep -q '"max_output_tokens"' "$GEMINI"
          grep -q '"thinking_level"' "$GEMINI"

          echo "Gemini source validation passed."

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

