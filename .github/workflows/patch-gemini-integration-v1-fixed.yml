        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/core/enrichment/GeminiClient.kt             app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt             app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt             app/src/main/java/com/vueo/app/ui/VueoApp.kt

