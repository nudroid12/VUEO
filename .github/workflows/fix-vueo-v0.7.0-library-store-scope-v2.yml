name: Fix VUEO v0.7.0 Library Store Scope v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix LibraryStore declarations
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )

          if not path.exists():
              raise SystemExit(
                  "VueoApp.kt not found. Apply v0.7.0 first."
              )

          text = path.read_text(
              encoding="utf-8"
          )
          original = text

          block = (
              "    val libraryStore = remember {\n"
              "        LibraryStore(\n"
              "            context.applicationContext\n"
              "        )\n"
              "    }\n"
          )

          # Root patch originally inserted the same declaration twice.
          while block + block in text:
              text = text.replace(
                  block + block,
                  block,
                  1,
              )

          details_start = text.find(
              "private fun MediaDetailsScreen("
          )

          if details_start < 0:
              raise SystemExit(
                  "MediaDetailsScreen was not found."
              )

          details_var = text.find(
              "    var item by remember",
              details_start,
          )

          if details_var < 0:
              raise SystemExit(
                  "MediaDetailsScreen state marker was not found."
              )

          details_prefix = text[
              details_start:
              details_var
          ]

          if (
              "val libraryStore = remember {" not in
              details_prefix
          ):
              plugin_block = (
                  "    val pluginStore = remember {\n"
                  "        PluginStore(context.applicationContext)\n"
                  "    }\n"
              )

              plugin_at = text.find(
                  plugin_block,
                  details_start,
                  details_var,
              )

              if plugin_at < 0:
                  raise SystemExit(
                      "MediaDetailsScreen pluginStore block was not found."
                  )

              insert_at = (
                  plugin_at +
                  len(plugin_block)
              )

              text = (
                  text[:insert_at] +
                  block +
                  text[insert_at:]
              )

          if text != original:
              path.write_text(
                  text,
                  encoding="utf-8",
              )
              print(
                  "Fixed v0.7.0 LibraryStore scope."
              )
          else:
              print(
                  "LibraryStore scope hotfix already present."
              )
          PY

      - name: Verify structural scope only
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          app_start = text.index(
              "fun VueoApp()"
          )

          details_start = text.index(
              "private fun MediaDetailsScreen("
          )

          details_state = text.index(
              "    var item by remember",
              details_start,
          )

          root_block = text[
              app_start:
              details_start
          ]

          details_prefix = text[
              details_start:
              details_state
          ]

          root_count = root_block.count(
              "val libraryStore = remember {"
          )

          details_count = details_prefix.count(
              "val libraryStore = remember {"
          )

          print(
              "VueoApp LibraryStore declarations:",
              root_count,
          )

          print(
              "MediaDetailsScreen LibraryStore declarations:",
              details_count,
          )

          if root_count != 1:
              raise SystemExit(
                  "VueoApp must contain exactly one LibraryStore declaration."
              )

          if details_count != 1:
              raise SystemExit(
                  "MediaDetailsScreen must contain exactly one LibraryStore declaration."
              )

          # Check feature calls while allowing Kotlin line wrapping.
          patterns = {
              "isWatchlisted":
                  r"libraryStore\s*\.isWatchlisted\s*\(",
              "toggleWatchlist":
                  r"libraryStore\s*\.toggleWatchlist\s*\(",
              "LibraryScreen":
                  r"LibraryScreen\s*\(",
              "recordLibraryProgress":
                  r"recordLibraryProgress\s*\(",
          }

          for name, pattern in patterns.items():
              if not re.search(
                  pattern,
                  text,
                  flags=re.MULTILINE,
              ):
                  raise SystemExit(
                      f"Missing v0.7 feature: {name}"
                  )

          print(
              "Structural Library checks passed."
          )
          PY

      - name: Commit and push hotfix
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            git config user.name \
              "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              app/src/main/java/com/vueo/app/ui/VueoApp.kt

            git commit -m \
              "Fix v0.7.0 LibraryStore scope"

            git push origin \
              "HEAD:${GITHUB_REF_NAME}"
          else
            echo \
              "Hotfix already present. Continuing to compile."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f \
            ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if \
              [ -n "${ANDROID_HOME:-}" ] && \
              [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo \
                "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Build VUEO v0.7.0 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo \
              "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload fixed VUEO v0.7.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.7.0-fixed-v2-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.7.0 Hotfix v2"
            echo
            echo "- Fixed LibraryStore scope"
            echo "- Verification now supports formatted Kotlin calls"
            echo "- Kotlin compiler is the final validation"
            echo "- Continue Watching retained"
            echo "- My List retained"
            echo "- History retained"
          } >> "$GITHUB_STEP_SUMMARY"
