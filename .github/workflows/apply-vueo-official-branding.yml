# VUEO OFFICIAL BRANDING - 2026-08-29
name: Apply VUEO Official Branding

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  branding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply official branding
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'

          from pathlib import Path

          DESIGN = Path("app/src/main/java/com/vueo/app/ui/VueoDesign.kt")
          SETTINGS = Path("app/src/main/java/com/vueo/app/ui/VueoSettings.kt")
          MANIFEST = Path("app/src/main/AndroidManifest.xml")
          THEMES = Path("app/src/main/res/values/themes.xml")
          THEMES_V31 = Path("app/src/main/res/values-v31/themes.xml")
          ICON = Path("app/src/main/res/drawable/ic_vueo.xml")
          LAUNCH = Path("app/src/main/res/drawable/vueo_launch_background.xml")
          LOGO = Path("app/src/main/res/drawable/vueo_logo_mark.png")

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"Branding patch sanity failed: {message}")

          require(LOGO.exists(), "approved vueo_logo_mark.png is missing")

          DESIGN.write_text(
          '''package com.vueo.app.ui

          import androidx.compose.foundation.Image
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.layout.width
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.vueo.app.R
          import com.vueo.app.core.storage.AppAccent

          internal object VueoPalette {
              val Background = Color(0xFF070A0D)
              val Nav = Color(0xFF0A0D11)
              val Surface = Color(0xFF101419)
              val SurfaceElevated = Color(0xFF161B20)
              val SurfaceStrong = Color(0xFF1D2329)
              val Stroke = Color(0xFF2A323A)
              val Muted = Color(0xFFA2AAB3)

              // Official VUEO identity:
              // lime V/play mark + clean white wordmark.
              // Brand identity never follows the user's UI accent.
              val BrandLime = Color(0xFFB6FF00)

              private var accentState by mutableStateOf(
                  Color(AppAccent.WHITE.argb)
              )

              val Accent: Color
                  get() = accentState

              fun applyAccent(accent: AppAccent) {
                  val next = Color(accent.argb)
                  if (accentState != next) {
                      accentState = next
                  }
              }

              val Success = Color(0xFF72DF87)
              val Warning = Color(0xFFFFB84D)
              val Error = Color(0xFFFF6767)
          }

          internal fun AppAccent.composeColor(): Color = Color(argb)

          @Composable
          internal fun VueoBrandMark(
              modifier: Modifier = Modifier,
              @Suppress("UNUSED_PARAMETER")
              color: Color = VueoPalette.BrandLime,
          ) {
              Image(
                  painter = painterResource(
                      R.drawable.vueo_logo_mark
                  ),
                  contentDescription = "VUEO",
                  modifier = modifier,
                  contentScale = ContentScale.Fit,
              )
          }

          @Composable
          internal fun VueoBrandLockup(
              modifier: Modifier = Modifier,
              compact: Boolean = false,
          ) {
              Row(
                  modifier = modifier,
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.Start,
              ) {
                  VueoBrandMark(
                      modifier = Modifier.size(
                          if (compact) 29.dp else 36.dp
                      )
                  )

                  Spacer(
                      Modifier.width(
                          if (compact) 8.dp else 11.dp
                      )
                  )

                  Text(
                      text = "VUEO",
                      color = Color.White,
                      fontWeight = FontWeight.SemiBold,
                      fontSize = if (compact) 18.sp else 23.sp,
                      letterSpacing = if (compact) 2.2.sp else 3.0.sp,
                  )
              }
          }
          ''',
              encoding="utf-8",
          )

          ICON.write_text(
          '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#050706" />
                      <corners android:radius="18dp" />
                  </shape>
              </item>

              <item
                  android:width="92dp"
                  android:height="92dp"
                  android:gravity="center">
                  <bitmap
                      android:src="@drawable/vueo_logo_mark"
                      android:gravity="fill"
                      android:filter="true" />
              </item>
          </layer-list>
          ''',
              encoding="utf-8",
          )

          LAUNCH.write_text(
          '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#050706" />
                  </shape>
              </item>

              <item
                  android:width="180dp"
                  android:height="180dp"
                  android:gravity="center">
                  <bitmap
                      android:src="@drawable/vueo_logo_mark"
                      android:gravity="fill"
                      android:filter="true" />
              </item>
          </layer-list>
          ''',
              encoding="utf-8",
          )

          THEMES.write_text(
          '''<resources xmlns:tools="http://schemas.android.com/tools">
              <style
                  name="Theme.VUEO.Base"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#050706</item>
                  <item name="android:navigationBarColor">#050706</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>

              <style
                  name="Theme.VUEO"
                  parent="@style/Theme.VUEO.Base">
                  <item name="android:windowBackground">@drawable/vueo_launch_background</item>
              </style>
          </resources>
          ''',
              encoding="utf-8",
          )

          THEMES_V31.parent.mkdir(parents=True, exist_ok=True)
          THEMES_V31.write_text(
          '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style
                  name="Theme.VUEO"
                  parent="@style/Theme.VUEO.Base">
                  <item name="android:windowSplashScreenBackground">#050706</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/vueo_logo_mark</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#050706</item>
                  <item name="android:windowSplashScreenAnimationDuration">300</item>
                  <item name="android:windowBackground">#050706</item>
              </style>
          </resources>
          ''',
              encoding="utf-8",
          )

          manifest = MANIFEST.read_text(encoding="utf-8")

          if 'android:roundIcon="@drawable/ic_vueo"' not in manifest:
              anchor = '''        android:icon="@drawable/ic_vueo"
                  android:label="VUEO"
          '''
              replacement = '''        android:icon="@drawable/ic_vueo"
                  android:roundIcon="@drawable/ic_vueo"
                  android:logo="@drawable/vueo_logo_mark"
                  android:label="VUEO"
          '''
              require(anchor in manifest, "manifest application icon anchor missing")
              manifest = manifest.replace(anchor, replacement, 1)

          MANIFEST.write_text(manifest, encoding="utf-8")

          settings = SETTINGS.read_text(encoding="utf-8")

          old_title = '''        Text(
                      "VUEO",
                      color = VueoPalette.BrandLime,
                      fontSize = 10.sp,
                      fontWeight = FontWeight.Black,
                      letterSpacing = 1.4.sp,
                  )
          '''
          new_title = '''        Text(
                      "VUEO",
                      color = Color.White,
                      fontSize = 10.sp,
                      fontWeight = FontWeight.SemiBold,
                      letterSpacing = 1.8.sp,
                  )
          '''

          if old_title in settings:
              settings = settings.replace(old_title, new_title, 1)

          old_brand_info = (
              "The VUEO logo remains Lime Green even when the interface "
              "accent is White, Ocean, Violet, Amber, or Coral."
          )
          new_brand_info = (
              "The official VUEO mark stays Lime Green and the wordmark "
              "stays White, even when the interface accent changes."
          )

          if old_brand_info in settings:
              settings = settings.replace(old_brand_info, new_brand_info, 1)

          SETTINGS.write_text(settings, encoding="utf-8")

          design = DESIGN.read_text(encoding="utf-8")
          settings = SETTINGS.read_text(encoding="utf-8")
          manifest = MANIFEST.read_text(encoding="utf-8")

          checks = [
              ('vueo_logo_mark' in design, "Compose mark is not using approved PNG"),
              ('color = Color.White' in design, "official white wordmark missing"),
              ('Color(0xFFB6FF00)' in design, "official brand lime missing"),
              (
                  'android:roundIcon="@drawable/ic_vueo"' in manifest,
                  "round launcher icon missing",
              ),
              (
                  'android:logo="@drawable/vueo_logo_mark"' in manifest,
                  "manifest logo missing",
              ),
              (THEMES_V31.exists(), "Android 12 splash theme missing"),
              (LAUNCH.exists(), "legacy launch background missing"),
              (
                  "The official VUEO mark stays Lime Green" in settings,
                  "Settings branding description missing",
              ),
          ]

          failures = [message for ok, message in checks if not ok]
          require(not failures, "; ".join(failures))

          print("VUEO official branding patch applied.")
          print("No image was generated. Existing vueo_logo_mark.png was reused.")
          PY

      - name: Validate branding resources
        shell: bash
        run: |
          set -euo pipefail

          DESIGN="app/src/main/java/com/vueo/app/ui/VueoDesign.kt"
          SETTINGS="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          THEMES="app/src/main/res/values/themes.xml"
          THEMES31="app/src/main/res/values-v31/themes.xml"
          ICON="app/src/main/res/drawable/ic_vueo.xml"
          LAUNCH="app/src/main/res/drawable/vueo_launch_background.xml"
          LOGO="app/src/main/res/drawable/vueo_logo_mark.png"

          test -f "$LOGO"
          test -f "$DESIGN"
          test -f "$SETTINGS"
          test -f "$MANIFEST"
          test -f "$THEMES"
          test -f "$THEMES31"
          test -f "$ICON"
          test -f "$LAUNCH"

          grep -q 'vueo_logo_mark' "$DESIGN"
          grep -q 'color = Color.White' "$DESIGN"
          grep -q 'FFB6FF00' "$DESIGN"
          grep -q 'android:roundIcon="@drawable/ic_vueo"' "$MANIFEST"
          grep -q 'android:windowSplashScreenAnimatedIcon' "$THEMES31"
          grep -q 'vueo_launch_background' "$THEMES"

          echo "Official VUEO branding resources validated."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Commit verified branding
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No branding changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/AndroidManifest.xml             app/src/main/java/com/vueo/app/ui/VueoDesign.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt             app/src/main/res/drawable/ic_vueo.xml             app/src/main/res/drawable/vueo_launch_background.xml             app/src/main/res/values/themes.xml             app/src/main/res/values-v31/themes.xml

          git commit -m "feat: apply official VUEO branding"
          git push origin HEAD:main
