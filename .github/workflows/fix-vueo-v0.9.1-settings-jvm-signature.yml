name: Fix VUEO v0.9.1 JVM Signature Clash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix CatalogDiscoveryCache JVM signature clash
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          )

          text = path.read_text(encoding="utf-8")

          first = """private fun List<CatalogRow>
              .toJson(): JSONArray ="""

          second = """private fun List<MediaItem>
              .toJson(): JSONArray ="""

          first_fixed = """@kotlin.jvm.JvmName("catalogRowsToJson")
          private fun List<CatalogRow>
              .toJson(): JSONArray ="""

          second_fixed = """@kotlin.jvm.JvmName("mediaItemsToJson")
          private fun List<MediaItem>
              .toJson(): JSONArray ="""

          if '@kotlin.jvm.JvmName("catalogRowsToJson")' not in text:
              if first not in text:
                  raise SystemExit(
                      "Could not locate CatalogRow.toJson extension."
                  )
              text = text.replace(first, first_fixed, 1)

          if '@kotlin.jvm.JvmName("mediaItemsToJson")' not in text:
              if second not in text:
                  raise SystemExit(
                      "Could not locate MediaItem.toJson extension."
                  )
              text = text.replace(second, second_fixed, 1)

          path.write_text(text, encoding="utf-8")

          print("Added distinct JVM names to overloaded List.toJson extensions.")
          PY

      - name: Verify hotfix
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"

          grep -Fq '@kotlin.jvm.JvmName("catalogRowsToJson")' "$FILE"
          grep -Fq '@kotlin.jvm.JvmName("mediaItemsToJson")' "$FILE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ).read_text(encoding="utf-8")

          checks = [
              (
                  r'@kotlin\.jvm\.JvmName\("catalogRowsToJson"\)\s*'
                  r'private fun List<CatalogRow>\s*\.toJson\(\): JSONArray',
                  "CatalogRow JVM name",
              ),
              (
                  r'@kotlin\.jvm\.JvmName\("mediaItemsToJson"\)\s*'
                  r'private fun List<MediaItem>\s*\.toJson\(\): JSONArray',
                  "MediaItem JVM name",
              ),
          ]

          for pattern, label in checks:
              if not re.search(pattern, text, re.S):
                  raise SystemExit(f"Missing structural check: {label}")

          print("v0.9.1 JVM signature hotfix checks passed.")
          PY

          grep -q 'versionCode = 18' app/build.gradle.kts
          grep -q 'versionName = "0.9.1"' app/build.gradle.kts

          if git status --short | grep -E '^.. \.github/workflows/'; then
            echo "::error::Hotfix attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push hotfix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt

          if ! git diff --cached --quiet; then
            git commit -m "Fix VUEO v0.9.1 JVM signature clash"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Hotfix already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload VUEO v0.9.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.1-jvm-hotfix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.1 JVM Signature Hotfix"
            echo
            echo "- Fixes List<CatalogRow>.toJson JVM erasure collision"
            echo "- Fixes List<MediaItem>.toJson JVM erasure collision"
            echo "- Keeps Kotlin call sites unchanged"
            echo "- Version remains 0.9.1, code 18"
          } >> "$GITHUB_STEP_SUMMARY"
