      - name: Sanity check v0.9.4
        shell: bash
        run: |
          set -euo pipefail

          BUILD="app/build.gradle.kts"
          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          SETTINGS="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          PROFILES_UI="app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          PROFILE_STORE="app/src/main/java/com/vueo/app/core/storage/ProfileStore.kt"
          LIBRARY="app/src/main/java/com/vueo/app/core/storage/LibraryStore.kt"
          PLAYBACK="app/src/main/java/com/vueo/app/core/storage/PlaybackStore.kt"
          SETTINGS_STORE="app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          BACKUP="app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt"
          MIGRATION="app/src/main/java/com/vueo/app/core/storage/VueoDataMigration.kt"
          CACHE="app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ENGINE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"

          grep -q 'versionCode = 21' "$BUILD"
          grep -q 'versionName = "0.9.4"' "$BUILD"

          test -f "$PROFILE_STORE"
          test -f "$PROFILES_UI"

          grep -Fq 'data class VueoProfile' "$PROFILE_STORE"
          grep -Fq 'class ProfileStore' "$PROFILE_STORE"
          grep -Fq 'DEFAULT_PROFILE_ID' "$PROFILE_STORE"
          grep -Fq 'askWhoIsWatchingOnStartup' "$PROFILE_STORE"
          grep -Fq 'shouldShowPickerOnStartup' "$PROFILE_STORE"
          grep -Fq 'createProfile' "$PROFILE_STORE"
          grep -Fq 'updateProfile' "$PROFILE_STORE"
          grep -Fq 'deleteProfile' "$PROFILE_STORE"
          grep -Fq 'scopedPreferenceKey' "$PROFILE_STORE"

          grep -Fq 'WhosWatchingScreen' "$PROFILES_UI"
          grep -Fq 'ProfileSettingsScreen' "$PROFILES_UI"
          grep -Fq "Who's Watching?" "$PROFILES_UI"
          grep -Fq 'No account, email, or sign-in required.' "$PROFILES_UI"
          grep -Fq 'Kids Profile' "$PROFILES_UI"

          grep -Fq 'SettingsPage.PROFILES' "$APP"
          grep -Fq 'showProfilePicker' "$APP"
          grep -Fq 'WhosWatchingScreen' "$APP"
          grep -Fq 'ProfileSettingsScreen' "$APP"
          grep -Fq 'onProfileClick' "$APP"
          grep -Fq 'profileStore.activeProfile()' "$APP"
          grep -Fq 'VUEO/${BuildConfig.VERSION_NAME}' "$APP"

          grep -Fq 'title = "Profiles"' "$SETTINGS"
          grep -Fq 'profileStore: ProfileStore' "$SETTINGS"
          grep -Fq 'onProfiles: () -> Unit' "$SETTINGS"

          if grep -Fq 'VueoSettingsSectionLabel(' "$SETTINGS"; then
            echo "::error::Old v0.9.3 section-label compile bug returned."
            exit 1
          fi

          grep -Fq 'scopedKey(' "$LIBRARY"
          grep -Fq 'ProfileStore.scopedPreferenceKey' "$LIBRARY"
          grep -Fq 'scopedMediaKey' "$PLAYBACK"
          grep -Fq 'ProfileStore.scopedPreferenceKey' "$PLAYBACK"

          grep -Fq 'profileKey(KEY_RESUME_PLAYBACK)' "$SETTINGS_STORE"
          grep -Fq 'profileKey(KEY_PREFERRED_QUALITY)' "$SETTINGS_STORE"
          grep -Fq 'profileKey(KEY_SUBTITLE_LANGUAGE)' "$SETTINGS_STORE"
          grep -Fq 'profileKey(KEY_SUBTITLE_SIZE)' "$SETTINGS_STORE"

          grep -Fq 'CURRENT_SCHEMA_VERSION = 2' "$BACKUP"
          grep -Fq '"vueo_profiles"' "$BACKUP"
          grep -Fq 'CURRENT_SCHEMA_VERSION = 2' "$MIGRATION"
          grep -Fq 'ProfileStore(' "$MIGRATION"

          grep -Fq '@kotlin.jvm.JvmName("catalogRowsToJson")' "$CACHE"
          grep -Fq '@kotlin.jvm.JvmName("mediaItemsToJson")' "$CACHE"
          grep -Fq 'withTimeoutOrNull' "$ENGINE"
          grep -Fq 'PlayerFullscreenEffect' "$APP"
          grep -Fq 'librarySaveTicks' "$APP"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          app = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(encoding="utf-8")

          settings = Path(
              "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          ).read_text(encoding="utf-8")

          profiles_ui = Path(
              "app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          ).read_text(encoding="utf-8")

          profile_store = Path(
              "app/src/main/java/com/vueo/app/core/storage/ProfileStore.kt"
          ).read_text(encoding="utf-8")

          cache = Path(
              "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ).read_text(encoding="utf-8")

          engine = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          ).read_text(encoding="utf-8")

          manifest = json.loads(
              Path("update.json").read_text(encoding="utf-8")
          )

          if manifest.get("versionCode") != 21:
              raise SystemExit("update.json versionCode mismatch")

          if manifest.get("versionName") != "0.9.4":
              raise SystemExit("update.json versionName mismatch")

          if app.count("SettingsPage.PROFILES") < 2:
              raise SystemExit("Profiles Settings route incomplete")

          if app.count("WhosWatchingScreen(") != 1:
              raise SystemExit("Who's Watching call regression")

          if profiles_ui.count(
              "internal fun WhosWatchingScreen("
          ) != 1:
              raise SystemExit(
                  "Who's Watching declaration regression"
              )

          if profiles_ui.count(
              "internal fun ProfileSettingsScreen("
          ) != 1:
              raise SystemExit(
                  "Profile Settings declaration regression"
              )

          required_profile_features = [
              "DEFAULT_PROFILE_ID",
              "MAX_PROFILES",
              "setActiveProfile",
              "createProfile",
              "updateProfile",
              "deleteProfile",
              "shouldShowPickerOnStartup",
              "clearProfileData",
          ]

          for token in required_profile_features:
              if token not in profile_store:
                  raise SystemExit(
                      f"Missing profile feature: {token}"
                  )

          app_start = app.index("fun VueoApp()")
          details_start = app.index(
              "private fun MediaDetailsScreen("
          )
          details_state = app.index(
              "    var item by remember",
              details_start,
          )

          root_count = app[
              app_start:details_start
          ].count(
              "val libraryStore = remember {"
          )

          details_count = app[
              details_start:details_state
          ].count(
              "val libraryStore = remember {"
          )

          if root_count != 1:
              raise SystemExit(
                  f"Root LibraryStore regression: {root_count}"
              )

          if details_count != 1:
              raise SystemExit(
                  f"Details LibraryStore regression: {details_count}"
              )

          bad_value_returns = [
              (
                  cache,
                  r"return@withContext\s*\n\s*emptyList",
              ),
              (
                  cache,
                  r"return@runCatching\s*\n\s*emptyList",
              ),
              (
                  engine,
                  r"return@runCatching\s*\n\s*null",
              ),
          ]

          for text, pattern in bad_value_returns:
              if re.search(pattern, text):
                  raise SystemExit(
                      "Split labelled value return regression"
                  )

          if "VueoSettingsSectionLabel(" in settings:
              raise SystemExit(
                  "v0.9.3 section-label compile bug returned"
              )

          print(
              "VUEO v0.9.4 structural checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/build.gradle.kts             app/src/main/java/com/vueo/app/core/storage/ProfileStore.kt             app/src/main/java/com/vueo/app/core/storage/LibraryStore.kt             app/src/main/java/com/vueo/app/core/storage/PlaybackStore.kt             app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt             app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt             app/src/main/java/com/vueo/app/core/storage/VueoDataMigration.kt             app/src/main/java/com/vueo/app/ui/VueoProfiles.kt             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt             README.md             ARCHITECTURE.md             update.json

          if ! git diff --cached --quiet; then
            git commit -m               "Add VUEO v0.9.4 local profiles"
            git push origin               "HEAD:${GITHUB_REF_NAME}"
          else
            echo "v0.9.4 patch already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build VUEO v0.9.4 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          APK="$(
            find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.4-profiles-final-polish-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.4 Profiles & Final Polish"
            echo
            echo "- Local profiles with optional Who's Watching startup picker"
            echo "- Quick profile switching from Home and Settings"
            echo "- My List, Continue Watching, History and progress isolated by profile"
            echo "- Playback quality and subtitle preferences isolated by profile"
            echo "- Content Manager, providers, TMDB and MDBList remain global"
            echo "- Profiles included in backup and restore schema 2"
            echo "- Existing v0.9.3 backups remain supported"
            echo "- Kids Profile is a label only, not a content filter"
            echo "- Version 0.9.4, code 21"
          } >> "$GITHUB_STEP_SUMMARY"
