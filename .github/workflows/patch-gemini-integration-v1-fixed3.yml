                                                          media =
                                                              item,
                                                          dna =
                                                              dnaForInsight,
                                                      )
                                              } else {
                                                  null
                                              }

                                          runCatching {
                                              GeminiClient
                                                  .titleInsight(
                                                      media =
                                                          item,
                                                      dna =
                                                          dnaForInsight,
                                                      dnaMatchPercent =
                                                          visibleMatch,
                                                      apiKey =
                                                          geminiApiKey,
                                                  )
                                          }
                                              .onSuccess {
                                                  result ->
                                                  geminiInsight =
                                                      result
                                              }
                                              .onFailure {
                                                  error ->
                                                  geminiInsightError =
                                                      error.message
                                                          ?.take(
                                                              180
                                                          )
                                                          ?.takeIf {
                                                              it.isNotBlank()
                                                          }
                                                          ?: "Gemini could not generate an insight. Try again."
                                              }

                                          geminiInsightLoading =
                                              false
                                      }
                                  }
                              },
                          )
                      }
                  }

