              methods = r"""    fun geminiApiKey(): String =
                  prefs.getString(
                      KEY_GEMINI_API_KEY,
                      "",
                  ).orEmpty().trim()

              fun setGeminiApiKey(
                  apiKey: String,
              ) {
                  prefs.edit()
                      .putString(
                          KEY_GEMINI_API_KEY,
                          apiKey.trim(),
                      )
                      .apply()
              }

              fun geminiInsightsEnabled(): Boolean =
                  prefs.getBoolean(
                      KEY_GEMINI_INSIGHTS,
                      true,
                  )

              fun setGeminiInsightsEnabled(
                  enabled: Boolean,
              ) {
                  prefs.edit()
                      .putBoolean(
                          KEY_GEMINI_INSIGHTS,
                          enabled,
                      )
                      .apply()
              }

          """
              store = (
