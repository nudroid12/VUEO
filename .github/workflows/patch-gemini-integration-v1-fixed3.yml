          def require(condition, message):
              if not condition:
                  raise SystemExit(f"Patch sanity failed: {message}")

          def insert_before_line(text, needle, addition, label):
              index = text.find(needle)
              require(index >= 0, f"{label}: marker missing")
              line_start = text.rfind("\n", 0, index) + 1
              return text[:line_start] + addition + text[line_start:]

