      - name: Sanity check screen
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          BUILD="app/build.gradle.kts"

          grep -q 'versionCode = 23' "$BUILD"
          grep -q 'versionName = "0.9.6"' "$BUILD"

          grep -Fq "Who's Watching?" "$PROFILE"
          grep -Fq 'No sign-in required. Profiles are local' "$PROFILE"
          grep -Fq 'WhoWatchingBrandLockup' "$PROFILE"
          grep -Fq 'profiles.chunked(2)' "$PROFILE"
          grep -Fq 'Manage Profiles' "$PROFILE"
          grep -Fq 'Ask on startup' "$PROFILE"
          grep -Fq 'ProfilePickerBottomBar' "$PROFILE"
          grep -Fq 'profile_avatar_adam' "$PROFILE"
          grep -Fq 'profile_avatar_sarah' "$PROFILE"
          grep -Fq 'profile_avatar_kids' "$PROFILE"
          grep -Fq 'import androidx.compose.material3.Surface' "$PROFILE"
          grep -Fq 'onManageProfiles' "$APP"
          grep -Fq 'ProfilePickerDestination.SEARCH' "$APP"
          grep -Fq 'SettingsPage.PROFILES' "$APP"

          test -s app/src/main/res/drawable/profile_avatar_adam.png
          test -s app/src/main/res/drawable/profile_avatar_sarah.png
          test -s app/src/main/res/drawable/profile_avatar_kids.png

          if grep -Fq 'VueoSettingsSectionLabel('               app/src/main/java/com/vueo/app/ui/VueoSettings.kt; then
            echo "::error::Old Settings compile bug returned."
            exit 1
          fi

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoProfiles.kt             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/res/drawable/profile_avatar_adam.png             app/src/main/res/drawable/profile_avatar_sarah.png             app/src/main/res/drawable/profile_avatar_kids.png

          if ! git diff --cached --quiet; then
            git commit -m               "Match Who's Watching to approved VUEO reference"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Who's Watching redesign already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.6-who-watching-reference-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.6 Who's Watching redesign"
            echo
            echo "- Rebuilt only the Who's Watching experience"
            echo "- Centered VUEO lockup and large cinematic heading"
            echo "- Two-column profile cards matching the approved reference"
            echo "- Reference avatar artwork embedded locally"
            echo "- Full-width Manage Profiles row"
            echo "- Ask on startup control matched to reference"
            echo "- Bottom app navigation included and functional"
            echo "- Keeps version 0.9.6, code 23"
          } >> "$GITHUB_STEP_SUMMARY"
