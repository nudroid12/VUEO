name: Patch Gemini Integration v1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Gemini client
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/vueo/app/core/enrichment/GeminiClient.kt <<'KOTLIN'
          package com.vueo.app.core.enrichment

          import com.vueo.app.core.dna.UserDnaSnapshot
          import com.vueo.app.core.model.MediaItem
          import com.vueo.app.core.plugin.PluginHttp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          /**
           * Optional Gemini enhancement.
           *
           * Gemini is never required by VUEO core. Calls only happen after an
           * explicit user action. Raw History and My List entries are not sent.
           */
          object GeminiClient {
              const val DEFAULT_MODEL =
                  "gemini-3.7-flash"

              private const val API_URL =
                  "https://generativelanguage.googleapis.com/v1beta/interactions"

              private val jsonMediaType =
                  "application/json; charset=utf-8"
                      .toMediaType()

              private val client by lazy {
                  PluginHttp.client
                      .newBuilder()
                      .readTimeout(
                          35,
                          TimeUnit.SECONDS,
                      )
                      .callTimeout(
                          40,
                          TimeUnit.SECONDS,
                      )
                      .build()
              }

              suspend fun testConnection(
                  apiKey: String,
                  model: String = DEFAULT_MODEL,
              ): Boolean {
                  if (apiKey.isBlank()) {
                      return false
                  }

                  return runCatching {
                      val response =
                          interact(
                              apiKey = apiKey,
                              model = model,
                              input =
                                  "Reply with exactly VUEO_OK.",
                              systemInstruction =
                                  "Follow the user's instruction exactly.",
                          )

                      response
                          .trim()
                          .contains(
                              "VUEO_OK",
                              ignoreCase = true,
                          )
                  }.getOrDefault(false)
              }

              suspend fun titleInsight(
                  media: MediaItem,
                  dna: UserDnaSnapshot?,
                  dnaMatchPercent: Int?,
                  apiKey: String,
                  model: String = DEFAULT_MODEL,
              ): String {
                  require(
                      apiKey.isNotBlank()
                  ) {
                      "Gemini API key is required."
                  }

                  val dnaContext =
                      dna
                          ?.takeIf {
                              it.topGenres.isNotEmpty()
                          }
                          ?.let {
                              snapshot ->
                              buildString {
                                  append(
                                      "Viewer taste context:\n"
                                  )
                                  append(
                                      "- Top genres: "
                                  )
                                  append(
                                      snapshot.topGenres
                                          .take(5)
                                          .joinToString(
                                              ", "
                                          ) {
                                              affinity ->
                                              "${affinity.name} ${affinity.percent}%"
                                          }
                                  )
                                  append('\n')

                                  if (
                                      snapshot.tasteTags
                                          .isNotEmpty()
                                  ) {
                                      append(
                                          "- Taste tags: "
                                      )
                                      append(
                                          snapshot.tasteTags
                                              .take(5)
                                              .joinToString(
                                                  ", "
                                              )
                                      )
                                      append('\n')
                                  }

                                  append(
                                      "- DNA confidence: "
                                  )
                                  append(
                                      snapshot.confidencePercent
                                  )
                                  append("%\n")

                                  dnaMatchPercent
                                      ?.let {
                                          match ->
                                          append(
                                              "- Visible DNA Match: "
                                          )
                                          append(match)
                                          append("%\n")
                                      }
                              }
                          }
                          .orEmpty()

                  val mediaContext =
                      buildString {
                          append(
                              "Selected title:\n"
                          )
                          append(
                              "- Name: ${media.name}\n"
                          )
                          append(
                              "- Type: ${media.type}\n"
                          )

                          media.releaseInfo
                              ?.takeIf {
                                  it.isNotBlank()
                              }
                              ?.let {
                                  append(
                                      "- Release: $it\n"
                                  )
                              }

                          if (
                              media.genres
                                  .isNotEmpty()
                          ) {
                              append(
                                  "- Genres: "
                              )
                              append(
                                  media.genres
                                      .take(8)
                                      .joinToString(
                                          ", "
                                      )
                              )
                              append('\n')
                          }

                          media.runtimeMinutes
                              ?.takeIf {
                                  it > 0
                              }
                              ?.let {
                                  append(
                                      "- Runtime: ${it} minutes\n"
                                  )
                              }

                          media.imdbRating
                              ?.takeIf {
                                  it.isFinite() &&
                                      it > 0.0
                              }
                              ?.let {
                                  append(
                                      "- IMDb rating: $it\n"
                                  )
                              }

                          media.tmdbRating
                              ?.takeIf {
                                  it.isFinite() &&
                                      it > 0.0
                              }
                              ?.let {
                                  append(
                                      "- TMDB rating: $it\n"
                                  )
                              }

                          media.description
                              ?.trim()
                              ?.takeIf {
                                  it.isNotBlank()
                              }
                              ?.take(1400)
                              ?.let {
                                  append(
                                      "- Overview: $it\n"
                                  )
                              }
                      }

                  val input =
                      buildString {
                          append(mediaContext)

                          if (
                              dnaContext.isNotBlank()
                          ) {
                              append('\n')
                              append(dnaContext)
                          }

                          append(
                              "\nGive a short, useful and spoiler-free insight for this title."
                          )

                          if (
                              dnaContext.isNotBlank()
                          ) {
                              append(
                                  " Explain why it may fit this viewer's taste using only the supplied taste context."
                              )
                          } else {
                              append(
                                  " Focus on what kind of viewing experience the title appears to offer."
                              )
                          }
                      }

                  return interact(
                      apiKey = apiKey,
                      model = model,
                      input = input,
                      systemInstruction =
                          "You are VUEO's optional movie and series assistant. " +
                              "Write 2 to 4 concise sentences in clear English. " +
                              "Stay spoiler-free. Use only facts supplied by VUEO. " +
                              "Do not invent plot details, ratings, cast, awards or availability. " +
                              "If viewer taste context is supplied, explain the fit naturally without claiming certainty.",
                  )
              }

              private suspend fun interact(
                  apiKey: String,
                  model: String,
                  input: String,
                  systemInstruction: String,
              ): String =
                  withContext(
                      Dispatchers.IO
                  ) {
                      val payload =
                          JSONObject()
                              .put(
                                  "model",
                                  model,
                              )
                              .put(
                                  "store",
                                  false,
                              )
                              .put(
                                  "input",
                                  input,
                              )
                              .put(
                                  "system_instruction",
                                  systemInstruction,
                              )

                      val request =
                          Request.Builder()
                              .url(API_URL)
                              .header(
                                  "x-goog-api-key",
                                  apiKey.trim(),
                              )
                              .header(
                                  "Accept",
                                  "application/json",
                              )
                              .header(
                                  "User-Agent",
                                  "VUEO/0.9.6",
                              )
                              .post(
                                  payload
                                      .toString()
                                      .toRequestBody(
                                          jsonMediaType
                                      )
                              )
                              .build()

                      client
                          .newCall(request)
                          .execute()
                          .use {
                              response ->
                              val body =
                                  response.body
                                      .string()

                              if (
                                  !response
                                      .isSuccessful
                              ) {
                                  val message =
                                      runCatching {
                                          JSONObject(body)
                                              .optJSONObject(
                                                  "error"
                                              )
                                              ?.optString(
                                                  "message"
                                              )
                                      }
                                          .getOrNull()
                                          ?.takeIf {
                                              it.isNotBlank()
                                          }
                                          ?: "Request failed"

                                  error(
                                      "Gemini HTTP ${response.code}: $message"
                                  )
                              }

                              extractText(
                                  JSONObject(body)
                              )
                          }
                  }

              private fun extractText(
                  json: JSONObject,
              ): String {
                  val steps =
                      json.optJSONArray(
                          "steps"
                      )
                      ?: error(
                          "Gemini returned no output."
                      )

                  for (
                      stepIndex in
                      steps.length() - 1
                          downTo 0
                  ) {
                      val step =
                          steps.optJSONObject(
                              stepIndex
                          )
                              ?: continue

                      if (
                          step.optString(
                              "type"
                          ) !=
                          "model_output"
                      ) {
                          continue
                      }

                      val content =
                          step.optJSONArray(
                              "content"
                          )
                              ?: continue

                      val parts =
                          mutableListOf<String>()

                      for (
                          contentIndex in
                          0 until content.length()
                      ) {
                          val block =
                              content.optJSONObject(
                                  contentIndex
                              )
                                  ?: continue

                          if (
                              block.optString(
                                  "type"
                              ) != "text"
                          ) {
                              continue
                          }

                          block.optString(
                              "text"
                          )
                              .trim()
                              .takeIf {
                                  it.isNotBlank()
                              }
                              ?.let(
                                  parts::add
                              )
                      }

                      if (
                          parts.isNotEmpty()
                      ) {
                          return parts
                              .joinToString(
                                  "\n"
                              )
                              .trim()
                      }
                  }

                  error(
                      "Gemini returned no text output."
                  )
              }
          }
          KOTLIN

      - name: Patch settings and UI
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(
                      f"Patch sanity failed: {message}"
                  )

          def replace_once(text, old, new, label):
              count = text.count(old)
              require(
                  count == 1,
                  f"{label}: expected 1 anchor, found {count}",
              )
              return text.replace(
                  old,
                  new,
                  1,
              )

          # SettingsStore.kt
          settings_path = Path(
              "app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          )
          settings = settings_path.read_text(
              encoding="utf-8"
          )

          if "fun geminiApiKey()" not in settings:
              marker = """    fun appAccent(): AppAccent =
          """

              addition = """    fun geminiApiKey(): String =
                  prefs.getString(
                      KEY_GEMINI_API_KEY,
                      "",
                  ).orEmpty().trim()

              fun setGeminiApiKey(
                  apiKey: String,
              ) {
                  prefs.edit()
                      .putString(
                          KEY_GEMINI_API_KEY,
                          apiKey.trim(),
                      )
                      .apply()
              }

              fun geminiInsightsEnabled(): Boolean =
                  prefs.getBoolean(
                      KEY_GEMINI_INSIGHTS,
                      true,
                  )

              fun setGeminiInsightsEnabled(
                  enabled: Boolean,
              ) {
                  prefs.edit()
                      .putBoolean(
                          KEY_GEMINI_INSIGHTS,
                          enabled,
                      )
                      .apply()
              }

          """

              settings = replace_once(
                  settings,
                  marker,
                  addition + marker,
                  "SettingsStore Gemini methods",
              )

          if (
              '"gemini_api_key"'
              not in settings
          ):
              marker = """        private const val KEY_APP_ACCENT =
                  "app_accent"
          """

              constants = """        private const val KEY_GEMINI_API_KEY =
                  "gemini_api_key"

              private const val KEY_GEMINI_INSIGHTS =
                  "gemini_ai_insights"

          """

              settings = replace_once(
                  settings,
                  marker,
                  constants + marker,
                  "SettingsStore Gemini constants",
              )

          settings_path.write_text(
              settings,
              encoding="utf-8",
          )

          # VueoBackupManager.kt
          backup_path = Path(
              "app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt"
          )
          backup = backup_path.read_text(
              encoding="utf-8"
          )

          if '"gemini_api_key"' not in backup:
              old = """        "vueo_settings" to setOf(
                      "mdblist_api_key",
                  ),
          """
              new = """        "vueo_settings" to setOf(
                      "mdblist_api_key",
                      "gemini_api_key",
                  ),
          """
              backup = replace_once(
                  backup,
                  old,
                  new,
                  "Backup credential exclusion",
              )

          backup_path.write_text(
              backup,
              encoding="utf-8",
          )

          # VueoSettings.kt
          ui_settings_path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          )
          ui = ui_settings_path.read_text(
              encoding="utf-8"
          )

          if (
              "import com.vueo.app.core.enrichment.GeminiClient"
              not in ui
          ):
              ui = replace_once(
                  ui,
                  "import com.vueo.app.core.enrichment.MdblistClient\n",
                  "import com.vueo.app.core.enrichment.GeminiClient\n"
                  "import com.vueo.app.core.enrichment.MdblistClient\n",
                  "VueoSettings Gemini import",
              )

          if (
              "import androidx.compose.ui.text.input.PasswordVisualTransformation"
              not in ui
          ):
              ui = replace_once(
                  ui,
                  "import androidx.compose.ui.text.font.FontWeight\n",
                  "import androidx.compose.ui.text.font.FontWeight\n"
                  "import androidx.compose.ui.text.input.PasswordVisualTransformation\n",
                  "Password transformation import",
              )

          if "val geminiConfigured =" not in ui:
              old = """    val mdblistConfigured =
                  settingsStore.mdblistApiKey().isNotBlank()
          """
              new = old + """    val geminiConfigured =
                  settingsStore.geminiApiKey().isNotBlank()
          """
              ui = replace_once(
                  ui,
                  old,
                  new,
                  "Settings root Gemini status",
              )

          if 'append(" • Gemini ")' not in ui:
              old = """                        append(" • MDBList ")
                              append(
                                  if (
                                      mdblistConfigured
                                  ) {
                                      "configured"
                                  } else {
                                      "optional"
                                  }
                              )
          """
              new = old + """                        append(" • Gemini ")
                              append(
                                  if (
                                      geminiConfigured
                                  ) {
                                      "configured"
                                  } else {
                                      "optional"
                                  }
                              )
          """
              ui = replace_once(
                  ui,
                  old,
                  new,
                  "Settings root enhancement status",
              )

          start_marker = (
              "@Composable\n"
              "internal fun EnhancementsSettingsScreen("
          )
          end_marker = (
              "@Composable\n"
              "internal fun TmdbEnhancementSettingsScreen("
          )

          start = ui.find(start_marker)
          end = ui.find(
              end_marker,
              start,
          )

          require(
              start >= 0 and end > start,
              "EnhancementsSettingsScreen boundaries missing",
          )

          enhancements_function = r"""@Composable
          internal fun EnhancementsSettingsScreen(
              settingsStore: SettingsStore,
              onBack: () -> Unit,
              onTmdb: () -> Unit,
              onMdblist: () -> Unit,
              onGemini: () -> Unit,
          ) {
              val context = LocalContext.current
              val pluginStore =
                  remember {
                      PluginStore(
                          context.applicationContext
                      )
                  }

              VueoSettingsPage(
                  title = "Enhancements",
                  subtitle =
                      "Optional external services that enrich VUEO.",
                  onBack = onBack,
              ) {
                  item {
                      VueoInfoCard(
                          title = "External and optional",
                          text =
                              "Enhancements add metadata, ratings or AI capabilities. VUEO core and local Personalization continue to work without them.",
                      )
                  }

                  item {
                      VueoSectionLabel(
                          "METADATA & RATINGS"
                      )
                  }

                  item {
                      VueoSettingsNavigationCard(
                          title = "TMDB",
                          subtitle =
                              "Richer metadata, discovery, recommendations, similar titles, and artwork.",
                          status =
                              if (
                                  pluginStore
                                      .tmdbApiKey()
                                      .isNotBlank()
                              ) {
                                  "Configured"
                              } else {
                                  "Not configured"
                              },
                          icon =
                              Icons.Default
                                  .SettingsInputComponent,
                          onClick =
                              onTmdb,
                      )
                  }

                  item {
                      VueoSettingsNavigationCard(
                          title = "MDBList",
                          subtitle =
                              "Optional rating and score enrichment for title details.",
                          status =
                              if (
                                  settingsStore
                                      .mdblistApiKey()
                                      .isNotBlank()
                              ) {
                                  "Configured"
                              } else {
                                  "Not configured"
                              },
                          icon =
                              Icons.Default
                                  .SettingsInputComponent,
                          onClick =
                              onMdblist,
                      )
                  }

                  item {
                      VueoSectionLabel(
                          "AI"
                      )
                  }

                  item {
                      VueoSettingsNavigationCard(
                          title = "Gemini",
                          subtitle =
                              "Optional AI insights for movie and series details.",
                          status =
                              if (
                                  settingsStore
                                      .geminiApiKey()
                                      .isNotBlank()
                              ) {
                                  if (
                                      settingsStore
                                          .geminiInsightsEnabled()
                                  ) {
                                      "Configured • Insights on"
                                  } else {
                                      "Configured • Insights off"
                                  }
                              } else {
                                  "Not configured"
                              },
                          icon =
                              Icons.Default
                                  .SettingsInputComponent,
                          onClick =
                              onGemini,
                      )
                  }
              }
          }

          @Composable
          internal fun GeminiEnhancementSettingsScreen(
              settingsStore: SettingsStore,
              onBack: () -> Unit,
          ) {
              var apiKey by remember {
                  mutableStateOf(
                      settingsStore
                          .geminiApiKey()
                  )
              }

              var saved by remember {
                  mutableStateOf(false)
              }

              val scope =
                  rememberCoroutineScope()

              var testing by remember {
                  mutableStateOf(false)
              }

              var connectionStatus by remember {
                  mutableStateOf<String?>(
                      null
                  )
              }

              var insightsEnabled by remember {
                  mutableStateOf(
                      settingsStore
                          .geminiInsightsEnabled()
                  )
              }

              VueoSettingsPage(
                  title = "Gemini",
                  subtitle =
                      "Optional AI enhancement powered by Google's Gemini API.",
                  onBack = onBack,
              ) {
                  item {
                      VueoStatusCard(
                          title = "Status",
                          value =
                              connectionStatus
                                  ?: if (
                                      apiKey.trim()
                                          .isNotEmpty()
                                  ) {
                                      "Configured"
                                  } else {
                                      "Not configured"
                                  },
                          text =
                              "VUEO uses Gemini only after an explicit action. The API key is stored locally on this device.",
                      )
                  }

                  item {
                      Card(
                          shape =
                              RoundedCornerShape(
                                  18.dp
                              ),
                          colors =
                              CardDefaults
                                  .cardColors(
                                      containerColor =
                                          VueoPalette.Surface,
                                  ),
                      ) {
                          Column(
                              modifier =
                                  Modifier.padding(
                                      16.dp
                                  ),
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      10.dp
                                  ),
                          ) {
                              Text(
                                  text = "API Key",
                                  color =
                                      Color.White,
                                  fontWeight =
                                      FontWeight.Bold,
                              )

                              OutlinedTextField(
                                  value = apiKey,
                                  onValueChange = {
                                      apiKey = it
                                      saved = false
                                      connectionStatus =
                                          null
                                  },
                                  modifier =
                                      Modifier
                                          .fillMaxWidth(),
                                  singleLine = true,
                                  label = {
                                      Text(
                                          "Gemini API Key"
                                      )
                                  },
                                  visualTransformation =
                                      PasswordVisualTransformation(),
                              )

                              Row(
                                  horizontalArrangement =
                                      Arrangement.spacedBy(
                                          8.dp
                                      ),
                              ) {
                                  Button(
                                      onClick = {
                                          settingsStore
                                              .setGeminiApiKey(
                                                  apiKey
                                              )
                                          saved = true
                                          connectionStatus =
                                              null
                                      },
                                  ) {
                                      Text("Save")
                                  }

                                  OutlinedButton(
                                      enabled =
                                          !testing,
                                      onClick = {
                                          val key =
                                              apiKey.trim()

                                          if (
                                              key.isBlank()
                                          ) {
                                              connectionStatus =
                                                  "Enter API key"
                                          } else {
                                              testing = true
                                              connectionStatus =
                                                  "Testing..."

                                              scope.launch {
                                                  val ok =
                                                      GeminiClient
                                                          .testConnection(
                                                              key
                                                          )

                                                  connectionStatus =
                                                      if (ok) {
                                                          "Connected"
                                                      } else {
                                                          "Connection failed"
                                                      }

                                                  testing = false
                                              }
                                          }
                                      },
                                  ) {
                                      Text(
                                          if (
                                              testing
                                          ) {
                                              "Testing..."
                                          } else {
                                              "Test Connection"
                                          }
                                      )
                                  }
                              }

                              if (saved) {
                                  Text(
                                      text =
                                          "Gemini configuration saved locally.",
                                      color =
                                          VueoPalette.Accent,
                                      fontSize =
                                          11.sp,
                                      fontWeight =
                                          FontWeight.Bold,
                                  )
                              }
                          }
                      }
                  }

                  item {
                      VueoSectionLabel(
                          "FEATURES"
                      )
                  }

                  item {
                      VueoSettingsToggleCard(
                          title = "AI Insights",
                          subtitle =
                              "Show an optional Gemini Insight card on movie and series details. Gemini is called only when you tap Generate Insight.",
                          checked =
                              insightsEnabled,
                          enabled =
                              apiKey.trim()
                                  .isNotEmpty(),
                          onCheckedChange = {
                              enabled ->
                              insightsEnabled =
                                  enabled

                              settingsStore
                                  .setGeminiInsightsEnabled(
                                      enabled
                                  )
                          },
                      )
                  }

                  item {
                      VueoStatusCard(
                          title = "Model",
                          value =
                              "Gemini 3.7 Flash",
                          text =
                              "VUEO uses the stable gemini-3.7-flash model for concise title insights.",
                      )
                  }

                  item {
                      VueoInfoCard(
                          title = "Privacy & usage",
                          text =
                              "Generate Insight sends selected-title metadata to Google's Gemini API. If User DNA is enabled, VUEO may also send a compact taste summary such as top genres and DNA confidence. Raw History, My List and playback records are not sent. Requests can count against your Gemini API quota or billing.",
                      )
                  }
              }
          }

          """

          ui = (
              ui[:start] +
              enhancements_function +
              ui[end:]
          )

          ui_settings_path.write_text(
              ui,
              encoding="utf-8",
          )

          # VueoApp.kt
          app_path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )
          app = app_path.read_text(
              encoding="utf-8"
          )

          if (
              "import com.vueo.app.core.enrichment.GeminiClient"
              not in app
          ):
              app = replace_once(
                  app,
                  "import com.vueo.app.core.enrichment.MdblistClient\n",
                  "import com.vueo.app.core.enrichment.GeminiClient\n"
                  "import com.vueo.app.core.enrichment.MdblistClient\n",
                  "VueoApp Gemini import",
              )

          if "    GEMINI,\n" not in app:
              app = replace_once(
                  app,
                  "    MDBLIST,\n",
                  "    MDBLIST,\n"
                  "    GEMINI,\n",
                  "SettingsPage GEMINI enum",
              )

          parent_start = app.find(
              "private fun parentSettingsPage("
          )
          parent_end = app.find(
              "private enum class HomeMediaFilter",
              parent_start,
          )
          parent = app[
              parent_start:
              parent_end
          ]

          if "SettingsPage.GEMINI" not in parent:
              parent = replace_once(
                  parent,
                  """        SettingsPage.TMDB,
                      SettingsPage.MDBLIST ->
                          SettingsPage.ENHANCEMENTS
          """,
                  """        SettingsPage.TMDB,
                      SettingsPage.MDBLIST,
                      SettingsPage.GEMINI ->
                          SettingsPage.ENHANCEMENTS
          """,
                  "Gemini parent settings route",
              )

              app = (
                  app[:parent_start] +
                  parent +
                  app[parent_end:]
              )

          if "onGemini = {" not in app:
              old = """                            onMdblist = {
                                      settingsPage = SettingsPage.MDBLIST
                                  },
                              )
          """
              new = """                            onMdblist = {
                                      settingsPage = SettingsPage.MDBLIST
                                  },
                                  onGemini = {
                                      settingsPage = SettingsPage.GEMINI
                                  },
                              )
          """
              app = replace_once(
                  app,
                  old,
                  new,
                  "Enhancements onGemini route",
              )

          route_marker = """                    SettingsPage.PLAYBACK ->
                                  PlaybackSettingsScreen(
          """

          if (
              "GeminiEnhancementSettingsScreen("
              not in app
          ):
              gemini_route = """                    SettingsPage.GEMINI ->
                                  GeminiEnhancementSettingsScreen(
                                      settingsStore =
                                          settingsStore,
                                      onBack = {
                                          settingsPage =
                                              SettingsPage.ENHANCEMENTS
                                      },
                                  )

          """
              app = replace_once(
                  app,
                  route_marker,
                  gemini_route +
                      route_marker,
                  "Gemini settings screen route",
              )

          details_start = app.find(
              "@Composable\nprivate fun MediaDetailsScreen("
          )
          details_end = app.find(
              "@Composable\nprivate fun DetailsLoadingSkeleton(",
              details_start,
          )

          require(
              details_start >= 0 and
                  details_end > details_start,
              "MediaDetailsScreen boundaries missing",
          )

          details = app[
              details_start:
              details_end
          ]

          if "var geminiInsight by remember(" not in details:
              marker = """    var inWatchlist by remember(
          """
              addition = """    var geminiInsight by remember(
                  initialItem.id,
                  initialItem.type,
              ) {
                  mutableStateOf<String?>(
                      null
                  )
              }

              var geminiInsightLoading by remember(
                  initialItem.id,
                  initialItem.type,
              ) {
                  mutableStateOf(false)
              }

              var geminiInsightError by remember(
                  initialItem.id,
                  initialItem.type,
              ) {
                  mutableStateOf<String?>(
                      null
                  )
              }

          """
              details = replace_once(
                  details,
                  marker,
                  addition + marker,
                  "Gemini detail state",
              )

          if "val geminiAvailable =" not in details:
              lazy_at = details.find(
                  "    LazyColumn("
              )
              require(
                  lazy_at >= 0,
                  "Details LazyColumn marker missing",
              )

              addition = """    val geminiApiKey =
                  settingsStore
                      .geminiApiKey()

              val geminiAvailable =
                  geminiApiKey
                      .isNotBlank() &&
                      settingsStore
                          .geminiInsightsEnabled()

          """

              details = (
                  details[:lazy_at] +
                  addition +
                  details[lazy_at:]
              )

          if '"details_gemini_insight"' not in details:
              marker = """        val featuredCompanies =
          """

              block = """        if (
                  geminiAvailable &&
                  !loadingMeta
              ) {
                  item(
                      key =
                          "details_gemini_insight"
                  ) {
                      GeminiInsightCard(
                          insight =
                              geminiInsight,
                          loading =
                              geminiInsightLoading,
                          error =
                              geminiInsightError,
                          onGenerate = {
                              if (
                                  !geminiInsightLoading
                              ) {
                                  geminiInsightLoading =
                                      true
                                  geminiInsightError =
                                      null

                                  scope.launch {
                                      val dnaForInsight =
                                          if (
                                              detailsDnaPreferences
                                                  .userDnaEnabled(
                                                      detailsProfileId
                                                  )
                                          ) {
                                              detailsDnaEngine
                                                  .build()
                                          } else {
                                              null
                                          }

                                      val visibleMatch =
                                          if (
                                              showDnaMatch &&
                                              dnaForInsight
                                                  ?.hasUsefulData ==
                                                  true
                                          ) {
                                              detailsDnaEngine
                                                  .matchPercent(
                                                      media =
                                                          item,
                                                      dna =
                                                          dnaForInsight,
                                                  )
                                          } else {
                                              null
                                          }

                                      runCatching {
                                          GeminiClient
                                              .titleInsight(
                                                  media =
                                                      item,
                                                  dna =
                                                      dnaForInsight,
                                                  dnaMatchPercent =
                                                      visibleMatch,
                                                  apiKey =
                                                      geminiApiKey,
                                              )
                                      }
                                          .onSuccess {
                                              result ->
                                              geminiInsight =
                                                  result
                                          }
                                          .onFailure {
                                              geminiInsightError =
                                                  "Gemini could not generate an insight. Try again."
                                          }

                                      geminiInsightLoading =
                                          false
                                  }
                              }
                          },
                      )
                  }
              }

          """

              details = replace_once(
                  details,
                  marker,
                  block + marker,
                  "Gemini detail card insertion",
              )

          app = (
              app[:details_start] +
              details +
              app[details_end:]
          )

          if "private fun GeminiInsightCard(" not in app:
              marker = (
                  "@Composable\n"
                  "private fun DetailsFactsRow("
              )
              insert_at = app.find(
                  marker
              )

              require(
                  insert_at >= 0,
                  "DetailsFactsRow anchor missing",
              )

              component = r"""@Composable
          private fun GeminiInsightCard(
              insight: String?,
              loading: Boolean,
              error: String?,
              onGenerate: () -> Unit,
          ) {
              Surface(
                  modifier =
                      Modifier
                          .fillMaxWidth()
                          .padding(
                              horizontal =
                                  18.dp
                          ),
                  shape =
                      RoundedCornerShape(
                          16.dp
                      ),
                  color =
                      VueoPalette
                          .SurfaceElevated,
                  border =
                      androidx.compose
                          .foundation
                          .BorderStroke(
                              width = 1.dp,
                              color =
                                  VueoPalette.Accent
                                      .copy(
                                          alpha =
                                              .16f
                                      ),
                          ),
              ) {
                  Column(
                      modifier =
                          Modifier.padding(
                              14.dp
                          ),
                      verticalArrangement =
                          Arrangement.spacedBy(
                              9.dp
                          ),
                  ) {
                      Row(
                          modifier =
                              Modifier
                                  .fillMaxWidth(),
                          verticalAlignment =
                              Alignment.CenterVertically,
                      ) {
                          Column(
                              modifier =
                                  Modifier.weight(
                                      1f
                                  ),
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      2.dp
                                  ),
                          ) {
                              Text(
                                  text =
                                      "Gemini Insight",
                                  color =
                                      Color.White,
                                  fontSize =
                                      17.sp,
                                  fontWeight =
                                      FontWeight.Black,
                              )

                              Text(
                                  text =
                                      "Optional AI • generated on demand",
                                  color =
                                      VueoPalette.Muted,
                                  fontSize =
                                      10.sp,
                              )
                          }

                          Surface(
                              shape =
                                  RoundedCornerShape(
                                      50
                                  ),
                              color =
                                  VueoPalette.Accent
                                      .copy(
                                          alpha =
                                              .10f
                                      ),
                          ) {
                              Text(
                                  text =
                                      "GEMINI",
                                  modifier =
                                      Modifier.padding(
                                          horizontal =
                                              8.dp,
                                          vertical =
                                              4.dp,
                                      ),
                                  color =
                                      VueoPalette.Accent,
                                  fontSize =
                                      9.sp,
                                  fontWeight =
                                      FontWeight.Black,
                              )
                          }
                      }

                      insight
                          ?.takeIf {
                              it.isNotBlank()
                          }
                          ?.let {
                              Text(
                                  text = it,
                                  color =
                                      Color.White
                                          .copy(
                                              alpha =
                                                  .76f
                                          ),
                                  fontSize =
                                      12.sp,
                                  lineHeight =
                                      18.sp,
                              )
                          }

                      error
                          ?.takeIf {
                              it.isNotBlank()
                          }
                          ?.let {
                              Text(
                                  text = it,
                                  color =
                                      VueoPalette.Muted,
                                  fontSize =
                                      11.sp,
                              )
                          }

                      OutlinedButton(
                          enabled =
                              !loading,
                          onClick =
                              onGenerate,
                      ) {
                          Text(
                              if (loading) {
                                  "Generating..."
                              } else if (
                                  insight
                                      .isNullOrBlank()
                              ) {
                                  "Generate Insight"
                              } else {
                                  "Refresh Insight"
                              }
                          )
                      }
                  }
              }
          }

          """

              app = (
                  app[:insert_at] +
                  component +
                  app[insert_at:]
              )

          app_path.write_text(
              app,
              encoding="utf-8",
          )

          combined = (
              settings +
              backup +
              ui +
              app
          )

          required = [
              "fun geminiApiKey()",
              "KEY_GEMINI_API_KEY",
              '"gemini_api_key"',
              "GeminiEnhancementSettingsScreen(",
              "onGemini: () -> Unit",
              "SettingsPage.GEMINI",
              "GeminiClient",
              '"details_gemini_insight"',
              "private fun GeminiInsightCard(",
              '"More Like This"',
              '"Personalization"',
          ]

          missing = [
              item
              for item in required
              if item not in combined
          ]

          require(
              not missing,
              f"missing markers: {missing}",
          )

          require(
              ui.count(
                  "internal fun GeminiEnhancementSettingsScreen("
              ) == 1,
              "duplicate Gemini settings screen",
          )

          require(
              app.count(
                  "private fun GeminiInsightCard("
              ) == 1,
              "duplicate Gemini insight card",
          )

          print(
              "Gemini integration v1 patch applied."
          )
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'gemini-3.7-flash' \
            app/src/main/java/com/vueo/app/core/enrichment/GeminiClient.kt

          grep -q 'fun geminiApiKey' \
            app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt

          grep -q 'GeminiEnhancementSettingsScreen' \
            app/src/main/java/com/vueo/app/ui/VueoSettings.kt

          grep -q 'details_gemini_insight' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q '"More Like This"' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          echo "Gemini patch markers validated."

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/vueo/app/core/enrichment/GeminiClient.kt \
            app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt \
            app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt \
            app/src/main/java/com/vueo/app/ui/VueoSettings.kt \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          git commit -m "feat: add optional Gemini AI insights"
          git push origin HEAD:main
