name: Build VUEO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-vueo-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"

concurrency:
  group: vueo-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew || {
            echo "::error::gradlew is missing from repository root."
            exit 1
          }

          test -f ./gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          }

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          # Accept already-known Android SDK licences.
          # Redirect yes stderr so a normal closed pipe does not print
          # the misleading "Broken pipe" message.
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # API 36 is Android 16 stable. Keep SDK installation on stable channel.
          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify project SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Configured SDK levels:"
          grep -nE 'compileSdk|targetSdk|minSdk' app/build.gradle.kts || true

          if grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*37' app/build.gradle.kts; then
            echo "::error::app/build.gradle.kts still uses compileSdk = 37."
            echo "::error::Replace it with compileSdk = 36 before building."
            exit 1
          fi

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version

          echo
          echo "Installed Android platforms:"
          if [ -n "${ANDROID_HOME:-}" ]; then
            ls -la "${ANDROID_HOME}/platforms" || true
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          echo "Generated APK files:"
          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print || true

          if ! find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print -quit \
              | grep -q .; then
            echo "::error::Build finished without a debug APK."
            exit 1
          fi

      - name: Upload VUEO APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Android Build"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_NUMBER}\`"
            echo "- compileSdk: \`36\`"
            echo "- targetSdk: \`36\`"
            echo
            if find app/build/outputs/apk/debug \
                -maxdepth 1 -type f -name "*.apk" \
                -print -quit 2>/dev/null | grep -q .; then
              echo "### APK generated"
              find app/build/outputs/apk/debug \
                -maxdepth 1 -type f -name "*.apk" \
                -printf -- "- \`%f\`\n"
            else
              echo "### APK not generated"
              echo "Open the failed build step above for the compiler error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
