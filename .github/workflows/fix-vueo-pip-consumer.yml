name: Fix VUEO PiP Consumer Compile Error

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-pip-consumer-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix PiP Consumer type
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoPictureInPicture.kt"
          )

          if not path.exists():
              raise SystemExit(
                  f"Missing expected VUEO file: {path}"
              )

          text = path.read_text(encoding="utf-8")
          original = text

          java_import = "import java.util.function.Consumer"
          androidx_import = "import androidx.core.util.Consumer"

          # androidx.activity.ComponentActivity PiP listener APIs expect
          # androidx.core.util.Consumer, not java.util.function.Consumer.
          if java_import in text:
              text = text.replace(
                  java_import,
                  androidx_import,
                  1,
              )

          # Defensive fallback in case the type was fully qualified.
          text = text.replace(
              "java.util.function.Consumer<",
              "androidx.core.util.Consumer<",
          )

          if java_import in text:
              raise SystemExit(
                  "java.util.function.Consumer is still imported."
              )

          if "java.util.function.Consumer<" in text:
              raise SystemExit(
                  "A fully qualified java.util.function.Consumer remains."
              )

          if androidx_import not in text and \
             "androidx.core.util.Consumer<" not in text:
              raise SystemExit(
                  "Could not establish androidx.core.util.Consumer usage."
              )

          if text == original:
              print(
                  "PiP Consumer fix already appears to be applied."
              )
              changed = False
          else:
              path.write_text(
                  text,
                  encoding="utf-8",
              )
              changed = True
              print(f"Updated: {path}")

          with open(
              __import__("os").environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"changed={'true' if changed else 'false'}\n"
              )
          PY

      - name: Show targeted diff
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git diff -- \
            app/src/main/java/com/vueo/app/ui/VueoPictureInPicture.kt

          if git status --short | \
             grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch unexpectedly modified workflow files."
            exit 1
          fi

      - name: Set up JDK 17
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        if: steps.patch.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Kotlin
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Commit verified fix
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/vueo/app/ui/VueoPictureInPicture.kt

          git commit -m \
            "fix: use AndroidX Consumer for PiP listener"

          git push origin HEAD:main

      - name: Trigger central VUEO build
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=vueo_build

          echo "Triggered repository_dispatch: vueo_build"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO PiP Consumer Fix"
            echo
            echo "- Target: VueoPictureInPicture.kt"
            echo "- Fix: java.util.function.Consumer -> androidx.core.util.Consumer"
            echo "- Reason: AndroidX PiP listener API requires androidx.core.util.Consumer"
            echo "- Player behavior is otherwise unchanged"
            echo "- Next Episode and PiP features are preserved"
          } >> "$GITHUB_STEP_SUMMARY"
