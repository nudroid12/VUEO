          with tarfile.open(
              fileobj=io.BytesIO(archive),
              mode="r:gz",
          ) as tf:
              for member in tf.getmembers():
                  target = Path(member.name)

                  if (
                      target.is_absolute() or
                      ".." in target.parts or
                      str(target).startswith(".github/")
                  ):
                      raise SystemExit(
                          f"Unsafe patch path: {member.name}"
                      )

              tf.extractall(".")

          print("Applied VUEO v0.3.6 final plugin cleanup.")
