      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.3.6"'             app/build.gradle.kts

          grep -q 'NEEDS_SETUP("Needs Setup")'             app/src/main/java/com/vueo/app/core/plugin/PluginHealthStore.kt

          grep -q '__crypto_aes_decrypt_raw'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q '__vueoCryptoJsModule'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q 'classifyProviderFailure'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q 'object SourceCleaner'             app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          grep -q 'Unique Sources'             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'element.`is`(selector)'             app/src/main/java/com/vueo/app/core/plugin/HtmlCompatBridge.kt

          if grep -q 'var CryptoJS = {'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt; then
            echo "::error::CryptoJS global collision remains."
            exit 1
          fi

          if grep -q 'var cheerio = {'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt; then
            echo "::error::Cheerio global collision remains."
            exit 1
          fi

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.3.6 sanity checks passed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||              [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name "github-actions[bot]"
            git config user.email               "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m                 "Finish plugin runtime cleanup and source grouping"

              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Build VUEO v0.3.6 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR"             -maxdepth 1             -type f             -name "*.apk"             -print || true

          if ! find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit | grep -q .; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload VUEO v0.3.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.3.6-debug-${ github.run_number }
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.3.6"
            echo
            echo "- ShowBox module collision fix"
            echo "- Binary-safe base64 compatibility"
            echo "- Castle native AES compatibility hook"
            echo "- Rich provider health classification"
            echo "- Exact source deduplication"
            echo "- 4K / 1080p / 720p / Other source grouping"
            echo "- Plugin phase intentionally closed after this milestone"
            echo "- APK built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
