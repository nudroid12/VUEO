          xM1Olu6hcsaP4f0quD6phIxusTDWl6SqrtQ5P+1b70+1Z2LWe/HRH9PogIL2HtdRrM+52XAVZclY5qzKb1HcGxn1YFruO9sF8pew
          3105payu1bW6VtfqWl2ra3WtrtW1ulbX6lpdq2t1ra7VtbpW1+paXatrda2u1bW6VlfF9X8ZUp41ADgEAA==
          """.replace("\n", "").replace(" ", "")

          archive = base64.b64decode(payload)

          with tarfile.open(
              fileobj=io.BytesIO(archive),
              mode="r:gz",
          ) as tf:
              for member in tf.getmembers():
                  target = Path(member.name)

                  if (
                      target.is_absolute() or
                      ".." in target.parts or
                      str(target).startswith(".github/")
                  ):
                      raise SystemExit(
                          f"Unsafe patch path: {member.name}"
                      )

              tf.extractall(".")

          print("Applied VUEO v0.4.0 Fast Source Engine.")
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.4.0"'             app/build.gradle.kts

          grep -q 'data class PluginDiscoveryProgress'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q 'discoverProgressive'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q 'resolveStreamsProgressive'             app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          grep -q 'object SourceDiscoveryCache'             app/src/main/java/com/vueo/app/core/extensions/SourceDiscoveryCache.kt

          grep -q '@Synchronized'             app/src/main/java/com/vueo/app/core/plugin/PluginHealthStore.kt

          grep -q 'SMART SOURCE ENGINE'             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'sourceDiscoveryJob'             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if grep -Fq 'health.error?.let'             app/src/main/java/com/vueo/app/ui/VueoApp.kt; then
            echo "::error::v0.3.6 null-safety hotfix was lost."
            exit 1
          fi

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.4.0 sanity checks passed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||              [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name "github-actions[bot]"
            git config user.email               "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m                 "Add progressive fast source engine"

              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Build VUEO v0.4.0 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR"             -maxdepth 1             -type f             -name "*.apk"             -print || true

          if ! find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit | grep -q .; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload VUEO v0.4.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.4.0-debug-${ github.run_number }
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.4.0"
            echo
            echo "- Source Picker opens immediately"
            echo "- Progressive Stremio source results"
            echo "- Progressive plugin source results"
            echo "- Health-first plugin scheduling"
            echo "- 2-minute recent source cache"
            echo "- Dynamic Play Best updates"
            echo "- Time-to-first-source indicator"
            echo "- Leaving Source Picker cancels discovery"
            echo "- Serialized Provider Health writes"
            echo "- APK built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
