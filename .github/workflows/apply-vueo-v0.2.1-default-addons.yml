name: Apply VUEO v0.2.1 Default Addons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.2.1 source patch
        shell: bash
        env:
          VUEO_PATCH_FILES: '{"app/build.gradle.kts":"","app/src/main/java/com/vueo/app/core/extensions/ExtensionModels.kt":"","app/src/main/java/com/vueo/app/core/storage/AddonStore.kt":"","app/src/main/java/com/vueo/app/ui/VueoApp.kt":"","README.md":""}'
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = json.loads(os.environ["VUEO_PATCH_FILES"])

          for rel, encoded in files.items():
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f"updated: {rel}")

          print(f"Applied {len(files)} v0.2.1 source files.")
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.2.1"' app/build.gradle.kts
          grep -q 'yastream.tamthai.de/manifest.json'             app/src/main/java/com/vueo/app/core/storage/AddonStore.kt
          grep -q 'v3-cinemeta.strem.io/manifest.json'             app/src/main/java/com/vueo/app/core/storage/AddonStore.kt
          grep -q 'opensubtitles-v3.strem.io/manifest.json'             app/src/main/java/com/vueo/app/core/storage/AddonStore.kt
          grep -q 'Catalog & Metadata'             app/src/main/java/com/vueo/app/core/extensions/ExtensionModels.kt
          grep -q 'DEV DEFAULT'             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if git status --short | grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "v0.2.1 sanity checks passed."

      - name: Show changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app README.md

          if git diff --cached --quiet; then
            echo "No staged source changes."
            exit 0
          fi

          git commit -m "Seed default addons and group addon types"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.2.1"
            echo
            echo "- Seeded YaStream for development"
            echo "- Seeded Cinemeta for development"
            echo "- Seeded OpenSubtitles v3 for development"
            echo "- Defaults are removable and only seeded once"
            echo "- Addons grouped by manifest capability"
            echo "- No GitHub workflow files modified"
          } >> "$GITHUB_STEP_SUMMARY"
