name: VUEO Central Build and Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"

  repository_dispatch:
    types:
      - vueo_build

permissions:
  contents: write

concurrency:
  group: vueo-dev-publish
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build, Sign and Publish VUEO
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm updater is installed
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/core/update/VueoUpdateManager.kt"

          test -f "$FILE" || {
            echo "::error::VUEO updater source is missing."
            exit 1
          }

          grep -q "VUEO_DEV_RELEASE_MANIFEST" "$FILE" || {
            echo "::error::VUEO updater release manifest support is missing."
            exit 1
          }

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing VUEO_KEYSTORE_BASE64 or VUEO_KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew || {
            echo "::error::gradlew is missing."
            exit 1
          }

          test -f ./gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          }

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare signed release metadata
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION_CODE="$(date -u +%s)"

          if [ "$VERSION_CODE" -ge 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large."
            exit 1
          fi

          BASE_VERSION="$(
            python3 <<'PY'
          from pathlib import Path
          import re

          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")

          patterns = [
              r'versionName\s*=\s*vueoCiVersionName\s*\?:\s*"([^"]+)"',
              r'versionName\s*=\s*"([^"]+)"',
          ]

          value = None

          for pattern in patterns:
              match = re.search(pattern, text)
              if match:
                  value = match.group(1).strip()
                  break

          print(value or "0.0.0")
          PY
          )"

          VERSION_NAME="${BASE_VERSION}-dev.${VERSION_CODE}"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/vueo-dev-signing.jks"

          test -s "$RUNNER_TEMP/vueo-dev-signing.jks" || {
            echo "::error::Decoded signing keystore is empty."
            exit 1
          }

          {
            echo "VUEO_VERSION_CODE=$VERSION_CODE"
            echo "VUEO_VERSION_NAME=$VERSION_NAME"
            echo "VUEO_KEYSTORE_PATH=$RUNNER_TEMP/vueo-dev-signing.jks"
            echo "VUEO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Building VUEO $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "::error::Release APK was not generated."
            exit 1
          }

          APKSIGNER="$(find "${ANDROID_HOME}" -path "*/build-tools/36.0.0/apksigner" -print -quit)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner 36.0.0 was not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp \
            app/build/outputs/apk/release/app-release.apk \
            dist/VUEO-dev.apk

          SHA256="$(
            sha256sum dist/VUEO-dev.apk \
              | awk '{print $1}'
          )"

          PUBLISHED_AT="$(
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          )"

          COMMIT_SHA="$(
            git rev-parse HEAD
          )"

          export SHA256 PUBLISHED_AT COMMIT_SHA

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "schemaVersion": 1,
              "versionCode": int(
                  os.environ["VUEO_VERSION_CODE"]
              ),
              "versionName":
                  os.environ["VUEO_VERSION_NAME"],
              "title":
                  "VUEO " +
                  os.environ["VUEO_VERSION_NAME"],
              "changelog": [
                  "Latest successful VUEO development build",
                  "Commit " +
                  os.environ["COMMIT_SHA"][:7],
              ],
              "downloadUrl":
                  "https://github.com/nudroid12/VUEO/releases/download/vueo-dev/VUEO-dev.apk",
              "sha256":
                  os.environ["SHA256"],
              "publishedAt":
                  os.environ["PUBLISHED_AT"],
          }

          Path("dist/update.json").write_text(
              json.dumps(
                  payload,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

          sha256sum dist/VUEO-dev.apk \
            > dist/VUEO-dev.apk.sha256

          echo "Release files:"
          ls -lh dist/

      - name: Publish rolling VUEO Dev release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view vueo-dev >/dev/null 2>&1; then
            gh release create vueo-dev \
              --target main \
              --title "VUEO Dev" \
              --prerelease \
              --notes "Rolling development release. Only successful signed builds are published."
          fi

          gh release upload vueo-dev \
            dist/VUEO-dev.apk \
            dist/VUEO-dev.apk.sha256 \
            dist/update.json \
            --clobber

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-signed-dev-${{ github.run_id }}
          path: |
            dist/VUEO-dev.apk
            dist/VUEO-dev.apk.sha256
            dist/update.json
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Central Build"
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Branch: \`main\`"
            echo "- Commit: \`$(git rev-parse HEAD 2>/dev/null || echo unknown)\`"
            echo "- Version: \`${VUEO_VERSION_NAME:-not-built}\`"
            echo "- Version code: \`${VUEO_VERSION_CODE:-not-built}\`"
            echo
            echo "### Release"
            echo "- Tag: \`vueo-dev\`"
            echo "- APK: \`VUEO-dev.apk\`"
            echo "- Feed: \`update.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
