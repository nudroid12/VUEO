name: Build VUEO Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"

  repository_dispatch:
    types:
      - vueo_build

concurrency:
  group: vueo-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew || {
            echo "::error::gradlew is missing from repository root."
            exit 1
          }

          test -f ./gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          }

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          echo "Generated APK files:"
          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print || true

          if ! find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print -quit \
              | grep -q .; then
            echo "::error::Build finished without a debug APK."
            exit 1
          fi

      - name: Upload VUEO APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Android Build"
            echo
            echo "- Branch: \`main\`"
            echo "- Commit: \`$(git rev-parse HEAD 2>/dev/null || echo unknown)\`"
            echo "- Run: \`${GITHUB_RUN_NUMBER}\`"
            echo
            echo "### APK files"
            found=false
            if [ -d app/build/outputs/apk/debug ]; then
              for apk in app/build/outputs/apk/debug/*.apk; do
                if [ -f "$apk" ]; then
                  echo "- \`$(basename "$apk")\`"
                  found=true
                fi
              done
            fi
            if [ "$found" = false ]; then
              echo "No APK was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
