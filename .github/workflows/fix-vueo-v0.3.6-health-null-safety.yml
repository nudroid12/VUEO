name: Fix VUEO v0.3.6 Health Null Safety

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix ProviderHealthRecord null safety
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )

          if not path.exists():
              raise SystemExit(
                  "VueoApp.kt not found. Apply v0.3.6 first."
              )

          text = path.read_text(encoding="utf-8")

          old = "            health.error?.let { error ->"
          new = "            health?.error?.let { error ->"

          if old in text:
              path.write_text(
                  text.replace(old, new, 1),
                  encoding="utf-8",
              )
              print("Fixed ProviderHealthRecord null safety.")
          elif new in text:
              print("Hotfix already applied.")
          else:
              raise SystemExit(
                  "Expected health.error block was not found."
              )
          PY

      - name: Verify hotfix
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/ui/VueoApp.kt"

          grep -n -A8 -B8 \
            'health?.error?.let' \
            "$FILE"

          if grep -Fq 'health.error?.let' "$FILE"; then
            echo "::error::Unsafe nullable health access still exists."
            exit 1
          fi

          echo "Null-safety source check passed."

      - name: Commit and push hotfix
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              app/src/main/java/com/vueo/app/ui/VueoApp.kt

            git commit -m \
              "Fix v0.3.6 provider health null safety"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Hotfix already present. Continuing to build."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew || {
            echo "::error::gradlew is missing."
            exit 1
          }

          test -f ./gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper configuration is missing."
            exit 1
          }

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build VUEO v0.3.6 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          echo "Generated APK files:"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

          if ! find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit | grep -q .; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload fixed VUEO v0.3.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.3.6-fixed-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.3.6 Build Hotfix"
            echo
            echo "- Fixed nullable ProviderHealthRecord access"
            echo "- Existing v0.3.6 plugin cleanup retained"
            echo "- Existing source grouping retained"
            echo "- APK rebuilt in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
