name: VUEO Updater and Auto Publish v2

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: write

concurrency:
  group: vueo-dev-publish
  cancel-in-progress: true

jobs:
  bootstrap-updater:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

