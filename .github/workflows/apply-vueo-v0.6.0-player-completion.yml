      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.6.0"' \
            app/build.gradle.kts

          grep -q 'PlayerFullscreenEffect' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'PlayerTrackChoice' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'setOverrideForType' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'Resume playback?' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'Other Source' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'fun clearPosition(' \
            app/src/main/java/com/vueo/app/core/storage/PlaybackStore.kt

          grep -q 'return@coroutineScope it.take(maxRows)' \
            app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          grep -q 'private fun SearchScreen' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'SMART SOURCE ENGINE' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if grep -Fq 'health.error?.let' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt; then
            echo "::error::v0.3.6 null-safety hotfix was lost."
            exit 1
          fi

          if git status --short | \
             grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.6.0 sanity checks passed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet || \
             [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name \
              "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m \
                "Complete VUEO player experience"

              git push origin \
                "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f \
            ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if \
              [ -n "${ANDROID_HOME:-}" ] && \
              [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo \
                "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Build VUEO v0.6.0 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo \
              "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload VUEO v0.6.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.6.0-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.6.0"
            echo
            echo "- Immersive fullscreen playback"
            echo "- Resume or Start Over prompt"
            echo "- Periodic playback progress saving"
            echo "- Audio track selector"
            echo "- Subtitle track selector"
            echo "- External subtitle labels"
            echo "- Friendly playback error recovery"
            echo "- Retry and Other Source actions"
            echo "- v0.5 coroutine hotfix retained"
            echo "- APK built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
