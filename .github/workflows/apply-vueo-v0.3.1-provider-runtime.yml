name: Apply VUEO v0.3.1 Provider Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3.1 source patch
        shell: bash
        env:
          VUEO_PATCH_FILES: '{"app/build.gradle.kts":"","app/src/main/java/com/vueo/app/core/model/MediaModels.kt":"","app/src/main/java/com/vueo/app/core/plugin/PluginStore.kt":"","app/src/main/java/com/vueo/app/core/plugin/TmdbResolver.kt":"","app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt":"","app/src/main/java/com/vueo/app/ui/VueoApp.kt":"","README.md":"","ARCHITECTURE.md":""}'
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = json.loads(
              os.environ["VUEO_PATCH_FILES"]
          )

          for rel, encoded in files.items():
              path = Path(rel)
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              path.write_bytes(
                  base64.b64decode(encoded)
              )
              print(f"updated: {rel}")

          print()
          print(
              f"Applied {len(files)} "
              "VUEO v0.3.1 source files."
          )
          print(
              "No .github/workflows "
              "files were modified."
          )
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.3.1"'             app/build.gradle.kts

          grep -q 'yoruix/nuvio-providers'             app/src/main/java/com/vueo/app/core/plugin/PluginStore.kt

          grep -q 'D3adlyRocket/All-in-One-Nuvio'             app/src/main/java/com/vueo/app/core/plugin/PluginStore.kt

          grep -q 'class PluginSourceEngine'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q 'JavascriptInterface'             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

          grep -q 'external_source=imdb_id'             app/src/main/java/com/vueo/app/core/plugin/TmdbResolver.kt

          grep -q 'Save TMDB Key'             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'PluginSourceEngine'             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.3.1 sanity checks passed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||              [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name               "github-actions[bot]"

            git config user.email               "41898282+github-actions[bot]@users.noreply.github.com"

            git add app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit                 -m "Add JavaScript provider runtime and default plugin repos"

              git push origin                 "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Build VUEO debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR"             -maxdepth 1             -type f             -name "*.apk"             -print || true

          if ! find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit | grep -q .; then
            echo "::error::Build completed without a debug APK."
            exit 1
          fi

      - name: Upload VUEO v0.3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.3.1-debug-${ github.run_number }
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.3.1"
            echo
            echo "- Yoru repo seeded as DEV DEFAULT"
            echo "- All-in-One repo seeded as DEV DEFAULT"
            echo "- TMDB ID bridge"
            echo "- WebView provider runtime"
            echo "- Restricted native HTTPS fetch bridge"
            echo "- Private/local network blocking"
            echo "- getStreams() execution"
            echo "- Plugin + Stremio source merge"
            echo "- Provider playback headers"
            echo "- APK built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
