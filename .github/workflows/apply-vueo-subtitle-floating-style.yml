name: VUEO Subtitle Floating Style UX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-subtitle-floating-style
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply subtitle UX patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt"

          if grep -q "internal fun PlayerSubtitleStyleOverlay" "$FILE"; then
            echo "Subtitle floating style patch already appears applied."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > "$RUNNER_TEMP/vueo-subtitle-floating-style.patch" <<'PATCH'
