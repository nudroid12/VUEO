      - name: Sanity check targeted changes
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="$(
            git status --short \
              | awk '{print $2}' \
              | sort
          )"

          printf '%s\n' "$EXPECTED"

          test "$EXPECTED" = "$(
            printf '%s\n' \
              app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt \
              app/src/main/java/com/vueo/app/ui/VueoApp.kt \
              | sort
          )"

          grep -q "SubtitleAccent.copy(alpha = .15f)" \
            app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt

          grep -q "internal fun PlayerSubtitleStyleOverlay" \
            app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt

          grep -q "detectDragGestures" \
            app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt

          grep -q "tap outside to close" \
            app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt

          grep -q "showSubtitleStyleOverlay" \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if git status --short | grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch unexpectedly modified workflow files."
            exit 1
          fi

      - name: Show source diff
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git diff -- \
            app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

      - name: Set up JDK 17
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        if: steps.patch.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile Kotlin
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Commit verified subtitle UX
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/vueo/app/ui/PlayerSubtitleWorkspace.kt \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          git commit -m \
            "feat: add floating subtitle style editor"

          git push origin HEAD:main

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Subtitle UX"
            echo
            echo "- Selected language and subtitle cards now use VUEO lime active styling"
            echo "- Inline Style controls are replaced by a live-editor launcher"
            echo "- Opening Style closes the subtitle workspace"
            echo "- Style editor floats over the playing video"
            echo "- Floating editor is draggable and constrained to the screen"
            echo "- Subtitle changes remain live while the video plays"
            echo "- Tap outside the floating editor to close it"
            echo "- Reopening Style starts from its default position"
            echo "- PiP closes the editor safely"
            echo "- Kotlin compile must pass before source changes are committed"
            echo
            echo "The existing central VUEO build is triggered automatically by the source push."
          } >> "$GITHUB_STEP_SUMMARY"
