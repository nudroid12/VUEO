name: Apply VUEO Library Final v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-library-final-v3
  cancel-in-progress: false

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current VUEO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Library Final to current source
        shell: bash
        env:
          LIBRARY_FINAL_B64: ""
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64
          import os

          app_path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )

          if not app_path.exists():
              raise SystemExit(
                  "VueoApp.kt not found."
              )

          text = app_path.read_text(
              encoding="utf-8"
          )

          start_marker = (
              "@Composable\n"
              "private fun LibraryScreen("
          )
          end_marker = (
              "@Composable\n"
              "private fun LibrarySectionHeader("
          )

          start = text.find(start_marker)
          end = text.find(
              end_marker,
              start + 1,
          )

          if start < 0:
              raise SystemExit(
                  "Current LibraryScreen was not found."
              )

          if end < 0:
              raise SystemExit(
                  "LibrarySectionHeader boundary was not found."
              )

          replacement = (
              base64.b64decode(
                  os.environ["LIBRARY_FINAL_B64"]
              )
              .decode("utf-8")
          )

          updated = (
              text[:start]
              + replacement
              + text[end:]
          )

          app_path.write_text(
              updated,
              encoding="utf-8",
          )

          print(
              "Library Final applied to current VueoApp.kt."
          )
          PY

      - name: Bump app version safely
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/build.gradle.kts"
          )

          if not path.exists():
              print(
                  "No app/build.gradle.kts. "
                  "Skipping version bump."
              )
              raise SystemExit(0)

          lines = path.read_text(
              encoding="utf-8"
          ).splitlines()

          code_done = False
          name_done = False
          old_code = None
          new_code = None
          old_name = None
          new_name = None
          out = []

          for line in lines:
              stripped = line.strip()

              if (
                  not code_done
                  and stripped.startswith(
                      "versionCode"
                  )
                  and "=" in line
              ):
                  left, right = line.split(
                      "=",
                      1,
                  )
                  raw = right.strip()

                  if raw.isdigit():
                      old_code = int(raw)
                      new_code = old_code + 1
                      line = (
                          left
                          + "= "
                          + str(new_code)
                      )
                      code_done = True

              if (
                  not name_done
                  and stripped.startswith(
                      "versionName"
                  )
                  and "=" in line
              ):
                  left, right = line.split(
                      "=",
                      1,
                  )
                  raw = right.strip()

                  if (
                      len(raw) >= 2
                      and raw[0] == '"'
                      and raw[-1] == '"'
                  ):
                      value = raw[1:-1]
                      parts = value.split(".")

                      if (
                          len(parts) >= 3
                          and all(
                              part.isdigit()
                              for part in parts
                          )
                      ):
                          old_name = value
                          parts[-1] = str(
                              int(parts[-1]) + 1
                          )
                          new_name = ".".join(
                              parts
                          )
                          line = (
                              left
                              + '= "'
                              + new_name
                              + '"'
                          )
                          name_done = True

              out.append(line)

          if code_done or name_done:
              path.write_text(
                  "\n".join(out) + "\n",
                  encoding="utf-8",
              )

          if code_done:
              print(
                  f"versionCode: "
                  f"{old_code} -> {new_code}"
              )
          else:
              print(
                  "versionCode is not a literal integer. "
                  "Left unchanged."
              )

          if name_done:
              print(
                  f"versionName: "
                  f"{old_name} -> {new_name}"
              )
          else:
              print(
                  "versionName is not a literal numeric "
                  "version. Left unchanged."
              )

          # Version parsing is deliberately non-fatal.
          # Library patch must not fail just because
          # version management changes later.
          PY

      - name: Verify Library Final structure
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )
          text = path.read_text(
              encoding="utf-8"
          )

          start = text.index(
              "private fun LibraryScreen("
          )
          end = text.index(
              "private fun LibrarySectionHeader(",
              start,
          )
          block = text[start:end]

          required = [
              "activeProfile: VueoProfile",
              "onVersionChanged: () -> Unit",
              "onPlaybackClick:",
              'label = "Saved"',
              'label = "Cloud"',
              "LibraryViewModeButton(",
              ".chunked(3)",
              "SearchPosterTile(",
              "LibrarySavedListRow(",
              '"Cloud library"',
              '"Your library is empty"',
          ]

          for token in required:
              if token not in block:
                  raise SystemExit(
                      "Missing Library Final token: "
                      + token
                  )

          forbidden = [
              "store.continueWatching()",
              "store.history()",
              '"Continue Watching"',
              'title = "History"',
              'label = "Continue"',
              'label = "History"',
          ]

          for token in forbidden:
              if token in block:
                  raise SystemExit(
                      "Old Library content remains: "
                      + token
                  )

          print(
              "Library Final structure verified."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch modified workflow files."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Library Final
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Commit only after green compile
        shell: bash
        run: |
          set -euo pipefail

          git config user.name             "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "Library Final already applied."
            exit 0
          fi

          git commit -m             "Finalize VUEO Library"

          git push origin             "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Library Final v3"
            echo
            echo "- Based on current VueoApp.kt signature"
            echo "- Saved and Cloud tabs"
            echo "- Grid and list toggle"
            echo "- Three-column Saved grid"
            echo "- No Continue Watching in Library"
            echo "- No History in Library"
            echo "- Existing playback data is untouched"
            echo "- Version bump is safe and non-fatal"
            echo "- Commit happens only after Kotlin compile passes"
          } >> "$GITHUB_STEP_SUMMARY"
