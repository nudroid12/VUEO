name: Fix VUEO v0.5.0 Coroutine Returns

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix coroutineScope return expressions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          )

          if not path.exists():
              raise SystemExit(
                  "UnifiedMediaEngine.kt not found. Apply v0.5.0 first."
              )

          text = path.read_text(encoding="utf-8")
          original = text

          text = text.replace(
              """return@coroutineScope
                        it.take(maxRows)""",
              """return@coroutineScope it.take(maxRows)""",
          )

          text = text.replace(
              """return@coroutineScope emptyList()""",
              """return@coroutineScope emptyList<MediaItem>()""",
              1,
          )

          text = text.replace(
              """return@coroutineScope
                    it.take(maxResults)""",
              """return@coroutineScope it.take(maxResults)""",
          )

          if text == original:
              expected = (
                  "return@coroutineScope it.take(maxRows)" in text
                  and "return@coroutineScope emptyList<MediaItem>()" in text
                  and "return@coroutineScope it.take(maxResults)" in text
              )

              if expected:
                  print("Hotfix already applied.")
              else:
                  raise SystemExit(
                      "Expected coroutine return patterns were not found."
                  )
          else:
              path.write_text(
                  text,
                  encoding="utf-8",
              )
              print("Fixed v0.5.0 coroutine return expressions.")
          PY

      - name: Verify source hotfix
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"

          grep -q 'return@coroutineScope it.take(maxRows)' "$FILE"
          grep -q 'return@coroutineScope emptyList<MediaItem>()' "$FILE"
          grep -q 'return@coroutineScope it.take(maxResults)' "$FILE"

          if grep -n -A1 'return@coroutineScope$' "$FILE"; then
            echo "::error::A multiline coroutine return is still present."
            exit 1
          fi

          echo "Coroutine return checks passed."

      - name: Commit and push hotfix
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

            git commit -m \
              "Fix v0.5.0 coroutine return types"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Hotfix already present. Continuing to build."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build VUEO v0.5.0 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          echo "Generated APK files:"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

          if ! find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit | grep -q .; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload fixed VUEO v0.5.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.5.0-fixed-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.5.0 Build Hotfix"
            echo
            echo "- Fixed coroutineScope return typing"
            echo "- Discovery Experience retained"
            echo "- Universal Search retained"
            echo "- Fast Source Engine retained"
            echo "- APK rebuilt in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
