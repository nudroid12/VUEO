name: Patch VUEO Library Header and View Memory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-library-ui-preference-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Library header and persistent view patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )

          if not path.exists():
              raise SystemExit("VueoApp.kt not found.")

          text = path.read_text(encoding="utf-8")
          original = text

          search_start = text.find(
              "private fun SearchScreen("
          )
          library_start = text.find(
              "private fun LibraryScreen("
          )
          library_end = text.find(
              "@Composable\nprivate fun LibraryTab(",
              library_start,
          )

          if search_start < 0:
              raise SystemExit("SearchScreen not found.")
          if library_start < 0:
              raise SystemExit("LibraryScreen not found.")
          if library_end < 0:
              raise SystemExit("LibraryTab boundary not found.")
          if not (
              search_start < library_start < library_end
          ):
              raise SystemExit(
                  "Unexpected Search/Library ordering."
              )

          # Search title to 34sp.
          search_block = text[
              search_start:library_start
          ]

          search_block, search_count = re.subn(
              r'(text\s*=\s*"Search",'
              r'[\s\S]{0,180}?'
              r'fontSize\s*=\s*)\d+\.sp',
              r'\g<1>34.sp',
              search_block,
              count=1,
          )

          if search_count != 1:
              raise SystemExit(
                  "Could not set Search title to 34sp."
              )

          text = (
              text[:search_start]
              + search_block
              + text[library_start:]
          )

          # Recalculate Library boundaries.
          library_start = text.find(
              "private fun LibraryScreen("
          )
          library_end = text.find(
              "@Composable\nprivate fun LibraryTab(",
              library_start,
          )
          library_block = text[
              library_start:library_end
          ]

          # Keep My List terminology even if an older
          # source snapshot is checked out.
          library_block = library_block.replace(
              'label = "Saved"',
              'label = "My List"',
          )
          library_block = library_block.replace(
              "Your locally saved titles stay available in Saved.",
              "Your locally saved titles stay available in My List.",
          )
          library_block = library_block.replace(
              "Saved titles will appear here after you tap Save on a details screen.",
              "Titles added to My List will appear here.",
          )

          # Library title to 34sp.
          library_block, title_count = re.subn(
              r'(text\s*=\s*"Library",'
              r'[\s\S]{0,220}?'
              r'fontSize\s*=\s*)\d+\.sp',
              r'\g<1>34.sp',
              library_block,
              count=1,
          )

          if title_count != 1:
              raise SystemExit(
                  "Could not set Library title to 34sp."
              )

          # Increase space between Library title row
          # and My List / Cloud tabs to 20dp.
          header_start = library_block.find(
              'key = "library-header"'
          )
          my_list_pos = library_block.find(
              'label = "My List"',
              header_start,
          )

          if header_start < 0 or my_list_pos < 0:
              raise SystemExit(
                  "Library header or My List tab not found."
              )

          header_slice = library_block[
              header_start:my_list_pos
          ]

          header_slice, spacing_count = re.subn(
              r'(verticalArrangement\s*=\s*'
              r'Arrangement\.spacedBy\(\s*)'
              r'\d+\.dp',
              r'\g<1>20.dp',
              header_slice,
              count=1,
          )

          if spacing_count != 1:
              raise SystemExit(
                  "Could not set Library header spacing."
              )

          library_block = (
              library_block[:header_start]
              + header_slice
              + library_block[my_list_pos:]
          )

          # Persist Grid/List mode with SharedPreferences.
          if (
              "libraryUiPreferences.getBoolean("
              not in library_block
          ):
              watchlist_anchor = (
                  "    val watchlist = remember(\n"
                  "        version\n"
                  "    ) {\n"
                  "        store.watchlist()\n"
                  "    }\n"
              )

              if watchlist_anchor not in library_block:
                  raise SystemExit(
                      "Library watchlist anchor not found."
                  )

              library_block = library_block.replace(
                  watchlist_anchor,
                  watchlist_anchor
                  + "\n"
                  + "    val context = LocalContext.current\n",
                  1,
              )

              old_state = (
                  "    var gridView by remember {\n"
                  "        mutableStateOf(true)\n"
                  "    }"
              )

              persistent_state = (
                  "    val libraryUiPreferences =\n"
                  "        remember {\n"
                  "            context.getSharedPreferences(\n"
                  '                "vueo_library_ui",\n'
                  "                Context.MODE_PRIVATE,\n"
                  "            )\n"
                  "        }\n"
                  "\n"
                  "    var gridView by remember {\n"
                  "        mutableStateOf(\n"
                  "            libraryUiPreferences.getBoolean(\n"
                  '                "grid_view",\n'
                  "                true,\n"
                  "            )\n"
                  "        )\n"
                  "    }"
              )

              if old_state not in library_block:
                  raise SystemExit(
                      "Temporary grid state anchor not found."
                  )

              library_block = library_block.replace(
                  old_state,
                  persistent_state,
                  1,
              )

          # Persist each toggle immediately.
          if ".putBoolean(" not in library_block:
              old_toggle = (
                  "                        onToggle = {\n"
                  "                            gridView =\n"
                  "                                !gridView\n"
                  "                        },"
              )

              new_toggle = (
                  "                        onToggle = {\n"
                  "                            val nextGridView =\n"
                  "                                !gridView\n"
                  "\n"
                  "                            gridView =\n"
                  "                                nextGridView\n"
                  "\n"
                  "                            libraryUiPreferences\n"
                  "                                .edit()\n"
                  "                                .putBoolean(\n"
                  '                                    "grid_view",\n'
                  "                                    nextGridView,\n"
                  "                                )\n"
                  "                                .apply()\n"
                  "                        },"
              )

              if old_toggle not in library_block:
                  raise SystemExit(
                      "Library grid toggle anchor not found."
                  )

              library_block = library_block.replace(
                  old_toggle,
                  new_toggle,
                  1,
              )

          text = (
              text[:library_start]
              + library_block
              + text[library_end:]
          )

          # Final verification.
          search_start = text.find(
              "private fun SearchScreen("
          )
          library_start = text.find(
              "private fun LibraryScreen("
          )
          library_end = text.find(
              "@Composable\nprivate fun LibraryTab(",
              library_start,
          )

          search_block = text[
              search_start:library_start
          ]
          library_block = text[
              library_start:library_end
          ]

          checks = [
              (
                  "Search title 34sp",
                  bool(
                      re.search(
                          r'text\s*=\s*"Search",'
                          r'[\s\S]{0,180}?'
                          r'fontSize\s*=\s*34\.sp',
                          search_block,
                      )
                  ),
              ),
              (
                  "Library title 34sp",
                  bool(
                      re.search(
                          r'text\s*=\s*"Library",'
                          r'[\s\S]{0,220}?'
                          r'fontSize\s*=\s*34\.sp',
                          library_block,
                      )
                  ),
              ),
              (
                  "My List label",
                  'label = "My List"' in library_block,
              ),
              (
                  "20dp header spacing",
                  bool(
                      re.search(
                          r'key\s*=\s*"library-header"'
                          r'[\s\S]{0,320}?'
                          r'Arrangement\.spacedBy\(\s*'
                          r'20\.dp',
                          library_block,
                      )
                  ),
              ),
              (
                  "preference read",
                  "libraryUiPreferences.getBoolean("
                  in library_block
                  and '"grid_view"' in library_block,
              ),
              (
                  "preference write",
                  ".putBoolean(" in library_block
                  and "nextGridView" in library_block,
              ),
          ]

          failed = [
              name
              for name, ok in checks
              if not ok
          ]

          if failed:
              raise SystemExit(
                  "Patch verification failed: "
                  + ", ".join(failed)
              )

          changed = text != original

          if changed:
              path.write_text(
                  text,
                  encoding="utf-8",
              )
              print(
                  "Library UI preference patch applied."
              )
          else:
              print("Patch is already applied.")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  "changed="
                  + ("true" if changed else "false")
                  + "\n"
              )
          PY

      - name: Show patch
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git diff --             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch modified workflow files."
            exit 1
          fi

      - name: Set up JDK 17
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        if: steps.patch.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Kotlin
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Commit verified patch
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name             "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          git commit -m             "Polish Library header and remember view mode"

          git push origin HEAD:main

      - name: Trigger central VUEO build
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/dispatches"             -f event_type=vueo_build

          echo "Triggered repository_dispatch: vueo_build"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Library UI polish"
            echo
            echo "- Search title: 34sp"
            echo "- Library title: 34sp"
            echo "- Library title-to-tabs spacing: 20dp"
            echo "- Grid/List selection saved locally"
            echo "- View mode survives navigation and app restart"
            echo "- My List wording retained"
            echo "- Kotlin compile runs before commit"
            echo "- Central build triggered after successful commit"
          } >> "$GITHUB_STEP_SUMMARY"
