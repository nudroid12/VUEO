      - name: Sanity check v0.9.6
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path(".")
          build = (
              root / "app/build.gradle.kts"
          ).read_text(encoding="utf-8")
          app = (
              root / "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(encoding="utf-8")
          design = (
              root / "app/src/main/java/com/vueo/app/ui/VueoDesign.kt"
          ).read_text(encoding="utf-8")
          settings = (
              root / "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          ).read_text(encoding="utf-8")
          profiles = (
              root / "app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          ).read_text(encoding="utf-8")
          store = (
              root / "app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          ).read_text(encoding="utf-8")
          cache = (
              root / "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ).read_text(encoding="utf-8")
          engine = (
              root / "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          ).read_text(encoding="utf-8")

          if "versionCode = 23" not in build:
              raise SystemExit("versionCode 23 missing")

          if 'versionName = "0.9.6"' not in build:
              raise SystemExit("versionName 0.9.6 missing")

          manifest = json.loads(
              (root / "update.json").read_text(
                  encoding="utf-8"
              )
          )

          if manifest.get("versionCode") != 23:
              raise SystemExit(
                  "update.json versionCode mismatch"
              )

          if manifest.get("versionName") != "0.9.6":
              raise SystemExit(
                  "update.json versionName mismatch"
              )

          required_design = [
              "VueoBrandMark",
              "VueoBrandLockup",
              "Color(0xFF8CE66A)",
              "Color(AppAccent.WHITE.argb)",
              "Approved v0.9.6 mark",
          ]

          for token in required_design:
              if token not in design:
                  raise SystemExit(
                      f"Missing design token: {token}"
                  )

          required_app = [
              "Watch Now",
              "My List",
              "Search movies, series, people",
              "SearchPosterTile",
              "Choose a Source",
              "Play Best",
              "Content Manager",
              "PluginHealthStore",
              "activeProfile: VueoProfile",
              "VueoBrandLockup",
          ]

          for token in required_app:
              if token not in app:
                  raise SystemExit(
                      f"Missing UI feature: {token}"
                  )

          required_profiles = [
              "Who's Watching?",
              "profiles.chunked(2)",
              "AddProfileCard",
              "Ask on startup",
              "No sign-in required",
              "VueoBrandLockup",
          ]

          for token in required_profiles:
              if token not in profiles:
                  raise SystemExit(
                      f"Missing profile UI feature: {token}"
                  )

          required_settings = [
              "Manage Profiles",
              "Content Manager",
              "Enhancements",
              "Playback",
              "Subtitles",
              "Sources",
              "Appearance",
              "Data & Storage",
              "Updates",
              "About VUEO",
              "VueoBrandLockup",
          ]

          for token in required_settings:
              if token not in settings:
                  raise SystemExit(
                      f"Missing Settings UI feature: {token}"
                  )

          accent_labels = [
              "White",
              "Lime Green",
              "Ocean",
              "Violet",
              "Amber",
              "Coral",
          ]

          for label in accent_labels:
              if f'label = "{label}"' not in store:
                  raise SystemExit(
                      f"Missing accent: {label}"
                  )

          if "default = AppAccent.WHITE" not in store:
              raise SystemExit(
                  "White is not the default accent"
              )

          if "VueoSettingsSectionLabel(" in settings:
              raise SystemExit(
                  "Old v0.9.3 Settings compile bug returned"
              )

          if '@kotlin.jvm.JvmName("catalogRowsToJson")' not in cache:
              raise SystemExit(
                  "Catalog cache JVM signature fix missing"
              )

          if '@kotlin.jvm.JvmName("mediaItemsToJson")' not in cache:
              raise SystemExit(
                  "Media cache JVM signature fix missing"
              )

          bad_returns = [
              (
                  cache,
                  r"return@withContext\s*\n\s*emptyList",
              ),
              (
                  cache,
                  r"return@runCatching\s*\n\s*emptyList",
              ),
              (
                  engine,
                  r"return@runCatching\s*\n\s*null",
              ),
          ]

          for source, pattern in bad_returns:
              if re.search(pattern, source):
                  raise SystemExit(
                      "Split labelled return regression"
                  )

          for name, source in [
              ("VueoApp.kt", app),
              ("VueoDesign.kt", design),
              ("VueoSettings.kt", settings),
              ("VueoProfiles.kt", profiles),
          ]:
              if source.count("{") != source.count("}"):
                  raise SystemExit(
                      f"Kotlin brace mismatch in {name}"
                  )

          ET.parse(
              root / "app/src/main/res/drawable/ic_vueo.xml"
          )
          ET.parse(
              root / "app/src/main/res/values/themes.xml"
          )

          icon = (
              root / "app/src/main/res/drawable/ic_vueo.xml"
          ).read_text(encoding="utf-8")

          for token in [
              "#8CE66A",
              "M14,22 L42,22 L58,55 L39,87 Z",
              "M46,22 L91,22 L61,61 Z",
          ]:
              if token not in icon:
                  raise SystemExit(
                      f"Approved logo token missing: {token}"
                  )

          print(
              "VUEO v0.9.6 structural checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

