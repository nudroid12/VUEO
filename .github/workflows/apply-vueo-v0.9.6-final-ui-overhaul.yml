            app/src/main/res/values/themes.xml \
            update.json

          if ! git diff --cached --quiet; then
            git commit -m               "Apply VUEO v0.9.6 final UI overhaul"
            git push origin               "HEAD:${GITHUB_REF_NAME}"
          else
            echo "v0.9.6 patch already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build VUEO v0.9.6 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug               -maxdepth 1               -type f               -name "*.apk"               -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.6-final-ui-overhaul-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.6 Final UI Overhaul"
            echo
            echo "- Approved VUEO logo integrated into launcher, splash and in-app branding"
            echo "- Dark cinematic design system aligned to the approved mockups"
            echo "- White remains the default interface accent"
            echo "- Lime Green, Ocean, Violet, Amber and Coral remain optional accents"
            echo "- Home gets cinematic hero, Watch Now and My List"
            echo "- Search gets media filters, featured result and poster grid"
            echo "- Library gets active-profile branding and cleaner hierarchy"
            echo "- Settings gets active profile summary and unified navigation cards"
            echo "- Content Manager gets provider health summary"
            echo "- Who's Watching gets the approved two-column profile layout"
            echo "- Existing Source Picker and Player polish carried forward"
            echo "- Version 0.9.6, code 23"
          } >> "$GITHUB_STEP_SUMMARY"
