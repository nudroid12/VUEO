name: Import VUEO ZIP into repository

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to ZIP file inside the repository"
        required: true
        default: "VUEO-v0.1-foundation.zip"
        type: string
      delete_zip:
        description: "Delete ZIP after successful extraction"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  import-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP exists
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="${{ inputs.zip_path }}"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP file not found: $ZIP_PATH"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_PATH"

      - name: Validate ZIP paths
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path

          zip_path = Path(os.environ["ZIP_PATH"])

          with zipfile.ZipFile(zip_path) as archive:
              for info in archive.infolist():
                  path = Path(info.filename)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(
                          f"Unsafe path found in ZIP: {info.filename}"
                      )

                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          f"Symlink is not allowed in ZIP: {info.filename}"
                      )

          print("ZIP validation passed.")
          PY

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="${{ inputs.zip_path }}"
          TEMP_DIR="$(mktemp -d)"

          python3 - "$ZIP_PATH" "$TEMP_DIR" <<'PY'
          import sys
          import zipfile

          zip_path = sys.argv[1]
          target = sys.argv[2]

          with zipfile.ZipFile(zip_path) as archive:
              archive.extractall(target)
          PY

          echo "Extracted ZIP to temporary directory."

          mapfile -t ROOT_ITEMS < <(
            find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -printf '%p\n'
          )

          if [ "${#ROOT_ITEMS[@]}" -eq 1 ] && [ -d "${ROOT_ITEMS[0]}" ]; then
            SOURCE_DIR="${ROOT_ITEMS[0]}"
            echo "Single wrapper folder detected:"
            echo "  $(basename "$SOURCE_DIR")"
            echo "Its contents will be copied into repository root."
          else
            SOURCE_DIR="$TEMP_DIR"
            echo "No single wrapper folder detected."
            echo "ZIP contents will be copied directly into repository root."
          fi

          rsync -a \
            --exclude='.git/' \
            "$SOURCE_DIR"/ ./

          rm -rf "$TEMP_DIR"

      - name: Delete ZIP
        if: ${{ inputs.delete_zip }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${{ inputs.zip_path }}"
          echo "ZIP removed from repository working tree."

      - name: Show imported files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root after extraction:"
          ls -la

          echo
          echo "Git changes:"
          git status --short

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet && \
             [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Import VUEO foundation from ZIP"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "VUEO project imported successfully."
