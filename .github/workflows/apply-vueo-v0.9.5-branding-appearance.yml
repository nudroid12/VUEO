      - name: Sanity check v0.9.5
        shell: bash
        run: |
          set -euo pipefail

          BUILD="app/build.gradle.kts"
          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          SETTINGS="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          DESIGN="app/src/main/java/com/vueo/app/ui/VueoDesign.kt"
          THEME="app/src/main/java/com/vueo/app/ui/theme/Theme.kt"
          SETTINGS_STORE="app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          PROFILE_STORE="app/src/main/java/com/vueo/app/core/storage/ProfileStore.kt"
          PROFILES_UI="app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          BACKUP="app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt"
          MIGRATION="app/src/main/java/com/vueo/app/core/storage/VueoDataMigration.kt"
          ICON="app/src/main/res/drawable/ic_vueo.xml"
          ANDROID_THEME="app/src/main/res/values/themes.xml"
          CACHE="app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ENGINE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"

          grep -q 'versionCode = 22' "$BUILD"
          grep -q 'versionName = "0.9.5"' "$BUILD"

          grep -Fq 'enum class AppAccent' "$SETTINGS_STORE"
          grep -Fq 'default = AppAccent.WHITE' "$SETTINGS_STORE"
          grep -Fq 'label = "White"' "$SETTINGS_STORE"
          grep -Fq 'label = "Lime Green"' "$SETTINGS_STORE"
          grep -Fq 'label = "Ocean"' "$SETTINGS_STORE"
          grep -Fq 'label = "Violet"' "$SETTINGS_STORE"
          grep -Fq 'label = "Amber"' "$SETTINGS_STORE"
          grep -Fq 'label = "Coral"' "$SETTINGS_STORE"
          grep -Fq 'KEY_APP_ACCENT' "$SETTINGS_STORE"

          grep -Fq 'val BrandLime' "$DESIGN"
          grep -Fq 'Color(0xFF8CE66A)' "$DESIGN"
          grep -Fq 'val Accent: Color' "$DESIGN"
          grep -Fq 'fun applyAccent' "$DESIGN"
          grep -Fq 'VueoBrandMark' "$DESIGN"

          grep -Fq 'primary = accent' "$THEME"
          grep -Fq 'VueoPalette.Accent' "$THEME"
          grep -Fq 'VueoPalette.applyAccent' "$APP"
          grep -Fq 'settingsStore.appAccent()' "$APP"

          grep -Fq 'AppearanceSettingsScreen(' "$SETTINGS"
          grep -Fq 'VueoAccentOption' "$SETTINGS"
          grep -Fq 'White is the default.' "$SETTINGS"
          grep -Fq 'Brand stays consistent' "$SETTINGS"
          grep -Fq 'settingsStore.setAppAccent' "$SETTINGS"

          grep -Fq "Who's Watching?" "$PROFILES_UI"
          grep -Fq 'class ProfileStore' "$PROFILE_STORE"
          grep -Fq 'CURRENT_SCHEMA_VERSION = 2' "$BACKUP"
          grep -Fq 'CURRENT_SCHEMA_VERSION = 2' "$MIGRATION"

          grep -Fq '#8CE66A' "$ICON"
          grep -Fq 'windowSplashScreenAnimatedIcon' "$ANDROID_THEME"

          if grep -R -Fq 'VueoPalette.Neon'               app/src/main/java/com/vueo/app/ui; then
            echo "::error::Old neon accent reference returned."
            exit 1
          fi

          if grep -Fq 'VUEO Dark • Lime accent' "$SETTINGS"; then
            echo "::error::Old forced Lime appearance status returned."
            exit 1
          fi

          if grep -Fq 'VueoSettingsSectionLabel(' "$SETTINGS"; then
            echo "::error::Old v0.9.3 section label compile bug returned."
            exit 1
          fi

          grep -Fq '@kotlin.jvm.JvmName("catalogRowsToJson")' "$CACHE"
          grep -Fq '@kotlin.jvm.JvmName("mediaItemsToJson")' "$CACHE"
          grep -Fq 'withTimeoutOrNull' "$ENGINE"
          grep -Fq 'PlayerFullscreenEffect' "$APP"
          grep -Fq 'librarySaveTicks' "$APP"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          files = {
              "app": Path(
                  "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
              ),
              "settings": Path(
                  "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
              ),
              "design": Path(
                  "app/src/main/java/com/vueo/app/ui/VueoDesign.kt"
              ),
              "store": Path(
                  "app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
              ),
              "cache": Path(
                  "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
              ),
              "engine": Path(
                  "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
              ),
          }

          text = {
              key: path.read_text(encoding="utf-8")
              for key, path in files.items()
          }

          manifest = json.loads(
              Path("update.json").read_text(encoding="utf-8")
          )

          if manifest.get("versionCode") != 22:
              raise SystemExit("update.json versionCode mismatch")

          if manifest.get("versionName") != "0.9.5":
              raise SystemExit("update.json versionName mismatch")

          accent_labels = [
              "White",
              "Lime Green",
              "Ocean",
              "Violet",
              "Amber",
              "Coral",
          ]

          for label in accent_labels:
              if f'label = "{label}"' not in text["store"]:
                  raise SystemExit(
                      f"Missing accent option: {label}"
                  )

          if text["store"].count(
              "enum class AppAccent"
          ) != 1:
              raise SystemExit("AppAccent declaration regression")

          if "default = AppAccent.WHITE" not in text["store"]:
              raise SystemExit("White is not the default accent")

          if text["app"].count(
              "SettingsPage.PROFILES"
          ) < 2:
              raise SystemExit("Profiles route regression")

          if text["app"].count(
              "WhosWatchingScreen("
          ) != 1:
              raise SystemExit("Who's Watching call regression")

          if "VueoPalette.BrandLime" not in text["app"]:
              raise SystemExit("Brand wordmark color missing")

          if "settingsStore =\n                                settingsStore" not in text["app"]:
              raise SystemExit(
                  "Appearance SettingsStore wiring missing"
              )

          if text["settings"].count(
              "internal fun AppearanceSettingsScreen("
          ) != 1:
              raise SystemExit(
                  "Appearance screen declaration regression"
              )

          if text["settings"].count(
              "private fun VueoAccentOption("
          ) != 1:
              raise SystemExit(
                  "Accent option declaration regression"
              )

          for key in ("app", "settings", "design", "store"):
              if text[key].count("{") != text[key].count("}"):
                  raise SystemExit(
                      f"Kotlin brace mismatch: {key}"
                  )

          bad_value_returns = [
              (
                  text["cache"],
                  r"return@withContext\s*\n\s*emptyList",
              ),
              (
                  text["cache"],
                  r"return@runCatching\s*\n\s*emptyList",
              ),
              (
                  text["engine"],
                  r"return@runCatching\s*\n\s*null",
              ),
          ]

          for source, pattern in bad_value_returns:
              if re.search(pattern, source):
                  raise SystemExit(
                      "Split labelled value return regression"
                  )

          ET.parse(
              "app/src/main/res/drawable/ic_vueo.xml"
          )
          ET.parse(
              "app/src/main/res/values/themes.xml"
          )

          print(
              "VUEO v0.9.5 structural checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/build.gradle.kts             app/src/main/java/com/vueo/app/core/storage/ProfileStore.kt             app/src/main/java/com/vueo/app/core/storage/LibraryStore.kt             app/src/main/java/com/vueo/app/core/storage/PlaybackStore.kt             app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt             app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt             app/src/main/java/com/vueo/app/core/storage/VueoDataMigration.kt             app/src/main/java/com/vueo/app/ui/VueoProfiles.kt             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt             app/src/main/java/com/vueo/app/ui/VueoDesign.kt             app/src/main/java/com/vueo/app/ui/theme/Theme.kt             app/src/main/res/drawable/ic_vueo.xml             app/src/main/res/values/themes.xml             README.md             ARCHITECTURE.md             update.json

          if ! git diff --cached --quiet; then
            git commit -m               "Add VUEO v0.9.5 branding and appearance"
            git push origin               "HEAD:${GITHUB_REF_NAME}"
          else
            echo "v0.9.5 patch already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build VUEO v0.9.5 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          APK="$(
            find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.5-branding-appearance-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.5 Branding & Appearance"
            echo
            echo "- White is the default interface accent"
            echo "- Lime Green, Ocean, Violet, Amber and Coral are optional accents"
            echo "- Accent changes apply immediately"
            echo "- VUEO logo and wordmark stay Lime Green"
            echo "- Refined V + play launcher and in-app brand mark"
            echo "- Dynamic Material3 primary color follows the selected accent"
            echo "- Local Profiles and Who's Watching are carried forward"
            echo "- Version 0.9.5, code 22"
          } >> "$GITHUB_STEP_SUMMARY"
