          from pathlib import Path
          import base64
          import gzip

          encoded = (
              Path("/tmp/vueo-updater-patch.b64")
              .read_text(encoding="utf-8")
              .replace("\n", "")
              .replace(" ", "")
          )

          source = gzip.decompress(
              base64.b64decode(encoded)
          )

          Path("/tmp/vueo-updater-patch.py").write_bytes(source)
          PY

          python3 /tmp/vueo-updater-patch.py
          rm -f /tmp/vueo-updater-patch.py /tmp/vueo-updater-patch.b64

      - name: Compile updater patch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit and push updater source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/build.gradle.kts             app/src/main/AndroidManifest.xml             app/src/main/res/xml/vueo_update_paths.xml             app/src/main/java/com/vueo/app/core/update/VueoUpdateManager.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt

          if git diff --cached --quiet; then
            echo "Updater source already applied."
          else
            git commit -m "feat: enable in-app updater and dev release channel"
            git push
          fi

  auto-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm updater is installed
        id: updater
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/core/update/VueoUpdateManager.kt"

          if grep -q "VUEO_DEV_RELEASE_MANIFEST" "$FILE"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Updater source is not installed yet. Skipping publish."
          fi

      - name: Validate signing secrets
        if: steps.updater.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing VUEO_KEYSTORE_BASE64 or VUEO_KEYSTORE_PASSWORD repository secret."
            exit 1
          fi

      - name: Set up Java
        if: steps.updater.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare signed build
        if: steps.updater.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.9.6-dev.${GITHUB_RUN_NUMBER}"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vueo-dev-signing.jks"

          echo "VUEO_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VUEO_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VUEO_KEYSTORE_PATH=$RUNNER_TEMP/vueo-dev-signing.jks" >> "$GITHUB_ENV"
          echo "VUEO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.updater.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare update feed
        if: steps.updater.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VUEO-dev.apk

          SHA256="$(sha256sum dist/VUEO-dev.apk | awk '{print $1}')"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export SHA256 PUBLISHED_AT

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "schemaVersion": 1,
              "versionCode": int(os.environ["VUEO_VERSION_CODE"]),
              "versionName": os.environ["VUEO_VERSION_NAME"],
              "title": f'VUEO {os.environ["VUEO_VERSION_NAME"]}',
              "changelog": [
                  "Latest green VUEO development build",
                  f'Commit {os.environ["GITHUB_SHA"][:7]}',
              ],
              "downloadUrl": "https://github.com/nudroid12/VUEO/releases/download/vueo-dev/VUEO-dev.apk",
              "sha256": os.environ["SHA256"],
              "publishedAt": os.environ["PUBLISHED_AT"],
          }

          Path("dist/update.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish VUEO Dev release
        if: steps.updater.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view vueo-dev >/dev/null 2>&1; then
            gh release create vueo-dev               --title "VUEO Dev"               --prerelease               --notes "Rolling development release. Only green builds are published."
          fi

          gh release upload vueo-dev             dist/VUEO-dev.apk             dist/update.json             --clobber

      - name: Upload signed APK artifact
        if: steps.updater.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-signed-dev-${{ github.run_number }}
          path: dist/VUEO-dev.apk
          if-no-files-found: error
