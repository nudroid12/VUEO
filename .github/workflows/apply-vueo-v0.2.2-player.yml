name: Apply VUEO v0.2.2 Player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.2.2 source patch
        shell: bash
        env:
          VUEO_PATCH_FILES: '{"app/build.gradle.kts":"","app/src/main/java/com/vueo/app/core/model/MediaModels.kt":"","app/src/main/java/com/vueo/app/core/stremio/StremioAddonProvider.kt":"","app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt":"","app/src/main/java/com/vueo/app/core/storage/PlaybackStore.kt":"","app/src/main/java/com/vueo/app/ui/VueoApp.kt":"","README.md":"","ARCHITECTURE.md":""}'
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = json.loads(os.environ["VUEO_PATCH_FILES"])

          for rel, encoded in files.items():
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f"updated: {rel}")

          print()
          print(f"Applied {len(files)} VUEO v0.2.2 source files.")
          print("No .github/workflows files were modified.")
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.2.2"' app/build.gradle.kts
          grep -q 'media3-exoplayer-dash:1.11.0' app/build.gradle.kts
          grep -q 'data class EpisodeItem'             app/src/main/java/com/vueo/app/core/model/MediaModels.kt
          grep -q 'resolveSubtitles'             app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt
          grep -q 'SourcePickerScreen'             app/src/main/java/com/vueo/app/ui/VueoApp.kt
          grep -q 'PlayerScreen'             app/src/main/java/com/vueo/app/ui/VueoApp.kt
          grep -q 'ExoPlayer.Builder'             app/src/main/java/com/vueo/app/ui/VueoApp.kt
          grep -q 'SeasonSelector'             app/src/main/java/com/vueo/app/ui/VueoApp.kt
          grep -q 'class PlaybackStore'             app/src/main/java/com/vueo/app/core/storage/PlaybackStore.kt

          if git status --short | grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.2.2 sanity checks passed."

      - name: Show changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet &&              [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app README.md ARCHITECTURE.md

          if git diff --cached --quiet; then
            echo "No staged source changes."
            exit 0
          fi

          git commit -m "Add VUEO source picker and Media3 player"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger APK build
        env:
          GH_TOKEN: ${ github.token }
        shell: bash
        run: |
          set -euo pipefail

          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/dispatches"             -f event_type=vueo_build

          echo "Triggered VUEO APK build."

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.2.2"
            echo
            echo "- Season and episode selection"
            echo "- Unified source picker"
            echo "- Play Best"
            echo "- Direct HTTPS/HLS/DASH playback"
            echo "- Media3 player"
            echo "- Remote subtitle tracks"
            echo "- Basic resume position"
            echo "- Torrent sources labelled but not directly played"
            echo "- APK build dispatch requested automatically"
          } >> "$GITHUB_STEP_SUMMARY"
