                                  }
                              }
                          }
                      }

                      if (repositories.isEmpty()) {
                          item {
                              ElevatedCard(
                                  modifier =
                                      Modifier.fillMaxWidth(),
                              ) {
                                  Column(
                                      modifier =
                                          Modifier.padding(
                                              20.dp
                                          ),
                                      verticalArrangement =
                                          Arrangement.spacedBy(
                                              10.dp
                                          ),
                                  ) {
                                      Text(
                                          "No plugin repositories",
                                          fontSize = 21.sp,
                                          fontWeight =
                                              FontWeight.Black,
                                      )
                                      Text(
                                          "Add a Nuvio-style provider repository URL.",
                                          color =
                                              MaterialTheme
                                                  .colorScheme
                                                  .onSurface
                                                  .copy(alpha = .68f),
                                      )
                                      Button(
                                          onClick = {
                                              showAddDialog = true
                                          },
                                      ) {
                                          Text(
                                              "Add Repository"
                                          )
                                      }
                                  }
                              }
                          }
                      } else {
                          item {
                              Text(
                                  "REPOSITORIES",
                                  color =
                                      MaterialTheme
                                          .colorScheme
                                          .onSurface
                                          .copy(alpha = .52f),
                                  fontSize = 11.sp,
                                  fontWeight =
                                      FontWeight.Bold,
                                  letterSpacing = 1.2.sp,
                              )

                              Spacer(
                                  Modifier.height(
                                      8.dp
                                  )
                              )

                              LazyRow(
                                  horizontalArrangement =
                                      Arrangement.spacedBy(
                                          8.dp
                                      ),
                              ) {
                                  items(
                                      repositories,
                                      key = {
                                          it.manifestUrl
                                      },
                                  ) {
                                      repository ->
                                      FilterChip(
                                          selected =
                                              selectedRepositoryUrl ==
                                                  repository.manifestUrl,
                                          onClick = {
                                              selectedRepositoryUrl =
                                                  repository.manifestUrl
                                          },
                                          label = {
                                              Text(
                                                  repository.name,
                                                  maxLines = 1,
                                                  overflow =
                                                      TextOverflow.Ellipsis,
                                              )
                                          },
                                      )
                                  }
                              }
                          }

                          selectedRepository
                              ?.let {
                                  repository ->
                                  item(
                                      key =
                                          "repo-card:${repository.manifestUrl}"
                                  ) {
                                      PluginRepositoryCard(
                                          repository =
                                              repository,
                                          store = store,
                                          healthStore =
                                              healthStore,
                                          healthRevision =
                                              healthRevision,
                                          codeStore =
                                              codeStore,
                                          codeRevision =
                                              codeRevision,
                                          repositoryEnabled =
                                              store.isRepositoryEnabled(
                                                  repository
                                              ),
                                          onRepositoryEnabledChanged = {
                                              enabled ->
                                              store.setRepositoryEnabled(
                                                  repository,
                                                  enabled,
                                              )
                                              refreshRepositories()
                                              healthRevision++
                                          },
                                          isDevelopmentDefault =
                                              store.isDevelopmentDefault(
                                                  repository.manifestUrl
                                              ),
                                          refreshing =
                                              refreshingUrl ==
                                                  repository.manifestUrl,
                                          onRefresh = {
                                              scope.launch {
                                                  refreshingUrl =
                                                      repository.manifestUrl
                                                  runCatching {
                                                      PluginRepositoryClient
                                                          .fetch(
                                                              repository.manifestUrl
                                                          )
                                                  }.onSuccess {
                                                      refreshed ->
                                                      store.upsert(
                                                          refreshed
                                                      )
                                                      val syncResult =
                                                          codeSync.syncRepository(
                                                              repository =
                                                                  refreshed,
                                                              force = true,
                                                          )
                                                      refreshRepositories()
                                                      selectedRepositoryUrl =
                                                          refreshed.manifestUrl
                                                      codeRevision++
                                                      message =
                                                          "Provider code ready " +
                                                              "${syncResult.readyProviders}/" +
                                                              "${refreshed.providers.size}"
                                                  }.onFailure {
                                                      message =
                                                          it.message
                                                  }
                                                  refreshingUrl = null
                                              }
                                          },
                                          onDelete = {
                                              healthStore.removeRepository(
                                                  repository.manifestUrl
                                              )
                                              store.remove(
                                                  repository.manifestUrl
                                              )
                                              refreshRepositories()
                                              healthRevision++
                                          },
                                          onProviderChanged = {
                                              refreshRepositories()
                                              healthRevision++
                                          },
                                      )
                                  }
                              }
                      }

                      item {
                          ElevatedCard(
                              modifier =
                                  Modifier.fillMaxWidth(),
                          ) {
                              Column(
                                  modifier =
                                      Modifier.padding(
                                          18.dp
                                      ),
                                  verticalArrangement =
                                      Arrangement.spacedBy(
                                          7.dp
                                      ),
                              ) {
                                  Text(
                                      "Runtime status",
                                      fontWeight =
                                          FontWeight.Bold,
                                  )
                                  Text(
                                      "Provider runtime ACTIVE. Disabled repositories are skipped completely during source discovery.",
                                      color =
                                          MaterialTheme
                                              .colorScheme
                                              .primary,
                                      fontSize = 12.sp,
                                  )
                              }
                          }
                      }
                  }
              }

              if (showAddDialog) {
                  AlertDialog(
                      onDismissRequest = {
                          if (!busy) {
                              showAddDialog = false
                              message = null
                          }
                      },
                      title = {
                          Text(
                              "Add Plugin Repository"
                          )
                      },
                      text = {
                          Column(
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      12.dp
                                  ),
                          ) {
                              Text(
                                  "Paste a repository base URL or direct manifest.json URL."
                              )
                              OutlinedTextField(
                                  value =
                                      repositoryUrl,
                                  onValueChange = {
                                      repositoryUrl = it
                                      message = null
                                  },
                                  label = {
                                      Text(
                                          "Repository URL"
                                      )
                                  },
                                  placeholder = {
                                      Text(
                                          "https://.../manifest.json"
                                      )
                                  },
                                  enabled = !busy,
                                  singleLine = true,
                              )
                              message?.let {
                                  Text(
                                      it,
                                      color =
                                          MaterialTheme
                                              .colorScheme
                                              .error,
                                      fontSize = 12.sp,
                                  )
                              }
                              if (busy) {
                                  LinearProgressIndicator(
                                      Modifier.fillMaxWidth()
                                  )
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(
                              enabled =
                                  repositoryUrl.isNotBlank() &&
                                      !busy,
                              onClick = {
                                  scope.launch {
                                      busy = true
                                      message = null
                                      runCatching {
                                          PluginRepositoryClient
                                              .fetch(
                                                  repositoryUrl
                                              )
                                      }.onSuccess {
                                          repository ->
                                          store.upsert(
                                              repository
                                          )
                                          store.setRepositoryEnabled(
                                              repository,
                                              true,
                                          )
                                          val syncResult =
                                              codeSync.syncRepository(
                                                  repository =
                                                      repository,
                                                  force = true,
                                              )
                                          refreshRepositories()
                                          selectedRepositoryUrl =
                                              repository.manifestUrl
                                          codeRevision++
                                          repositoryUrl = ""
                                          showAddDialog = false
                                          message =
                                              "Installed ${repository.name}. " +
                                                  "Provider code ready " +
                                                  "${syncResult.readyProviders}/" +
                                                  "${repository.providers.size}"
                                      }.onFailure {
                                          message =
                                              it.message
                                                  ?: "Unable to install repository."
                                      }
                                      busy = false
                                  }
                              },
                          ) {
                              Text("Install")
                          }
                      },
                      dismissButton = {
                          TextButton(
                              enabled = !busy,
                              onClick = {
                                  showAddDialog = false
                                  message = null
                              },
                          ) {
                              Text("Cancel")
                          }
                      },
                  )
              }
          }

          '''
          app = app[:plugins_start] + plugins_screen + app[plugins_end:]

          # PluginRepositoryCard repo toggle.
          card_start = app.find(
              "@Composable\nprivate fun PluginRepositoryCard("
          )
          card_end = app.find(
              "@Composable\nprivate fun ProviderHealthRow(",
              card_start,
          )
          require(
              card_start >= 0 and card_end > card_start,
              "PluginRepositoryCard boundaries missing",
          )
          card = app[card_start:card_end]

          old_sig = '''private fun PluginRepositoryCard(
              repository: PluginRepositoryDescriptor,
              store: PluginStore,
              healthStore: PluginHealthStore,
              healthRevision: Int,
              codeStore: ProviderCodeStore,
              codeRevision: Int,
              isDevelopmentDefault: Boolean,
              refreshing: Boolean,
              onRefresh: () -> Unit,
              onDelete: () -> Unit,
              onProviderChanged: () -> Unit,
          ) {
          '''
          new_sig = '''private fun PluginRepositoryCard(
              repository: PluginRepositoryDescriptor,
              store: PluginStore,
              healthStore: PluginHealthStore,
              healthRevision: Int,
              codeStore: ProviderCodeStore,
              codeRevision: Int,
              repositoryEnabled: Boolean,
              onRepositoryEnabledChanged:
                  (Boolean) -> Unit,
              isDevelopmentDefault: Boolean,
              refreshing: Boolean,
              onRefresh: () -> Unit,
              onDelete: () -> Unit,
              onProviderChanged: () -> Unit,
          ) {
          '''
          if old_sig in card:
              card = card.replace(old_sig, new_sig, 1)

          if "checked =\n                        repositoryEnabled" not in card:
              anchor = '''                IconButton(
                              enabled = !refreshing,
                              onClick = onRefresh,
                          ) {
          '''
              replacement = '''                Switch(
                              checked =
                                  repositoryEnabled,
                              onCheckedChange =
                                  onRepositoryEnabledChanged,
                          )
                          Spacer(
                              Modifier.width(
                                  6.dp
                              )
                          )
          ''' + anchor
              require(
                  card.count(anchor) == 1,
                  "PluginRepositoryCard refresh anchor missing",
              )
              card = card.replace(anchor, replacement, 1)

          if '"Repository disabled • provider preferences are preserved"' not in card:
              anchor = '''            if (refreshing) {
                          LinearProgressIndicator(
                              Modifier.fillMaxWidth()
                          )
                      }
          '''
              replacement = anchor + '''            if (!repositoryEnabled) {
                          Text(
                              "Repository disabled • provider preferences are preserved",
                              color =
                                  MaterialTheme
                                      .colorScheme
                                      .onSurface
                                      .copy(alpha = .55f),
                              fontSize = 11.sp,
                              fontWeight =
                                  FontWeight.Bold,
                          )
                      }
          '''
              require(
                  card.count(anchor) == 1,
                  "PluginRepositoryCard refresh status anchor missing",
              )
              card = card.replace(anchor, replacement, 1)

          app = app[:card_start] + card + app[card_end:]

          # Final sanity.
          markers = [
              "SettingsPage.CATALOG_ORDER",
              "onCatalogOrder: () -> Unit",
              'title = "Catalog Order"',
              "private fun CatalogOrderScreen(",
              "private data class CatalogOrderEntry(",
              "store.isAddonEnabled(",
              "engine.setExtensionEnabled(",
              "selectedRepositoryUrl",
              "repositoryEnabled: Boolean",
              "onRepositoryEnabledChanged:",
              "orderHomeCatalogRows(",
          ]
          missing = [
              x for x in markers
              if x not in app
          ]
          require(
              not missing,
              f"VueoApp missing markers: {missing}",
          )

          cm_verify_start = app.find(
              "private fun ContentManagerScreen("
          )
          cm_verify_end = app.find(
              "private fun CatalogOrderScreen(",
              cm_verify_start,
          )
          cm_verify = app[
              cm_verify_start:
              cm_verify_end
          ]
          require(
              "VueoBrandLockup" not in cm_verify,
              "Content Manager still has VUEO branding",
          )

          app_path.write_text(
              app,
              encoding="utf-8",
          )

          print("Content Manager v2 Fixed patch applied.")
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ADDON="app/src/main/java/com/vueo/app/core/storage/AddonStore.kt"
          PLUGIN="app/src/main/java/com/vueo/app/core/plugin/PluginStore.kt"
          RUNTIME="app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt"
          ENGINE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"

          grep -q 'CATALOG_ORDER' "$APP"
          grep -q 'private fun CatalogOrderScreen' "$APP"
          grep -q 'title = "Catalog Order"' "$APP"
          grep -q 'selectedRepositoryUrl' "$APP"
          grep -q 'repositoryEnabled: Boolean' "$APP"
          grep -q 'store.isAddonEnabled' "$APP"

          grep -q 'fun isAddonEnabled' "$ADDON"
          grep -q 'fun setCatalogOrder' "$ADDON"
          grep -q 'fun reconcileCatalogOrder' "$ADDON"

          grep -q 'fun isRepositoryEnabled' "$PLUGIN"
          grep -q 'fun setRepositoryEnabled' "$PLUGIN"

          grep -q 'filter(store::isRepositoryEnabled)' "$RUNTIME"

          grep -q 'fun setExtensionEnabled' "$ENGINE"
          grep -q 'fun activeStremioAddons' "$ENGINE"
          grep -q 'catalogOrder: List<String>' "$ENGINE"

          echo "Content Manager source validation passed."

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/java/com/vueo/app/core/storage/AddonStore.kt             app/src/main/java/com/vueo/app/core/plugin/PluginStore.kt             app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt             app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          git commit -m "feat: improve content manager controls"
          git push origin HEAD:main
