# VUEO CONTENT MANAGER V2 FIXED - 2026-08-29
name: Patch Content Manager v2 Fixed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Content Manager v2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'

          from pathlib import Path
          import re

          def fail(message):
              raise SystemExit(f"Patch sanity failed: {message}")

          def require(condition, message):
              if not condition:
                  fail(message)

          def replace_once(text, old, new, label):
              count = text.count(old)
              require(count == 1, f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          # ============================================================
          # 1. AddonStore.kt
          # ============================================================
          addon_path = Path(
              "app/src/main/java/com/vueo/app/core/storage/AddonStore.kt"
          )
          addon = addon_path.read_text(encoding="utf-8")

          if "fun isAddonEnabled(" not in addon:
              anchor = '''    fun manifestUrls(): List<String> =
                  prefs.getStringSet(KEY_MANIFEST_URLS, emptySet())
                      .orEmpty()
                      .toList()
                      .sorted()
          '''
              addition = anchor + '''
              fun isAddonEnabled(
                  manifestUrl: String,
              ): Boolean =
                  prefs.getBoolean(
                      addonEnabledKey(manifestUrl),
                      true,
                  )

              fun setAddonEnabled(
                  manifestUrl: String,
                  enabled: Boolean,
              ) {
                  prefs.edit()
                      .putBoolean(
                          addonEnabledKey(manifestUrl),
                          enabled,
                      )
                      .apply()
              }

              fun catalogOrder(): List<String> =
                  prefs.getString(
                      KEY_CATALOG_ORDER,
                      "",
                  )
                      .orEmpty()
                      .lineSequence()
                      .map(String::trim)
                      .filter(String::isNotBlank)
                      .distinct()
                      .toList()

              fun setCatalogOrder(
                  order: List<String>,
              ) {
                  prefs.edit()
                      .putString(
                          KEY_CATALOG_ORDER,
                          order
                              .map(String::trim)
                              .filter(String::isNotBlank)
                              .distinct()
                              .joinToString("\\n"),
                      )
                      .apply()
              }

              fun reconcileCatalogOrder(
                  availableKeys: List<String>,
              ): List<String> {
                  val available =
                      availableKeys
                          .map(String::trim)
                          .filter(String::isNotBlank)
                          .distinct()

                  val current =
                      catalogOrder()
                          .filter {
                              it in available
                          }

                  val next =
                      (
                          current +
                              available.filterNot {
                                  it in current
                              }
                      ).distinct()

                  if (next != catalogOrder()) {
                      setCatalogOrder(next)
                  }

                  return next
              }
          '''
              addon = replace_once(
                  addon,
                  anchor,
                  addition,
                  "AddonStore manifestUrls",
              )

          if "private fun addonEnabledKey(" not in addon:
              anchor = '''    fun isDevelopmentDefault(manifestUrl: String): Boolean =
                  manifestUrl in DEVELOPMENT_DEFAULT_MANIFESTS
          '''
              addition = anchor + '''
              private fun addonEnabledKey(
                  manifestUrl: String,
              ): String =
                  "addon_enabled:$manifestUrl"
          '''
              addon = replace_once(
                  addon,
                  anchor,
                  addition,
                  "AddonStore key helper",
              )

          old_add = '''    fun add(manifestUrl: String) {
                  val next = manifestUrls().toMutableSet()
                  next += manifestUrl
                  prefs.edit().putStringSet(KEY_MANIFEST_URLS, next).apply()
              }
          '''
          new_add = '''    fun add(manifestUrl: String) {
                  val next = manifestUrls().toMutableSet()
                  next += manifestUrl
                  prefs.edit()
                      .putStringSet(
                          KEY_MANIFEST_URLS,
                          next,
                      )
                      .putBoolean(
                          addonEnabledKey(manifestUrl),
                          true,
                      )
                      .apply()
              }
          '''
          if old_add in addon:
              addon = addon.replace(old_add, new_add, 1)

          old_remove = '''    fun remove(manifestUrl: String) {
                  val next = manifestUrls().toMutableSet()
                  next -= manifestUrl
                  prefs.edit().putStringSet(KEY_MANIFEST_URLS, next).apply()
              }
          '''
          new_remove = '''    fun remove(manifestUrl: String) {
                  val next = manifestUrls().toMutableSet()
                  next -= manifestUrl
                  prefs.edit()
                      .putStringSet(
                          KEY_MANIFEST_URLS,
                          next,
                      )
                      .remove(
                          addonEnabledKey(manifestUrl)
                      )
                      .apply()
              }
          '''
          if old_remove in addon:
              addon = addon.replace(old_remove, new_remove, 1)

          if "KEY_CATALOG_ORDER" not in addon:
              anchor = '        private const val KEY_MANIFEST_URLS = "stremio_manifest_urls"\n'
              addon = replace_once(
                  addon,
                  anchor,
                  anchor + '        private const val KEY_CATALOG_ORDER = "catalog_order"\n',
                  "AddonStore catalog constant",
              )

          require(
              "fun isAddonEnabled(" in addon and
              "fun reconcileCatalogOrder(" in addon and
              "KEY_CATALOG_ORDER" in addon,
              "AddonStore final markers missing",
          )
          addon_path.write_text(addon, encoding="utf-8")

          # ============================================================
          # 2. PluginStore.kt
          # ============================================================
          plugin_store_path = Path(
              "app/src/main/java/com/vueo/app/core/plugin/PluginStore.kt"
          )
          plugin_store = plugin_store_path.read_text(encoding="utf-8")

          if "fun isRepositoryEnabled(" not in plugin_store:
              anchor = '''    fun setPluginsEnabled(enabled: Boolean) {
                  prefs.edit()
                      .putBoolean(KEY_PLUGINS_ENABLED, enabled)
                      .apply()
              }
          '''
              addition = anchor + '''
              fun isRepositoryEnabled(
                  repository: PluginRepositoryDescriptor,
              ): Boolean =
                  prefs.getBoolean(
                      repositoryEnabledKey(
                          repository.manifestUrl
                      ),
                      true,
                  )

              fun setRepositoryEnabled(
                  repository: PluginRepositoryDescriptor,
                  enabled: Boolean,
              ) {
                  prefs.edit()
                      .putBoolean(
                          repositoryEnabledKey(
                              repository.manifestUrl
                          ),
                          enabled,
                      )
                      .apply()
              }
          '''
              plugin_store = replace_once(
                  plugin_store,
                  anchor,
                  addition,
                  "PluginStore plugins toggle",
              )

          if "private fun repositoryEnabledKey(" not in plugin_store:
              anchor = '''    private fun providerKey(
                  repository: PluginRepositoryDescriptor,
                  provider: PluginProviderDescriptor,
              ): String =
                  "provider:${repository.manifestUrl}:${provider.id}"
          '''
              addition = '''    private fun repositoryEnabledKey(
                  manifestUrl: String,
              ): String =
                  "repository_enabled:$manifestUrl"

          ''' + anchor
              plugin_store = replace_once(
                  plugin_store,
                  anchor,
                  addition,
                  "PluginStore repository key",
              )

          old_remove = '''    fun remove(manifestUrl: String) {
                  saveRepositories(
                      repositories().filterNot {
                          it.manifestUrl == manifestUrl
                      }
                  )
                  codeStore.removeRepository(manifestUrl)
              }
          '''
          new_remove = '''    fun remove(manifestUrl: String) {
                  saveRepositories(
                      repositories().filterNot {
                          it.manifestUrl == manifestUrl
                      }
                  )
                  prefs.edit()
                      .remove(
                          repositoryEnabledKey(
                              manifestUrl
                          )
                      )
                      .apply()
                  codeStore.removeRepository(manifestUrl)
              }
          '''
          if old_remove in plugin_store:
              plugin_store = plugin_store.replace(
                  old_remove,
                  new_remove,
                  1,
              )

          old_count = '''    fun enabledProviderCount(): Int =
                  repositories().sumOf { repository ->
                      repository.providers.count { provider ->
                          isProviderEnabled(
                              repository,
                              provider,
                          )
                      }
                  }
          '''
          new_count = '''    fun enabledProviderCount(): Int =
                  repositories()
                      .filter(::isRepositoryEnabled)
                      .sumOf { repository ->
                          repository.providers.count { provider ->
                              isProviderEnabled(
                                  repository,
                                  provider,
                              )
                          }
                      }
          '''
          if old_count in plugin_store:
              plugin_store = plugin_store.replace(
                  old_count,
                  new_count,
                  1,
              )

          require(
              "fun isRepositoryEnabled(" in plugin_store and
              "fun setRepositoryEnabled(" in plugin_store,
              "PluginStore repository markers missing",
          )
          plugin_store_path.write_text(
              plugin_store,
              encoding="utf-8",
          )

          # ============================================================
          # 3. PluginRuntime.kt
          # ============================================================
          runtime_path = Path(
              "app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt"
          )
          runtime = runtime_path.read_text(encoding="utf-8")

          if ".filter(store::isRepositoryEnabled)" not in runtime:
              pattern = re.compile(
                  r'(val targets\s*=\s*store\.repositories\(\))(\s*\.flatMap\s*\{\s*repository\s*->)',
                  re.MULTILINE,
              )
              runtime, count = pattern.subn(
                  r'\1\n.filter(store::isRepositoryEnabled)\2',
                  runtime,
                  count=1,
              )
              require(
                  count == 1,
                  f"PluginRuntime repository target anchor count {count}",
              )

          runtime_path.write_text(runtime, encoding="utf-8")

          # ============================================================
          # 4. UnifiedMediaEngine.kt
          # ============================================================
          engine_path = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          )
          engine = engine_path.read_text(encoding="utf-8")

          if "CopyOnWriteArraySet" not in engine:
              engine = replace_once(
                  engine,
                  "import java.util.concurrent.CopyOnWriteArrayList\n",
                  "import java.util.concurrent.CopyOnWriteArrayList\n"
                  "import java.util.concurrent.CopyOnWriteArraySet\n",
                  "UnifiedMediaEngine imports",
              )

          if "disabledExtensionIds" not in engine:
              anchor = '''class UnifiedMediaEngine {
              private val extensions = CopyOnWriteArrayList<MediaExtension>()
          '''
              addition = '''class UnifiedMediaEngine {
              private val extensions = CopyOnWriteArrayList<MediaExtension>()
              private val disabledExtensionIds =
                  CopyOnWriteArraySet<String>()
          '''
              engine = replace_once(
                  engine,
                  anchor,
                  addition,
                  "UnifiedMediaEngine state",
              )

          if "fun setExtensionEnabled(" not in engine:
              anchor = '''    fun uninstall(id: String) {
                  extensions.removeAll { it.descriptor.id == id }
              }

              fun installed(): List<MediaExtension> = extensions.toList()
          '''
              addition = '''    fun uninstall(id: String) {
                  extensions.removeAll { it.descriptor.id == id }
                  disabledExtensionIds.remove(id)
              }

              fun setExtensionEnabled(
                  id: String,
                  enabled: Boolean,
              ) {
                  if (enabled) {
                      disabledExtensionIds.remove(id)
                  } else {
                      disabledExtensionIds.add(id)
                  }
              }

              fun isExtensionEnabled(
                  id: String,
              ): Boolean =
                  id !in disabledExtensionIds

              fun installed(): List<MediaExtension> = extensions.toList()
          '''
              engine = replace_once(
                  engine,
                  anchor,
                  addition,
                  "UnifiedMediaEngine enable methods",
              )

          if "fun activeStremioAddons()" not in engine:
              anchor = '''    fun stremioAddons(): List<MediaExtension> =
                  extensions.filter { it.descriptor.kind == ExtensionKind.STREMIO_ADDON }
          '''
              addition = anchor + '''
              fun activeStremioAddons(): List<MediaExtension> =
                  stremioAddons().filter {
                      isExtensionEnabled(
                          it.descriptor.id
                      )
                  }
          '''
              engine = replace_once(
                  engine,
                  anchor,
                  addition,
                  "UnifiedMediaEngine active addons",
              )

          start = engine.find("    suspend fun loadCatalogRows(")
          end = engine.find("    suspend fun search(", start)
          require(
              start >= 0 and end > start,
              "UnifiedMediaEngine loadCatalogRows boundaries missing",
          )

          load_catalog = '''    suspend fun loadCatalogRows(
                  maxRows: Int = 10,
                  forceRefresh: Boolean = false,
                  catalogOrder: List<String> = emptyList(),
              ): List<CatalogRow> = coroutineScope {
                  if (!forceRefresh) {
                      CatalogDiscoveryCache
                          .home()
                          ?.let {
                              return@coroutineScope orderCatalogRows(
                                  rows = it,
                                  catalogOrder = catalogOrder,
                              ).take(maxRows)
                          }
                  }

                  val orderIndex =
                      catalogOrder
                          .withIndex()
                          .associate {
                              it.value to it.index
                          }

                  val candidates =
                      activeStremioAddons()
                          .flatMap { extension ->
                              extension.descriptor.catalogs
                                  .filter {
                                      it.canLoadWithoutExtras
                                  }
                                  .map { catalog ->
                                      extension to catalog
                                  }
                          }
                          .sortedBy {
                              (extension, catalog) ->
                              orderIndex[
                                  catalogKey(
                                      extensionId =
                                          extension.descriptor.id,
                                      type = catalog.type,
                                      catalogId = catalog.id,
                                  )
                              ] ?: Int.MAX_VALUE
                          }
                          .take(maxRows)

                  val rows =
                      candidates
                          .map {
                              (extension, catalog) ->
                              async {
                                  runCatching {
                                      val page =
                                          withTimeoutOrNull(
                                              ADDON_REQUEST_TIMEOUT_MS
                                          ) {
                                              extension.catalog(
                                                  catalog.type,
                                                  catalog.id,
                                              )
                                          }
                                              ?: return@runCatching null

                                      CatalogRow(
                                          id =
                                              catalogKey(
                                                  extensionId =
                                                      extension.descriptor.id,
                                                  type =
                                                      catalog.type,
                                                  catalogId =
                                                      catalog.id,
                                              ),
                                          title =
                                              catalog.name
                                                  ?: "${extension.descriptor.name} " +
                                                      catalog.type
                                                          .replaceFirstChar {
                                                              it.uppercase()
                                                          },
                                          providerName =
                                              extension
                                                  .descriptor
                                                  .name,
                                          items =
                                              page.items,
                                      )
                                  }.getOrNull()
                              }
                          }
                          .awaitAll()
                          .filterNotNull()
                          .filter {
                              it.items.isNotEmpty()
                          }
                          .let {
                              orderCatalogRows(
                                  rows = it,
                                  catalogOrder = catalogOrder,
                              )
                          }

                  CatalogDiscoveryCache.putHome(
                      rows
                  )

                  rows
              }

              private fun catalogKey(
                  extensionId: String,
                  type: String,
                  catalogId: String,
              ): String =
                  "$extensionId:$type:$catalogId"

              private fun orderCatalogRows(
                  rows: List<CatalogRow>,
                  catalogOrder: List<String>,
              ): List<CatalogRow> {
                  if (catalogOrder.isEmpty()) {
                      return rows
                  }

                  val index =
                      catalogOrder
                          .withIndex()
                          .associate {
                              it.value to it.index
                          }

                  return rows.sortedBy {
                      index[it.id] ?: Int.MAX_VALUE
                  }
              }

          '''
          engine = engine[:start] + load_catalog + engine[end:]

          # Search only enabled addons.
          engine = engine.replace(
              "            stremioAddons()\n"
              "                .flatMap { extension ->",
              "            activeStremioAddons()\n"
              "                .flatMap { extension ->",
              1,
          )

          old_meta = '''        val provider =
                      extension(
                          item.sourceExtensionId
                      )
                          ?: return item
          '''
          new_meta = '''        val provider =
                      extension(
                          item.sourceExtensionId
                      )
                          ?.takeIf {
                              isExtensionEnabled(
                                  it.descriptor.id
                              )
                          }
                          ?: return item
          '''
          if old_meta in engine:
              engine = engine.replace(old_meta, new_meta, 1)

          old_stream = '''        val providers =
                      extensions.filter {
                          "stream" in
                              it.descriptor.resources
                      }
          '''
          new_stream = '''        val providers =
                      extensions.filter {
                          isExtensionEnabled(
                              it.descriptor.id
                          ) &&
                              "stream" in
                                  it.descriptor.resources
                      }
          '''
          if old_stream in engine:
              engine = engine.replace(old_stream, new_stream, 1)

          old_sub = '''        extensions
                      .filter { "subtitles" in it.descriptor.resources }
          '''
          new_sub = '''        extensions
                      .filter {
                          isExtensionEnabled(
                              it.descriptor.id
                          ) &&
                              "subtitles" in
                                  it.descriptor.resources
                      }
          '''
          if old_sub in engine:
              engine = engine.replace(old_sub, new_sub, 1)

          require(
              "fun activeStremioAddons()" in engine and
              "catalogOrder: List<String>" in engine,
              "UnifiedMediaEngine final markers missing",
          )
          engine_path.write_text(engine, encoding="utf-8")

          # ============================================================
          # 5. VueoApp.kt
          # ============================================================
          app_path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )
          app = app_path.read_text(encoding="utf-8")

          # Settings enum
          enum_start = app.find("private enum class SettingsPage {")
          enum_end = app.find("}", enum_start)
          require(
              enum_start >= 0 and enum_end > enum_start,
              "SettingsPage enum missing",
          )
          enum_block = app[enum_start:enum_end]
          if "    CATALOG_ORDER," not in enum_block:
              require(
                  "    PLUGINS,\n" in enum_block,
                  "SettingsPage PLUGINS missing",
              )
              enum_block = enum_block.replace(
                  "    PLUGINS,\n",
                  "    PLUGINS,\n    CATALOG_ORDER,\n",
                  1,
              )
              app = app[:enum_start] + enum_block + app[enum_end:]

          # Parent route
          parent_start = app.find("private fun parentSettingsPage(")
          parent_end = app.find("private enum class HomeMediaFilter", parent_start)
          require(
              parent_start >= 0 and parent_end > parent_start,
              "parentSettingsPage missing",
          )
          parent = app[parent_start:parent_end]
          if "SettingsPage.CATALOG_ORDER" not in parent:
              pattern = re.compile(
                  r'(SettingsPage\.ADDONS,\s*\n\s*SettingsPage\.PLUGINS)(\s*->\s*\n\s*SettingsPage\.CONTENT_MANAGER)'
              )
              parent, count = pattern.subn(
                  r'\1,\n        SettingsPage.CATALOG_ORDER\2',
                  parent,
                  count=1,
              )
              require(count == 1, "parent Content Manager anchor missing")
              app = app[:parent_start] + parent + app[parent_end:]

          # Boot restore disabled addon state.
          if app.count("store.isAddonEnabled(") < 1:
              old = '''        store.manifestUrls().forEach { manifestUrl ->
                      runCatching {
                          ExtensionInstaller.installStremioAddon(manifestUrl)
                      }.onSuccess(engine::install)
                  }
          '''
              new = '''        store.manifestUrls().forEach { manifestUrl ->
                      runCatching {
                          ExtensionInstaller.installStremioAddon(manifestUrl)
                      }.onSuccess { extension ->
                          engine.install(extension)
                          engine.setExtensionEnabled(
                              id =
                                  extension.descriptor.id,
                              enabled =
                                  store.isAddonEnabled(
                                      manifestUrl
                                  ),
                          )
                      }
                  }
          '''
              app = replace_once(
                  app,
                  old,
                  new,
                  "boot addon restore",
              )

          # Persistent reload restore disabled state.
          if app.count("store.isAddonEnabled(") < 2:
              old = """                                store.manifestUrls()
                                      .forEach { manifestUrl ->
                                          runCatching {
                                              ExtensionInstaller
                                                  .installStremioAddon(
                                                      manifestUrl
                                                  )
                                          }.onSuccess(
                                              engine::install
                                          )
                                      }
          """
              new = """                                store.manifestUrls()
                                      .forEach { manifestUrl ->
                                          runCatching {
                                              ExtensionInstaller
                                                  .installStremioAddon(
                                                      manifestUrl
                                                  )
                                          }.onSuccess { extension ->
                                              engine.install(
                                                  extension
                                              )
                                              engine.setExtensionEnabled(
                                                  id =
                                                      extension.descriptor.id,
                                                  enabled =
                                                      store.isAddonEnabled(
                                                          manifestUrl
                                                      ),
                                              )
                                          }
                                      }
          """
              count = app.count(old)
              require(
                  count == 1,
                  f"persistent reload addon restore anchor count {count}",
              )
              app = app.replace(
                  old,
                  new,
                  1,
              )

          # Content Manager routing callbacks.
          cm_route_start = app.find(
              "                    SettingsPage.CONTENT_MANAGER ->"
          )
          cm_route_end = app.find(
              "                    SettingsPage.ADDONS ->",
              cm_route_start,
          )
          require(
              cm_route_start >= 0 and cm_route_end > cm_route_start,
              "Content Manager route block missing",
          )
          cm_route = app[cm_route_start:cm_route_end]
          if "onCatalogOrder" not in cm_route:
              anchor = '''                            onPlugins = {
                                          settingsPage = SettingsPage.PLUGINS
                                      },
          '''
              require(
                  cm_route.count(anchor) == 1,
                  "Content Manager onPlugins anchor missing",
              )
              cm_route = cm_route.replace(
                  anchor,
                  anchor + '''                            onCatalogOrder = {
                                          settingsPage =
                                              SettingsPage.CATALOG_ORDER
                                      },
          ''',
                  1,
              )
              app = app[:cm_route_start] + cm_route + app[cm_route_end:]

          # Catalog Order route.
          if "SettingsPage.CATALOG_ORDER ->" not in app:
              anchor = '''                    SettingsPage.PLUGINS ->
                                  PluginsScreen(
                                      onBack = {
                                          settingsPage = SettingsPage.CONTENT_MANAGER
                                      },
                                  )
          '''
              replacement = anchor + '''                    SettingsPage.CATALOG_ORDER ->
                                  CatalogOrderScreen(
                                      engine = engine,
                                      store = store,
                                      contentVersion =
                                          contentVersion,
                                      onContentChanged = {
                                          contentVersion++
                                      },
                                      onBack = {
                                          settingsPage =
                                              SettingsPage.CONTENT_MANAGER
                                      },
                                  )
          '''
              app = replace_once(
                  app,
                  anchor,
                  replacement,
                  "Catalog Order Settings route",
              )

          # HomeScreen wiring.
          home_start = app.find("@Composable\nprivate fun HomeScreen(")
          home_end = app.find("@Composable\nprivate fun CatalogSection(", home_start)
          require(
              home_start >= 0 and home_end > home_start,
              "HomeScreen boundaries missing",
          )
          home = app[home_start:home_end]

          if "val homeAddonStore =" not in home:
              anchor = '''    val context =
                  LocalContext.current
          '''
              addition = anchor + '''    val homeAddonStore =
                  remember {
                      AddonStore(
                          context.applicationContext
                      )
                  }

              val catalogOrder =
                  remember(
                      contentVersion
                  ) {
                      homeAddonStore
                          .catalogOrder()
                  }

          '''
              home = replace_once(
                  home,
                  anchor,
                  addition,
                  "Home context",
              )

          old_rows = '''    var rows by remember {
                  mutableStateOf(
                      CatalogDiscoveryCache
                          .home(
                              allowStale = true
                          )
                          .orEmpty()
                  )
              }
          '''
          new_rows = '''    var rows by remember(
                  contentVersion,
                  catalogOrder,
              ) {
                  mutableStateOf(
                      orderHomeCatalogRows(
                          rows =
                              CatalogDiscoveryCache
                                  .home(
                                      allowStale = true
                                  )
                                  .orEmpty(),
                          catalogOrder =
                              catalogOrder,
                      )
                  )
              }
          '''
          if old_rows in home:
              home = home.replace(old_rows, new_rows, 1)

          old_cache = '''            ?.let {
                          rows = it
                      }
          '''
          new_cache = '''            ?.let {
                          rows =
                              orderHomeCatalogRows(
                                  rows = it,
                                  catalogOrder =
                                      catalogOrder,
                              )
                      }
          '''
          if old_cache in home:
              home = home.replace(old_cache, new_cache, 1)

          old_load = '''            engine.loadCatalogRows(
                          forceRefresh =
                              rows.isNotEmpty(),
                      )
          '''
          new_load = '''            engine.loadCatalogRows(
                          forceRefresh =
                              rows.isNotEmpty(),
                          catalogOrder =
                              catalogOrder,
                      )
          '''
          if old_load in home:
              home = home.replace(old_load, new_load, 1)

          if "rows = fresh" in home:
              home = home.replace(
                  "                rows = fresh\n",
                  '''                rows =
                              orderHomeCatalogRows(
                                  rows = fresh,
                                  catalogOrder =
                                      catalogOrder,
                              )
          ''',
                  1,
              )

          fallback = '''                rows =
                              CatalogDiscoveryCache
                                  .home(
                                      allowStale =
                                          true
                                  )
