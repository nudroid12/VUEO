name: Apply VUEO v0.2 Content Manager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v02:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply VUEO v0.2 source update
        shell: bash
        env:
          VUEO_FILES_B64_JSON: '{".github/workflows/build-vueo-apk.yml":"","ARCHITECTURE.md":"","README.md":"","app/build.gradle.kts":"","app/src/main/AndroidManifest.xml":"","app/src/main/java/com/vueo/app/MainActivity.kt":"","app/src/main/java/com/vueo/app/core/extensions/ExtensionInstaller.kt":"","app/src/main/java/com/vueo/app/core/extensions/ExtensionModels.kt":"","app/src/main/java/com/vueo/app/core/extensions/MediaExtension.kt":"","app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt":"","app/src/main/java/com/vueo/app/core/model/MediaModels.kt":"","app/src/main/java/com/vueo/app/core/storage/AddonStore.kt":"","app/src/main/java/com/vueo/app/core/stremio/SimpleHttp.kt":"","app/src/main/java/com/vueo/app/core/stremio/StremioAddonProvider.kt":"","app/src/main/java/com/vueo/app/ui/VueoApp.kt":"","app/src/main/java/com/vueo/app/ui/components/NetworkImage.kt":"","app/src/main/java/com/vueo/app/ui/theme/Theme.kt":"","app/src/main/res/drawable/ic_vueo.xml":"","app/src/main/res/values/strings.xml":"PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlZVRU88L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==","app/src/main/res/values/themes.xml":"","build.gradle.kts":"cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI5LjEuMSIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5wbHVnaW4uY29tcG9zZSIpIHZlcnNpb24gIjIuMy4yMSIgYXBwbHkgZmFsc2UKfQo=","gradle.properties":"b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKb3JnLmdyYWRsZS5wYXJhbGxlbD10cnVlCm9yZy5ncmFkbGUuY2FjaGluZz10cnVlCmFuZHJvaWQudXNlQW5kcm9pZFg9dHJ1ZQphbmRyb2lkLm5vblRyYW5zaXRpdmVSQ2xhc3M9dHJ1ZQo=","settings.gradle.kts":""}'
          VUEO_REMOVE_JSON: '["app/src/main/java/com/vueo/app/core/plugin/VueoPluginProvider.kt","vueo-plugin-example.json"]'
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = json.loads(os.environ["VUEO_FILES_B64_JSON"])
          remove = json.loads(os.environ["VUEO_REMOVE_JSON"])

          for rel, encoded in files.items():
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f"updated: {rel}")

          for rel in remove:
              path = Path(rel)
              if path.exists():
                  path.unlink()
                  print(f"removed: {rel}")

          print()
          print(f"Applied {len(files)} VUEO v0.2 files.")
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle.kts
          test -f app/src/main/java/com/vueo/app/ui/VueoApp.kt
          test -f app/src/main/java/com/vueo/app/core/storage/AddonStore.kt
          test -f app/src/main/java/com/vueo/app/core/stremio/StremioAddonProvider.kt

          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'versionName = "0.2.0"' app/build.gradle.kts
          grep -q 'Content Manager' app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if grep -R "VUEO Plugin V1" app/src/main/java 2>/dev/null; then
            echo "::error::Old generic VUEO plugin implementation still exists."
            exit 1
          fi

          echo "VUEO v0.2 sanity checks passed."

      - name: Show changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short

      - name: Commit VUEO v0.2
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet &&              [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Upgrade VUEO to v0.2 Content Manager"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.2 Update"
            echo
            echo "- Content Manager architecture"
            echo "- Stremio Addon Manager"
            echo "- Persistent addon manifests"
            echo "- Real catalog loading"
            echo "- Metadata loading"
            echo "- Stream discovery"
            echo "- Generic VUEO plugin prototype removed"
            echo "- JavaScript Provider Plugins reserved for next milestone"
          } >> "$GITHUB_STEP_SUMMARY"
