      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.7.0"' \
            app/build.gradle.kts

          grep -q 'data class LibraryPlaybackEntry' \
            app/src/main/java/com/vueo/app/core/storage/LibraryStore.kt

          grep -q 'fun continueWatching()' \
            app/src/main/java/com/vueo/app/core/storage/LibraryStore.kt

          grep -q 'fun recordPlayback(' \
            app/src/main/java/com/vueo/app/core/storage/LibraryStore.kt

          grep -q 'private fun LibraryScreen' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'Continue Watching' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'Add to My List' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'recordLibraryProgress' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'PlayerFullscreenEffect' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'SMART SOURCE ENGINE' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if git status --short | \
             grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.7.0 sanity checks passed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet || \
             [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name \
              "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m \
                "Add VUEO local Library"

              git push origin \
                "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if \
              [ -n "${ANDROID_HOME:-}" ] && \
              [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Build VUEO v0.7.0 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload VUEO v0.7.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.7.0-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.7.0"
            echo
            echo "- Real Library screen"
            echo "- Continue Watching"
            echo "- Persistent My List"
            echo "- Playback History"
            echo "- Episode-aware continue navigation"
            echo "- Progress bars"
            echo "- Remove and clear actions"
            echo "- Player updates Library automatically"
            echo "- Existing Player, Discovery and Source Engine retained"
            echo "- APK built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
