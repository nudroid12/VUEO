name: Fix VUEO v0.9.3 Settings Section Label

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Settings section label references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          )

          text = path.read_text(encoding="utf-8")

          old = "VueoSettingsSectionLabel("
          new = "VueoSectionLabel("

          count = text.count(old)

          if count == 0:
              print("Section label hotfix already applied.")
          else:
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print(f"Replaced {count} incorrect section label references.")
          PY

      - name: Verify hotfix
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"

          if grep -Fq 'VueoSettingsSectionLabel(' "$FILE"; then
            echo "::error::Incorrect VueoSettingsSectionLabel reference remains."
            exit 1
          fi

          grep -Fq 'VueoSectionLabel("BACKUP & RESTORE")' "$FILE"
          grep -Fq 'VueoSectionLabel("CACHE & HISTORY")' "$FILE"
          grep -Fq 'VueoSectionLabel("RESET")' "$FILE"
          grep -Fq 'private fun VueoSectionLabel(' "$FILE"

          grep -q 'versionCode = 20' app/build.gradle.kts
          grep -q 'versionName = "0.9.3"' app/build.gradle.kts

          if git status --short | grep -E '^.. \.github/workflows/'; then
            echo "::error::Hotfix attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push hotfix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoSettings.kt

          if ! git diff --cached --quiet; then
            git commit -m "Fix VUEO v0.9.3 settings section labels"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Hotfix already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload VUEO v0.9.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.3-settings-label-hotfix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.3 Settings Label Hotfix"
            echo
            echo "- Fixes unresolved VueoSettingsSectionLabel references"
            echo "- Uses existing VueoSectionLabel composable"
            echo "- No feature changes"
            echo "- Version remains 0.9.3, code 20"
          } >> "$GITHUB_STEP_SUMMARY"
