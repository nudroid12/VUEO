name: Apply VUEO Library Final Corrected

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-library-final-corrected
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout VUEO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply agreed Library Final
        shell: bash
        env:
          VUEO_LIBRARY_BLOCK_B64: ""
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64
          import os
          import re

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )
          gradle_path = Path(
              "app/build.gradle.kts"
          )

          if not path.exists():
              raise SystemExit(
                  "VueoApp.kt not found."
              )

          if not gradle_path.exists():
              raise SystemExit(
                  "app/build.gradle.kts not found."
              )

          text = path.read_text(
              encoding="utf-8"
          )

          start_marker = (
              "@Composable\n"
              "private fun LibraryScreen("
          )
          end_marker = (
              "@Composable\n"
              "private fun LibrarySectionHeader("
          )

          start = text.find(start_marker)
          end = text.find(
              end_marker,
              start + 1,
          )

          if start < 0:
              raise SystemExit(
                  "LibraryScreen was not found."
              )

          if end < 0:
              raise SystemExit(
                  "LibrarySectionHeader boundary was not found."
              )

          replacement = (
              base64.b64decode(
                  os.environ[
                      "VUEO_LIBRARY_BLOCK_B64"
                  ]
              )
              .decode("utf-8")
          )

          updated = (
              text[:start]
              + replacement
              + text[end:]
          )

          path.write_text(
              updated,
              encoding="utf-8",
          )

          gradle = gradle_path.read_text(
              encoding="utf-8"
          )

          code_match = re.search(
              r'versionCode\s*=\s*(\d+)',
              gradle,
          )
          name_match = re.search(
              r'versionName\s*=\s*"(\d+)\.(\d+)\.(\d+)"',
              gradle,
          )

          if (
              code_match is None or
              name_match is None
          ):
              raise SystemExit(
                  "Could not read app version."
              )

          version_code = (
              int(code_match.group(1)) + 1
          )
          major = int(
              name_match.group(1)
          )
          minor = int(
              name_match.group(2)
          )
          patch = int(
              name_match.group(3)
          ) + 1

          version_name = (
              f"{major}.{minor}.{patch}"
          )

          gradle = re.sub(
              r'versionCode\s*=\s*\d+',
              f"versionCode = {version_code}",
              gradle,
              count=1,
          )
          gradle = re.sub(
              r'versionName\s*=\s*"\d+\.\d+\.\d+"',
              f'versionName = "{version_name}"',
              gradle,
              count=1,
          )

          gradle_path.write_text(
              gradle,
              encoding="utf-8",
          )

          print(
              "Applied agreed Library Final "
              f"as {version_name} "
              f"({version_code})."
          )
          PY

      - name: Verify agreed Library design
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )
          text = path.read_text(
              encoding="utf-8"
          )

          start = text.index(
              "private fun LibraryScreen("
          )
          end = text.index(
              "private fun LibrarySectionHeader(",
              start,
          )
          block = text[start:end]

          required = [
              'store.watchlist()',
              'label = "Saved"',
              'label = "Cloud"',
              'LibraryViewModeButton(',
              '.chunked(3)',
              'SearchPosterTile(',
              'LibrarySavedListRow(',
              'title =\n                        "Cloud library"',
              '"Your library is empty"',
          ]

          for token in required:
              if token not in block:
                  raise SystemExit(
                      f"Missing agreed Library item: {token}"
                  )

          forbidden = [
              'continueWatching()',
              'store.history()',
              '"Continue Watching"',
              '"Watch History"',
          ]

          for token in forbidden:
              if token in block:
                  raise SystemExit(
                      f"Library still contains removed item: {token}"
                  )

          print(
              "Agreed Library Final checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch modified workflow files."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Commit verified Library Final
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No source changes."
            exit 0
          fi

          git config user.name             "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/build.gradle.kts

          git commit -m             "Finalize agreed VUEO Library"

          git push origin             "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Library Final"
            echo
            echo "- Saved tab"
            echo "- Cloud tab placeholder"
            echo "- Grid and list view toggle"
            echo "- 3-column poster grid"
            echo "- List view with poster, title and metadata"
            echo "- Tap title to open Details"
            echo "- No Continue Watching inside Library"
            echo "- Continue Watching remains on Home"
          } >> "$GITHUB_STEP_SUMMARY"
