      - name: Sanity check v0.9.1
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="app/build.gradle.kts"
          UI_FILE="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          SETTINGS_UI="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          SETTINGS_STORE="app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"

          grep -q 'versionCode = 18' "$BUILD_FILE"
          grep -q 'versionName = "0.9.1"' "$BUILD_FILE"

          test -f "$SETTINGS_UI"
          test -f "$SETTINGS_STORE"

          grep -q 'AppTab.SETTINGS' "$UI_FILE"
          grep -q 'VueoSettingsHub' "$UI_FILE"
          grep -q 'SettingsPage.ENHANCEMENTS' "$UI_FILE"
          grep -q 'SettingsPage.SUBTITLES' "$UI_FILE"
          grep -q 'SettingsPage.DATA_STORAGE' "$UI_FILE"

          grep -q '"Content Manager"' "$SETTINGS_UI"
          grep -q '"Enhancements"' "$SETTINGS_UI"
          grep -q '"Playback"' "$SETTINGS_UI"
          grep -q '"Subtitles"' "$SETTINGS_UI"
          grep -q '"Sources"' "$SETTINGS_UI"
          grep -q '"Appearance"' "$SETTINGS_UI"
          grep -q '"Data & Storage"' "$SETTINGS_UI"
          grep -q '"Updates"' "$SETTINGS_UI"
          grep -q '"About VUEO"' "$SETTINGS_UI"

          grep -q 'TmdbEnhancementSettingsScreen' "$SETTINGS_UI"
          grep -q 'MdblistEnhancementSettingsScreen' "$SETTINGS_UI"
          grep -q 'mdblistApiKey' "$SETTINGS_STORE"
          grep -q 'preferredSubtitleLanguage' "$SETTINGS_STORE"
          grep -q 'subtitlesOnByDefault' "$SETTINGS_STORE"
          grep -q 'automaticUpdateChecksEnabled' "$SETTINGS_STORE"

          if grep -q 'TMDB Bridge' "$UI_FILE"; then
            echo "::error::TMDB configuration still appears inside Plugins."
            exit 1
          fi

          if grep -q 'AppTab.CONTENT_MANAGER' "$UI_FILE"; then
            echo "::error::Legacy Content Manager bottom tab remains."
            exit 1
          fi

          grep -q 'restoreHome'             app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt

          grep -q 'suspend fun clearAll'             app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt

          grep -q 'withTimeoutOrNull'             app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          grep -q 'fun clearAll()'             app/src/main/java/com/vueo/app/core/extensions/SourceDiscoveryCache.kt

          grep -q 'PluginHttp.client'             app/src/main/java/com/vueo/app/core/stremio/SimpleHttp.kt

          grep -q 'record_v2:'             app/src/main/java/com/vueo/app/core/plugin/PluginHealthStore.kt

          grep -q 'librarySaveTicks' "$UI_FILE"
          grep -q 'PlayerFullscreenEffect' "$UI_FILE"
          grep -q 'VUEO RECOMMENDS' "$UI_FILE"
          grep -q 'subtitleLanguagePriority' "$UI_FILE"
          grep -q 'setTrackTypeDisabled' "$UI_FILE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          ui = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(encoding="utf-8")

          settings = Path(
              "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          ).read_text(encoding="utf-8")

          store = Path(
              "app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          ).read_text(encoding="utf-8")

          app_start = ui.index("fun VueoApp()")
          details_start = ui.index(
              "private fun MediaDetailsScreen("
          )
          details_state = ui.index(
              "    var item by remember",
              details_start,
          )

          root_count = ui[
              app_start:details_start
          ].count(
              "val libraryStore = remember {"
          )

          details_count = ui[
              details_start:details_state
          ].count(
              "val libraryStore = remember {"
          )

          if root_count != 1:
              raise SystemExit(
                  f"Root LibraryStore regression: {root_count}"
              )

          if details_count != 1:
              raise SystemExit(
                  f"Details LibraryStore regression: {details_count}"
              )

          enum_match = re.search(
              r"private enum class SettingsPage\s*\{(.*?)\n\}",
              ui,
              re.S,
          )
          if not enum_match:
              raise SystemExit("SettingsPage enum missing")

          required_pages = {
              "ROOT",
              "CONTENT_MANAGER",
              "ADDONS",
              "PLUGINS",
              "ENHANCEMENTS",
              "TMDB",
              "MDBLIST",
              "PLAYBACK",
              "SUBTITLES",
              "SOURCES",
              "APPEARANCE",
              "DATA_STORAGE",
              "UPDATES",
              "ABOUT",
          }

          enum_body = enum_match.group(1)
          missing = [
              page
              for page in sorted(required_pages)
              if page not in enum_body
          ]
          if missing:
              raise SystemExit(
                  f"Missing Settings pages: {missing}"
              )

          for label in (
              "Content Manager",
              "Enhancements",
              "Playback",
              "Subtitles",
              "Sources",
              "Appearance",
              "Data & Storage",
              "Updates",
              "About VUEO",
          ):
              if label not in settings:
                  raise SystemExit(
                      f"Missing Settings card: {label}"
                  )

          for method in (
              "resumePlaybackEnabled",
              "preferredQuality",
              "showSourceTechnicalDetails",
              "preferredSubtitleLanguage",
              "secondarySubtitleLanguage",
              "subtitlesOnByDefault",
              "autoSelectPreferredSubtitle",
              "embeddedSubtitlePriority",
              "subtitleSize",
              "tmdbMetadataEnrichmentEnabled",
              "tmdbRecommendationsEnabled",
              "tmdbSimilarTitlesEnabled",
              "tmdbArtworkEnrichmentEnabled",
              "mdblistApiKey",
              "mdblistRatingsEnabled",
              "automaticUpdateChecksEnabled",
          ):
              if f"fun {method}" not in store:
                  raise SystemExit(
                      f"Missing SettingsStore method: {method}"
                  )

          print(
              "VUEO v0.9.1 final structural checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||              [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name               "github-actions[bot]"
            git config user.email               "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m                 "Replace VUEO v0.9.1 settings architecture"

              git push origin                 "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if               [ -n "${ANDROID_HOME:-}" ] &&               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build VUEO v0.9.1 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          APK="$(
            find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.1-settings-final-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.1 Settings Final"
            echo
            echo "- Cumulative from the last known stable v0.8 source"
            echo "- Retains v0.9 performance and stability hardening"
            echo "- Settings hub with Content Manager as its own section"
            echo "- Optional Enhancements with TMDB and MDBList"
            echo "- TMDB configuration removed from Plugins"
            echo "- Playback preferences"
            echo "- First-class Subtitle settings"
            echo "- Source preferences and Smart Source status"
            echo "- Appearance foundation"
            echo "- Data and Storage controls"
            echo "- Updates foundation"
            echo "- About VUEO"
          } >> "$GITHUB_STEP_SUMMARY"
