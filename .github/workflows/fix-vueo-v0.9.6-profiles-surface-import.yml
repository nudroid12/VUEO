name: Fix VUEO v0.9.6 Profiles Surface Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Surface import hotfix
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          )
          text = path.read_text(encoding="utf-8")

          required = "import androidx.compose.material3.Surface\n"

          if required not in text:
              anchor = "import androidx.compose.material3.Switch\n"
              if anchor not in text:
                  raise SystemExit(
                      "Could not find Material3 Switch import anchor."
                  )
              text = text.replace(
                  anchor,
                  anchor + required,
                  1,
              )
              path.write_text(text, encoding="utf-8")
              print("Added missing Material3 Surface import.")
          else:
              print("Surface import already present.")
          PY

      - name: Sanity check hotfix
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          BUILD="app/build.gradle.kts"

          grep -Fq \
            'import androidx.compose.material3.Surface' \
            "$FILE"

          grep -Fq 'Surface(' "$FILE"
          grep -q 'versionCode = 23' "$BUILD"
          grep -q 'versionName = "0.9.6"' "$BUILD"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/ui/VueoProfiles.kt"
          )
          text = path.read_text(encoding="utf-8")

          if text.count(
              "import androidx.compose.material3.Surface"
          ) != 1:
              raise SystemExit(
                  "Surface import must appear exactly once."
              )

          if text.count("Surface(") < 2:
              raise SystemExit(
                  "Expected both Surface usages in VueoProfiles.kt."
              )

          print("v0.9.6 Surface import hotfix checks passed.")
          PY

          if git status --short | \
             grep -E '^.. \.github/workflows/'; then
            echo "::error::Hotfix attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/vueo/app/ui/VueoProfiles.kt

          if ! git diff --cached --quiet; then
            git commit -m \
              "Fix v0.9.6 profile Surface import"
            git push origin \
              "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Surface import hotfix already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f \
            ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Build VUEO v0.9.6 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.6-surface-import-hotfix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.6 Surface Import Hotfix"
            echo
            echo "- Fixes missing Material3 Surface import in VueoProfiles.kt"
            echo "- Keeps version 0.9.6, code 23"
            echo "- Recompiles and rebuilds the APK in the same run"
          } >> "$GITHUB_STEP_SUMMARY"
