      - name: Verify hotfix
        shell: bash
        run: |
          set -euo pipefail

          CACHE="app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ENGINE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"

          grep -Fq 'return@withContext emptyList<CatalogRow>()' "$CACHE"
          grep -Fq 'return@runCatching emptyList<CatalogRow>()' "$CACHE"
          grep -Fq 'emptyList<CatalogRow>()' "$CACHE"
          grep -Fq 'return@runCatching null' "$ENGINE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path(
              "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ).read_text(encoding="utf-8")

          engine = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          ).read_text(encoding="utf-8")

          bad_patterns = [
              (cache, r"return@withContext\s*\n\s*emptyList"),
              (cache, r"return@runCatching\s*\n\s*emptyList"),
              (engine, r"return@runCatching\s*\n\s*null"),
          ]

          for text, pattern in bad_patterns:
              if re.search(pattern, text):
                  raise SystemExit(
                      f"Broken split labelled return still present: {pattern}"
                  )

          print("v0.9.1 labelled-return hotfix checks passed.")
          PY

          grep -q 'versionCode = 18' app/build.gradle.kts
          grep -q 'versionName = "0.9.1"' app/build.gradle.kts

          if git status --short | grep -E '^.. \.github/workflows/'; then
            echo "::error::Hotfix attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push hotfix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt             app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          if ! git diff --cached --quiet; then
            git commit -m "Fix VUEO v0.9.1 Kotlin labelled returns"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Hotfix already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload VUEO v0.9.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.1-settings-hotfix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.1 Compile Hotfix"
            echo
            echo "- Fixed CatalogDiscoveryCache labelled return typing"
            echo "- Added explicit CatalogRow empty-list typing"
            echo "- Fixed UnifiedMediaEngine runCatching nullable return"
            echo "- Version remains 0.9.1, code 18"
          } >> "$GITHUB_STEP_SUMMARY"
