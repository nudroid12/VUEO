      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.8.0"' \
            app/build.gradle.kts

          grep -q 'object VueoPalette' \
            app/src/main/java/com/vueo/app/ui/VueoDesign.kt

          grep -q 'FEATURED' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'Find something to watch' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'LibraryMetricPill' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'CONTROL CENTER' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'VUEO RECOMMENDS' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'PlayerFullscreenEffect' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'SMART SOURCE ENGINE' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          python3 - <<'PY'
          from pathlib import Path

          text = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(
              encoding="utf-8"
          )

          app_start = text.index(
              "fun VueoApp()"
          )

          details_start = text.index(
              "private fun MediaDetailsScreen("
          )

          details_state = text.index(
              "    var item by remember",
              details_start,
          )

          root_count = text[
              app_start:
              details_start
          ].count(
              "val libraryStore = remember {"
          )

          details_count = text[
              details_start:
              details_state
          ].count(
              "val libraryStore = remember {"
          )

          print(
              "Root LibraryStore:",
              root_count,
          )
          print(
              "Details LibraryStore:",
              details_count,
          )

          if root_count != 1:
              raise SystemExit(
                  "Root LibraryStore scope regression."
              )

          if details_count != 1:
              raise SystemExit(
                  "Details LibraryStore scope regression."
              )

          if text.count("{") != text.count("}"):
              raise SystemExit(
                  "VueoApp.kt brace mismatch."
              )

          print(
              "v0.8 structural checks passed."
          )
          PY

          if git status --short | \
             grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

          echo "VUEO v0.8.0 sanity checks passed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet || \
             [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name \
              "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m \
                "Polish VUEO UI and UX"

              git push origin \
                "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f \
            ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if \
              [ -n "${ANDROID_HOME:-}" ] && \
              [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo \
                "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Build VUEO v0.8.0 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo \
              "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload VUEO v0.8.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.8.0-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.8.0"
            echo
            echo "- Unified VUEO dark visual system"
            echo "- Restrained neon VUEO identity"
            echo "- Cinematic Home hero"
            echo "- Polished catalog poster cards"
            echo "- Redesigned Search"
            echo "- Refined Details hierarchy"
            echo "- Library dashboard polish"
            echo "- Consumer-facing Source Picker"
            echo "- Content Manager control-center redesign"
            echo "- All v0.4-v0.7 functionality retained"
            echo "- APK built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
