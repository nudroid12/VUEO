      - name: Sanity check v0.9.3
        shell: bash
        run: |
          set -euo pipefail

          BUILD="app/build.gradle.kts"
          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          SETTINGS_UI="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          SETTINGS_STORE="app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          BACKUP="app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt"
          MIGRATION="app/src/main/java/com/vueo/app/core/storage/VueoDataMigration.kt"
          UPDATE="app/src/main/java/com/vueo/app/core/update/VueoUpdateManager.kt"
          CACHE="app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ENGINE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"

          grep -q 'versionCode = 20' "$BUILD"
          grep -q 'versionName = "0.9.3"' "$BUILD"

          test -f "$BACKUP"
          test -f "$MIGRATION"
          test -f "$UPDATE"
          test -f update.json

          grep -Fq 'object VueoBackupManager' "$BACKUP"
          grep -Fq 'CURRENT_SCHEMA_VERSION = 1' "$BACKUP"
          grep -Fq 'vueo_content_manager' "$BACKUP"
          grep -Fq 'vueo_plugins' "$BACKUP"
          grep -Fq 'vueo_settings' "$BACKUP"
          grep -Fq 'vueo_library' "$BACKUP"
          grep -Fq 'vueo_playback' "$BACKUP"
          grep -Fq 'tmdb_api_key' "$BACKUP"
          grep -Fq 'mdblist_api_key' "$BACKUP"
          grep -Fq 'restoreFromUri' "$BACKUP"
          grep -Fq 'resetUserData' "$BACKUP"

          grep -Fq 'object VueoDataMigration' "$MIGRATION"
          grep -Fq 'CURRENT_SCHEMA_VERSION = 1' "$MIGRATION"
          grep -Fq 'migrateIfNeeded' "$MIGRATION"

          grep -Fq 'object VueoUpdateManager' "$UPDATE"
          grep -Fq 'VueoUpdateStore' "$UPDATE"
          grep -Fq 'DEFAULT_MANIFEST_URL' "$UPDATE"
          grep -Fq 'raw.githubusercontent.com/nudroid12/VUEO/main/update.json' "$UPDATE"
          grep -Fq 'AUTO_CHECK_INTERVAL_MS' "$UPDATE"
          grep -Fq 'downloadUrl' "$UPDATE"
          grep -Fq 'telegramUrl' "$UPDATE"

          grep -Fq 'fun includeCredentialsInBackup' "$SETTINGS_STORE"
          grep -Fq 'fun setIncludeCredentialsInBackup' "$SETTINGS_STORE"

          grep -Fq 'ActivityResultContracts.CreateDocument' "$SETTINGS_UI"
          grep -Fq 'ActivityResultContracts.OpenDocument' "$SETTINGS_UI"
          grep -Fq 'Create Backup' "$SETTINGS_UI"
          grep -Fq 'Restore Backup' "$SETTINGS_UI"
          grep -Fq 'Include API Keys' "$SETTINGS_UI"
          grep -Fq 'Reset VUEO Data' "$SETTINGS_UI"
          grep -Fq 'Check for Updates' "$SETTINGS_UI"
          grep -Fq 'Open Telegram Release' "$SETTINGS_UI"
          grep -Fq 'VUEO 0.9.3' "$SETTINGS_UI"

          grep -Fq 'VueoDataMigration.migrateIfNeeded' "$APP"
          grep -Fq 'VueoUpdateManager.check' "$APP"
          grep -Fq 'onPersistentDataChanged' "$APP"
          grep -Fq 'providerCodeSync.syncMissing' "$APP"

          grep -Fq '@kotlin.jvm.JvmName("catalogRowsToJson")' "$CACHE"
          grep -Fq '@kotlin.jvm.JvmName("mediaItemsToJson")' "$CACHE"
          grep -Fq 'withTimeoutOrNull' "$ENGINE"
          grep -Fq 'PlayerFullscreenEffect' "$APP"
          grep -Fq 'librarySaveTicks' "$APP"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          app = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(encoding="utf-8")

          settings = Path(
              "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          ).read_text(encoding="utf-8")

          backup = Path(
              "app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt"
          ).read_text(encoding="utf-8")

          update = Path(
              "app/src/main/java/com/vueo/app/core/update/VueoUpdateManager.kt"
          ).read_text(encoding="utf-8")

          cache = Path(
              "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ).read_text(encoding="utf-8")

          engine = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          ).read_text(encoding="utf-8")

          manifest = json.loads(
              Path("update.json").read_text(encoding="utf-8")
          )

          if manifest.get("versionCode") != 20:
              raise SystemExit("update.json versionCode mismatch")

          if manifest.get("versionName") != "0.9.3":
              raise SystemExit("update.json versionName mismatch")

          if manifest.get("schemaVersion") != 1:
              raise SystemExit("update.json schema mismatch")

          if settings.count(
              "internal fun DataStorageSettingsScreen("
          ) != 1:
              raise SystemExit(
                  "DataStorageSettingsScreen declaration regression."
              )

          if settings.count(
              "internal fun UpdatesSettingsScreen("
          ) != 1:
              raise SystemExit(
                  "UpdatesSettingsScreen declaration regression."
              )

          if app.count(
              "DataStorageSettingsScreen("
          ) != 1:
              raise SystemExit(
                  "DataStorageSettingsScreen call regression."
              )

          app_start = app.index("fun VueoApp()")
          details_start = app.index(
              "private fun MediaDetailsScreen("
          )
          details_state = app.index(
              "    var item by remember",
              details_start,
          )

          root_count = app[
              app_start:details_start
          ].count(
              "val libraryStore = remember {"
          )

          details_count = app[
              details_start:details_state
          ].count(
              "val libraryStore = remember {"
          )

          if root_count != 1:
              raise SystemExit(
                  f"Root LibraryStore regression: {root_count}"
              )

          if details_count != 1:
              raise SystemExit(
                  f"Details LibraryStore regression: {details_count}"
              )

          bad_value_returns = [
              (
                  cache,
                  r"return@withContext\s*\n\s*emptyList",
              ),
              (
                  cache,
                  r"return@runCatching\s*\n\s*emptyList",
              ),
              (
                  engine,
                  r"return@runCatching\s*\n\s*null",
              ),
          ]

          for text, pattern in bad_value_returns:
              if re.search(pattern, text):
                  raise SystemExit(
                      "Split labelled value return regression."
                  )

          required_backup = [
              "exportToUri",
              "restoreFromUri",
              "resetUserData",
              "includesCredentials",
              "CREDENTIAL_KEYS",
              "CatalogDiscoveryCache.clearAll",
              "SourceDiscoveryCache.clearAll",
              "VueoDataMigration.migrateIfNeeded",
          ]

          for token in required_backup:
              if token not in backup:
                  raise SystemExit(
                      f"Missing backup feature: {token}"
                  )

          required_update = [
              "VueoUpdateRelease",
              "VueoUpdateStore",
              "VueoUpdateManager",
              "isNewerThanCurrent",
              "downloadUrl",
              "telegramUrl",
              "getResilient",
          ]

          for token in required_update:
              if token not in update:
                  raise SystemExit(
                      f"Missing update feature: {token}"
                  )

          if "Settings > Content Manager > Plugins" in app:
              raise SystemExit(
                  "Legacy TMDB Settings path regression."
              )

          print(
              "VUEO v0.9.3 structural checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/build.gradle.kts             app/src/main/java/com/vueo/app/core/stremio/SimpleHttp.kt             app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt             app/src/main/java/com/vueo/app/core/storage/VueoBackupManager.kt             app/src/main/java/com/vueo/app/core/storage/VueoDataMigration.kt             app/src/main/java/com/vueo/app/core/update/VueoUpdateManager.kt             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt             README.md             ARCHITECTURE.md             update.json

          if ! git diff --cached --quiet; then
            git commit -m               "Add VUEO v0.9.3 distribution and data"
            git push origin               "HEAD:${GITHUB_REF_NAME}"
          else
            echo "v0.9.3 patch already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build VUEO v0.9.3 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          APK="$(
            find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.3-distribution-data-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.3 Distribution & Data"
            echo
            echo "- Portable JSON backup and restore"
            echo "- API keys excluded from backups by default"
            echo "- Restore reloads addons and provider scripts"
            echo "- Reset VUEO data without uninstalling"
            echo "- Functional manual and automatic update checking"
            echo "- HTTPS APK and Telegram release-link support"
            echo "- Cached update state"
            echo "- Versioned local-data migration foundation"
            echo "- Version 0.9.3, code 20"
          } >> "$GITHUB_STEP_SUMMARY"
