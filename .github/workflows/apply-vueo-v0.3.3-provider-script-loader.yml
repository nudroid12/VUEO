name: Apply VUEO v0.3.3 Provider Script Loader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3.3 source patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          from pathlib import Path

          files = {'app/build.gradle.kts': '', 'app/src/main/java/com/vueo/app/core/stremio/SimpleHttp.kt': '', 'app/src/main/java/com/vueo/app/core/plugin/PluginRepositoryClient.kt': '', 'app/src/main/java/com/vueo/app/core/plugin/ProviderScriptCache.kt': '', 'app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt': '', 'README.md': '', 'ARCHITECTURE.md': ''}

          for rel, encoded in files.items():
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f"updated: {rel}")

          print(f"Applied {len(files)} VUEO v0.3.3 source files.")
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.3.3"' app/build.gradle.kts
          grep -q 'cdn.jsdelivr.net/gh' app/src/main/java/com/vueo/app/core/stremio/SimpleHttp.kt
          grep -q 'getResilient' app/src/main/java/com/vueo/app/core/plugin/PluginRepositoryClient.kt
          grep -q 'class ProviderScriptCache' app/src/main/java/com/vueo/app/core/plugin/ProviderScriptCache.kt
          grep -q 'scriptCache.get' app/src/main/java/com/vueo/app/core/plugin/PluginRuntime.kt

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app README.md ARCHITECTURE.md
            if ! git diff --cached --quiet; then
              git commit -m "Fix plugin script delivery and cache provider bundles"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=0 "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build VUEO v0.3.3 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.3.3-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.3.3"
            echo
            echo "- GitHub raw DNS fallback via jsDelivr"
            echo "- Provider script disk cache"
            echo "- Repository manifest resilient transport"
            echo "- Existing Provider Health diagnostics retained"
            echo "- APK built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
