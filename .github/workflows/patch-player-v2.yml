                                          )
                                              .toFloat()
                                              .coerceIn(
                                                  0f,
                                                  durationMs
                                                      .coerceAtLeast(
                                                          1L
                                                      )
                                                      .toFloat(),
                                              ),
                                      onValueChange = {
                                          value ->
                                          gestureSeekPositionMs =
                                              value.toLong()
                                      },
                                      onValueChangeFinished = {
                                          gestureSeekPositionMs
                                              ?.let {
                                                  player.seekTo(
                                                      it
                                                  )
                                              }
                                          gestureSeekPositionMs =
                                              null
                                      },
                                      valueRange =
                                          0f..
                                              durationMs
                                                  .coerceAtLeast(
                                                      1L
                                                  )
                                                  .toFloat(),
                                  )

                                  Row(
                                      modifier =
                                          Modifier.fillMaxWidth(),
                                      verticalAlignment =
                                          Alignment
                                              .CenterVertically,
                                  ) {
                                      Text(
                                          formatPlaybackTime(
                                              gestureSeekPositionMs
                                                  ?: currentPositionMs
                                          ),
                                          color =
                                              Color.White,
                                          fontSize = 10.sp,
                                          fontWeight =
                                              FontWeight
                                                  .SemiBold,
                                      )

                                      Spacer(
                                          Modifier.weight(
                                              1f
                                          )
                                      )

                                      Text(
                                          "−" +
                                              formatPlaybackTime(
                                                  (
                                                      durationMs -
                                                          currentPositionMs
                                                  ).coerceAtLeast(
                                                      0L
                                                  )
                                              ),
                                          color =
                                              Color.White.copy(
                                                  alpha = .62f
                                              ),
                                          fontSize = 10.sp,
                                      )
                                  }

                                  LazyRow(
                                      horizontalArrangement =
                                          Arrangement.spacedBy(
                                              7.dp
                                          ),
                                  ) {
                                      if (
                                          media.type ==
                                              "series" &&
                                          episodes
                                              .isNotEmpty()
                                      ) {
                                          item {
                                              PlayerControlChip(
                                                  label =
                                                      "Episodes",
                                                  onClick = {
                                                      showEpisodesDialog =
                                                          true
                                                  },
                                              )
                                          }
                                      }

                                      item {
                                          PlayerControlChip(
                                              label =
                                                  "Sources ${playableSources.size}",
                                              enabled =
                                                  playableSources
                                                      .isNotEmpty(),
                                              accent = true,
                                              onClick = {
                                                  showSourceDialog =
                                                      true
                                              },
                                          )
                                      }

                                      item {
                                          PlayerControlChip(
                                              label =
                                                  "Subtitles",
                                              onClick = {
                                                  showSubtitleDialog =
                                                      true
                                              },
                                          )
                                      }

                                      item {
                                          PlayerControlChip(
                                              label = "Audio",
                                              onClick = {
                                                  showAudioDialog =
                                                      true
                                              },
                                          )
                                      }

                                      item {
                                          PlayerControlChip(
                                              label =
                                                  if (
                                                      playbackSpeed ==
                                                          1f
                                                  ) {
                                                      "Speed"
                                                  } else {
                                                      "${playbackSpeed}x"
                                                  },
                                              onClick = {
                                                  showSpeedDialog =
                                                      true
                                              },
                                          )
                                      }

                                      item {
                                          PlayerControlChip(
                                              label =
                                                  if (zoomed) {
                                                      "Zoom"
                                                  } else {
                                                      "Fit"
                                                  },
                                              onClick = {
                                                  zoomed =
                                                      !zoomed
                                              },
                                          )
                                      }

                                      item {
                                          PlayerControlChip(
                                              label = "PiP",
                                              enabled =
                                                  Build.VERSION
                                                      .SDK_INT >=
                                                      26,
                                              onClick = {
                                                  enterVueoPictureInPicture(
                                                      activity
                                                  )
                                              },
                                          )
                                      }

                                      item {
                                          PlayerControlChip(
                                              label = "Lock",
                                              onClick = {
                                                  controlsLocked =
                                                      true
                                                  controlsVisible =
                                                      false
                                              },
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }'''

          player = replace_balanced_block(
              player,
              controls_marker,
              new_controls,
              "Player controls overlay",
          )

          # ============================================================
          # 9. Source HUD when controls fade away.
          # ============================================================
          if "if (sourceHudVisible && !controlsVisible" not in player:
              locked_anchor = '''        if (controlsLocked) {
          '''
              hud = '''        if (
                      sourceHudVisible &&
                      !controlsVisible &&
                      !controlsLocked
                  ) {
                      Surface(
                          modifier =
                              Modifier
                                  .align(
                                      Alignment.BottomEnd
                                  )
                                  .padding(
                                      18.dp
                                  ),
                          shape =
                              RoundedCornerShape(
                                  14.dp
                              ),
                          color =
                              Color.Black.copy(
                                  alpha = .66f
                              ),
                          border =
                              androidx.compose
                                  .foundation
                                  .BorderStroke(
                                      1.dp,
                                      VueoPalette
                                          .Accent
                                          .copy(
                                              alpha = .35f
                                          ),
                                  ),
                      ) {
                          Column(
                              modifier =
                                  Modifier.padding(
                                      horizontal =
                                          13.dp,
                                      vertical =
                                          9.dp,
                                  ),
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      1.dp
                                  ),
                          ) {
                              Text(
                                  "SOURCE",
                                  color =
                                      VueoPalette.Accent,
                                  fontSize = 8.sp,
                                  fontWeight =
                                      FontWeight.Black,
                                  letterSpacing = .8.sp,
                              )
                              Text(
                                  playerSourcePrimaryLabel(
                                      source
                                  ),
                                  color =
                                      Color.White,
                                  fontSize = 11.sp,
                                  fontWeight =
                                      FontWeight.Bold,
                                  maxLines = 1,
                              )
                              playerSourceTechnicalLabel(
                                  source
                              )
                                  .takeIf {
                                      it.isNotBlank()
                                  }
                                  ?.let {
                                      Text(
                                          it,
                                          color =
                                              VueoPalette.Muted,
                                          fontSize =
                                              9.sp,
                                          maxLines = 1,
                                      )
                                  }
                          }
                      }
                  }

          ''' + locked_anchor
              player = replace_once(
                  player,
                  locked_anchor,
                  hud,
                  "Player source HUD overlay",
              )

          text = (
              text[:player_start] +
              player +
              text[player_end:]
          )

          # ============================================================
          # 10. Restyle central action buttons.
          # ============================================================
          round_start = text.find(
              "@Composable\nprivate fun PlayerRoundAction("
          )
          round_end = text.find(
              "@Composable\nprivate fun PlayerControlChip(",
              round_start,
          )

          require(
              round_start >= 0 and
              round_end > round_start,
              "PlayerRoundAction boundaries missing",
          )

          round_action = '''@Composable
          private fun PlayerRoundAction(
              label: String,
              primary: Boolean = false,
              onClick: () -> Unit,
          ) {
              Surface(
                  modifier =
                      Modifier
                          .size(
                              if (primary) {
                                  76.dp
                              } else {
                                  58.dp
                              }
                          )
                          .clickable(
                              onClick = onClick
                          ),
                  shape = CircleShape,
                  color =
                      if (primary) {
                          Color.White.copy(
                              alpha = .96f
                          )
                      } else {
                          Color.Black.copy(
                              alpha = .44f
                          )
                      },
                  border =
                      androidx.compose
                          .foundation
                          .BorderStroke(
                              1.dp,
                              if (primary) {
                                  Color.White.copy(
                                      alpha = .90f
                                  )
                              } else {
                                  Color.White.copy(
                                      alpha = .22f
                                  )
                              },
                          ),
                  shadowElevation =
                      if (primary) {
                          10.dp
                      } else {
                          0.dp
                      },
              ) {
                  Box(
                      contentAlignment =
                          Alignment.Center,
                  ) {
                      if (
                          primary &&
                          label == "Play"
                      ) {
                          Icon(
                              Icons.Default.PlayArrow,
                              contentDescription =
                                  "Play",
                              tint = Color.Black,
                              modifier =
                                  Modifier.size(
                                      38.dp
                                  ),
                          )
                      } else {
                          Text(
                              if (
                                  primary &&
                                  label == "Pause"
                              ) {
                                  "Ⅱ"
                              } else {
                                  label
                              },
                              color =
                                  if (primary) {
                                      Color.Black
                                  } else {
                                      Color.White
                                  },
                              fontWeight =
                                  FontWeight.Black,
                              fontSize =
                                  if (primary) {
                                      21.sp
                                  } else {
                                      13.sp
                                  },
                          )
                      }
                  }
              }
          }

          '''

          text = (
              text[:round_start] +
              round_action +
              text[round_end:]
          )

          # ============================================================
          # 11. Restyle player chips and add source helpers.
          # ============================================================
          chip_start = text.find(
              "@Composable\nprivate fun PlayerControlChip("
          )
          chip_end = text.find(
              "@Composable\nprivate fun PlayerFullscreenEffect(",
              chip_start,
          )

          require(
              chip_start >= 0 and
              chip_end > chip_start,
              "PlayerControlChip boundaries missing",
          )

          chip_block = '''@Composable
          private fun PlayerControlChip(
              label: String,
              enabled: Boolean = true,
              accent: Boolean = false,
              onClick: () -> Unit,
          ) {
              Surface(
                  modifier =
                      Modifier.clickable(
                          enabled = enabled,
                          onClick = onClick,
                      ),
                  shape =
                      RoundedCornerShape(
                          50
                      ),
                  color =
                      when {
                          !enabled ->
                              Color.White.copy(
                                  alpha = .05f
                              )

                          accent ->
                              VueoPalette.Accent
                                  .copy(
                                      alpha = .14f
                                  )

                          else ->
                              Color.White.copy(
                                  alpha = .07f
                              )
                      },
                  border =
                      androidx.compose
                          .foundation
                          .BorderStroke(
                              1.dp,
                              when {
                                  !enabled ->
                                      Color.White.copy(
                                          alpha = .08f
                                      )

                                  accent ->
                                      VueoPalette.Accent
                                          .copy(
                                              alpha = .48f
                                          )

                                  else ->
                                      Color.White.copy(
                                          alpha = .14f
                                      )
                              },
                          ),
              ) {
                  Text(
                      label,
                      modifier =
                          Modifier.padding(
                              horizontal = 13.dp,
                              vertical = 8.dp,
                          ),
                      color =
                          when {
                              !enabled ->
                                  Color.White.copy(
                                      alpha = .32f
                                  )

                              accent ->
                                  VueoPalette.Accent

                              else ->
                                  Color.White
                          },
                      maxLines = 1,
                      fontSize = 10.sp,
                      fontWeight =
                          FontWeight.Bold,
                  )
              }
          }

          private fun playerSourcePrimaryLabel(
              source: StreamSource,
          ): String =
              buildString {
                  append(
                      source.quality
                          ?.takeIf {
                              it.isNotBlank()
                          }
                          ?: "Auto"
                  )
                  append(" • ")
                  append(
                      source.providerName
                  )
              }

          private fun playerSourceTechnicalLabel(
              source: StreamSource,
          ): String =
              listOfNotNull(
                  source.codec
                      ?.takeIf {
                          it.isNotBlank()
                      },
                  source.hdr
                      ?.takeIf {
                          it.isNotBlank()
                      },
                  source.audio
                      ?.takeIf {
                          it.isNotBlank()
                      },
              ).joinToString(" • ")

          '''

          text = (
              text[:chip_start] +
              chip_block +
              text[chip_end:]
          )

          # ============================================================
          # Final sanity.
          # ============================================================
          required = [
              "episodes: List<EpisodeItem>,",
              "var showEpisodesDialog by remember",
              "if (showEpisodesDialog)",
              "sourceHudVisible",
              'Text(\n                        "SMART SOURCE"',
              'label =\n                                            "Episodes"',
              'label =\n                                        "Sources ${playableSources.size}"',
              "accent: Boolean = false",
              "playerSourcePrimaryLabel(",
              "playerSourceTechnicalLabel(",
          ]

          missing = [
              marker
              for marker in required
              if marker not in text
          ]

          require(
              not missing,
              f"missing final markers: {missing}",
          )

          # Make sure PlayerScreen has exactly one episode-list parameter.
          player_section = text[
              text.find(
                  "private fun PlayerScreen("
              ):
              text.find(
                  "private fun PlayerTapZone("
              )
          ]

          require(
              player_section.count(
                  "episodes: List<EpisodeItem>,"
              ) == 1,
              "PlayerScreen episode-list parameter count invalid",
          )

          require(
              text.count(
                  "private fun PlayerControlChip("
              ) == 1,
              "PlayerControlChip duplicate detected",
          )

          require(
              text.count(
                  "private fun PlayerRoundAction("
              ) == 1,
              "PlayerRoundAction duplicate detected",
          )

          APP.write_text(
              text,
              encoding="utf-8",
          )

          print("Player v2 patch applied.")
          PY

      - name: Validate Player v2 source
        shell: bash
        run: |
          set -euo pipefail

          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"

          grep -q 'episodes: List<EpisodeItem>' "$APP"
          grep -q 'showEpisodesDialog' "$APP"
          grep -q 'SMART SOURCE' "$APP"
          grep -q 'sourceHudVisible' "$APP"
          grep -q 'playerSourcePrimaryLabel' "$APP"
          grep -q 'playerSourceTechnicalLabel' "$APP"
          grep -q 'accent: Boolean = false' "$APP"

          echo "Player v2 source validation passed."

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit Player v2
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoApp.kt

          git commit -m "feat: remake VUEO player v2"
          git push origin HEAD:main
