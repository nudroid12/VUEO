                                      Modifier.padding(
                                          horizontal = 14.dp,
                                          vertical = 10.dp,
                                      ),
                                  verticalArrangement =
                                      Arrangement.spacedBy(
                                          5.dp
                                      ),
                              ) {
                                  Row(
                                      modifier =
                                          Modifier.fillMaxWidth(),
                                      verticalAlignment =
                                          Alignment
                                              .CenterVertically,
                                  ) {
                                      Column(
                                          modifier =
                                              Modifier.weight(
                                                  1f
                                              ),
                                      ) {
                                          Text(
                                              "SMART SOURCE",
                                              color =
                                                  VueoPalette
                                                      .Accent,
                                              fontSize = 9.sp,
                                              fontWeight =
                                                  FontWeight
                                                      .Black,
                                              letterSpacing =
                                                  .7.sp,
                                          )

                                          Text(
                                              playerSourcePrimaryLabel(
                                                  source
                                              ),
                                              color =
                                                  Color.White,
                                              fontSize = 11.sp,
                                              fontWeight =
                                                  FontWeight
                                                      .SemiBold,
                                              maxLines = 1,
                                              overflow =
                                                  TextOverflow
                                                      .Ellipsis,
                                          )
                                      }

