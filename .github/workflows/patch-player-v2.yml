# VUEO PLAYER V2 - 2026-08-29
name: Patch Player v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Player v2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'

          from pathlib import Path

          APP = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          )

          text = APP.read_text(encoding="utf-8")

          def fail(message):
              raise SystemExit(
                  f"Player v2 patch sanity failed: {message}"
              )

          def require(condition, message):
              if not condition:
                  fail(message)

          def replace_once(source, old, new, label):
              count = source.count(old)
              require(
                  count == 1,
                  f"{label}: expected 1 anchor, found {count}",
              )
              return source.replace(old, new, 1)

          def replace_balanced_block(
              source,
              start_marker,
              replacement,
              label,
          ):
              start = source.find(start_marker)
              require(
                  start >= 0,
                  f"{label}: start marker missing",
              )

              brace = source.find("{", start)
              require(
                  brace >= 0,
                  f"{label}: opening brace missing",
              )

              depth = 0
              in_string = False
              escape = False
              i = brace

              while i < len(source):
                  ch = source[i]

                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              return (
                                  source[:start] +
                                  replacement +
                                  source[end:]
                              )
                  i += 1

              fail(
                  f"{label}: closing brace missing"
              )

          # ============================================================
          # 1. Player call gets the full episode list.
          # ============================================================
          if "episodes =\n                item.episodes," not in text:
              old = '''            episode =
                          selectedEpisode,
                      nextEpisode =
                          nextEpisode,
          '''
              new = '''            episode =
                          selectedEpisode,
                      episodes =
                          item.episodes,
                      nextEpisode =
                          nextEpisode,
          '''
              text = replace_once(
                  text,
                  old,
                  new,
                  "PlayerScreen call episodes",
              )

          # ============================================================
          # 2. PlayerScreen signature.
          # ============================================================
          if "episodes: List<EpisodeItem>," not in text[
              text.find("private fun PlayerScreen("):
              text.find("private fun PlayerTapZone(")
          ]:
              old = '''    videoId: String,
              episode: EpisodeItem?,
              nextEpisode: EpisodeItem?,
          '''
              new = '''    videoId: String,
              episode: EpisodeItem?,
              episodes: List<EpisodeItem>,
              nextEpisode: EpisodeItem?,
          '''
              text = replace_once(
                  text,
                  old,
                  new,
                  "PlayerScreen signature episodes",
              )

          player_start = text.find(
              "@Composable\nprivate fun PlayerScreen("
          )
          player_end = text.find(
              "@Composable\nprivate fun PlayerTapZone(",
              player_start,
          )

          require(
              player_start >= 0 and
              player_end > player_start,
              "PlayerScreen boundaries missing",
          )

          player = text[
              player_start:
              player_end
          ]

          # ============================================================
          # 3. Player v2 states.
          # ============================================================
          if "var showEpisodesDialog by remember" not in player:
              old = '''    var showAudioDialog by remember {
                  mutableStateOf(false)
              }
          '''
              new = '''    var showEpisodesDialog by remember {
                  mutableStateOf(false)
              }
              var showAudioDialog by remember {
                  mutableStateOf(false)
              }
          '''
              player = replace_once(
                  player,
                  old,
                  new,
                  "Player episode dialog state",
              )

          if "var sourceHudVisible by remember" not in player:
              old = '''    var playbackSpeed by remember {
                  mutableStateOf(1f)
              }
          '''
              new = '''    var playbackSpeed by remember {
                  mutableStateOf(1f)
              }
              var sourceHudVisible by remember(
                  source.url
              ) {
                  mutableStateOf(true)
              }
          '''
              player = replace_once(
                  player,
                  old,
                  new,
                  "Player source HUD state",
              )

          # ============================================================
          # 4. Back handling for episode panel.
          # ============================================================
          if "showEpisodesDialog ->" not in player:
              old = '''    BackHandler {
                  when {
                      showAudioDialog ->
                          showAudioDialog = false
          '''
              new = '''    BackHandler {
                  when {
                      showEpisodesDialog ->
                          showEpisodesDialog = false

                      showAudioDialog ->
                          showAudioDialog = false
          '''
              player = replace_once(
                  player,
                  old,
                  new,
                  "Player BackHandler episodes",
              )

          # ============================================================
          # 5. Source HUD display timer.
          # ============================================================
          if "LaunchedEffect(source.url) {" not in player:
              old = '''    LaunchedEffect(
                  controlsVisible,
                  isPlaying,
                  controlsLocked,
              ) {
          '''
              new = '''    LaunchedEffect(source.url) {
                  sourceHudVisible = true
                  delay(2_200L)
                  sourceHudVisible = false
              }

              LaunchedEffect(
                  controlsVisible,
                  isPlaying,
                  controlsLocked,
              ) {
          '''
              player = replace_once(
                  player,
                  old,
                  new,
                  "Player source HUD effect",
              )

          player = player.replace(
              "            delay(3_000L)\n",
              "            delay(4_000L)\n",
              1,
          )

          # ============================================================
          # 6. Episode selector panel.
          # ============================================================
          if "if (showEpisodesDialog)" not in player:
              source_dialog_anchor = '''    if (showSourceDialog) {
          '''
              episode_dialog = '''    if (showEpisodesDialog) {
                  AlertDialog(
                      onDismissRequest = {
                          showEpisodesDialog = false
                      },
                      title = {
                          Column(
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      2.dp
                                  ),
                          ) {
                              Text(
                                  "Episodes",
                                  fontWeight =
                                      FontWeight.Black,
                              )
                              episode?.let {
                                  Text(
                                      "Now playing • S${it.season} E${it.episode}",
                                      color =
                                          VueoPalette.Muted,
                                      fontSize = 11.sp,
                                  )
                              }
                          }
                      },
                      text = {
                          LazyColumn(
                              modifier =
                                  Modifier.heightIn(
                                      max = 430.dp
                                  ),
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      6.dp
                                  ),
                          ) {
                              items(
                                  episodes
                                      .sortedWith(
                                          compareBy<EpisodeItem> {
                                              it.season
                                          }.thenBy {
                                              it.episode
                                          }
                                      ),
                                  key = {
                                      it.id
                                  },
                              ) {
                                  candidate ->
                                  val current =
                                      candidate.id ==
                                          episode?.id

                                  Surface(
                                      modifier =
                                          Modifier
                                              .fillMaxWidth()
                                              .clickable(
                                                  enabled =
                                                      !current
                                              ) {
                                                  savePosition()
                                                  showEpisodesDialog =
                                                      false
                                                  onNextEpisode(
                                                      candidate
                                                  )
                                              },
                                      shape =
                                          RoundedCornerShape(
                                              14.dp
                                          ),
                                      color =
                                          if (current) {
                                              VueoPalette.Accent
                                                  .copy(
                                                      alpha =
                                                          .12f
                                                  )
                                          } else {
                                              VueoPalette
                                                  .Surface
                                          },
                                      border =
                                          androidx.compose
                                              .foundation
                                              .BorderStroke(
                                                  1.dp,
                                                  if (current) {
                                                      VueoPalette
                                                          .Accent
                                                          .copy(
                                                              alpha =
                                                                  .55f
                                                          )
                                                  } else {
                                                      VueoPalette
                                                          .Stroke
                                                          .copy(
                                                              alpha =
                                                                  .45f
                                                          )
                                                  },
                                              ),
                                  ) {
                                      Row(
                                          modifier =
                                              Modifier
                                                  .fillMaxWidth()
                                                  .padding(
                                                      horizontal =
                                                          13.dp,
                                                      vertical =
                                                          11.dp,
                                                  ),
                                          verticalAlignment =
                                              Alignment
                                                  .CenterVertically,
                                      ) {
                                          Surface(
                                              shape =
                                                  RoundedCornerShape(
                                                      9.dp
                                                  ),
                                              color =
                                                  Color.Black
                                                      .copy(
                                                          alpha =
                                                              .36f
                                                      ),
                                          ) {
                                              Text(
                                                  "S${candidate.season} E${candidate.episode}",
                                                  modifier =
                                                      Modifier
                                                          .padding(
                                                              horizontal =
                                                                  8.dp,
                                                              vertical =
                                                                  5.dp,
                                                          ),
                                                  color =
                                                      if (current) {
                                                          VueoPalette
                                                              .Accent
                                                      } else {
                                                          Color.White
                                                      },
                                                  fontSize =
                                                      10.sp,
                                                  fontWeight =
                                                      FontWeight
                                                          .Black,
                                              )
                                          }

                                          Spacer(
                                              Modifier.width(
                                                  10.dp
                                              )
                                          )

                                          Column(
                                              modifier =
                                                  Modifier.weight(
                                                      1f
                                                  ),
                                          ) {
                                              Text(
                                                  candidate.title,
                                                  color =
                                                      Color.White,
                                                  fontWeight =
                                                      if (current) {
                                                          FontWeight
                                                              .Black
                                                      } else {
                                                          FontWeight
                                                              .SemiBold
                                                      },
                                                  maxLines = 1,
                                                  overflow =
                                                      TextOverflow
                                                          .Ellipsis,
                                              )

                                              candidate.overview
                                                  ?.takeIf {
                                                      it.isNotBlank()
                                                  }
                                                  ?.let {
                                                      overview ->
                                                      Text(
                                                          overview,
                                                          color =
                                                              VueoPalette
                                                                  .Muted,
                                                          fontSize =
                                                              10.sp,
                                                          maxLines = 1,
                                                          overflow =
                                                              TextOverflow
                                                                  .Ellipsis,
                                                      )
                                                  }
                                          }

                                          if (current) {
                                              Text(
                                                  "PLAYING",
                                                  color =
                                                      VueoPalette
                                                          .Accent,
                                                  fontSize =
                                                      9.sp,
                                                  fontWeight =
                                                      FontWeight
                                                          .Black,
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(
                              onClick = {
                                  showEpisodesDialog =
                                      false
                              },
                          ) {
                              Text("Close")
                          }
                      },
                  )
              }

          ''' + source_dialog_anchor
              player = replace_once(
                  player,
                  source_dialog_anchor,
                  episode_dialog,
                  "Player episode dialog insertion",
              )

          # ============================================================
          # 7. Source panel heading becomes explicitly Smart Source aware.
          # ============================================================
          player = player.replace(
              '                Text("Sources")\n',
              '''                Column(
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      2.dp
                                  ),
                          ) {
                              Text(
                                  "Sources",
                                  fontWeight =
                                      FontWeight.Black,
                              )
                              Text(
                                  "Smart Source • ${playableSources.size} playable",
                                  color =
                                      VueoPalette.Muted,
                                  fontSize = 11.sp,
                              )
                          }
          ''',
              1,
          )

          # ============================================================
          # 8. Replace old control overlay with Player v2 cinematic UI.
          # ============================================================
          controls_marker = '''        if (controlsVisible && !controlsLocked) {
          '''

          new_controls = '''        if (controlsVisible && !controlsLocked) {
                      Box(
                          modifier =
                              Modifier
                                  .fillMaxSize()
                                  .background(
                                      Brush.verticalGradient(
                                          listOf(
                                              Color.Black.copy(
                                                  alpha = .70f
                                              ),
                                              Color.Black.copy(
                                                  alpha = .12f
                                              ),
                                              Color.Transparent,
                                              Color.Black.copy(
                                                  alpha = .18f
                                              ),
                                              Color.Black.copy(
                                                  alpha = .88f
                                              ),
                                          )
                                      )
                                  ),
                      )

                      Row(
                          modifier =
                              Modifier
                                  .fillMaxWidth()
                                  .align(
                                      Alignment.TopCenter
                                  )
                                  .padding(
                                      horizontal = 14.dp,
                                      vertical = 10.dp,
                                  ),
                          verticalAlignment =
                              Alignment.CenterVertically,
                      ) {
                          Surface(
                              shape = CircleShape,
                              color =
                                  Color.Black.copy(
                                      alpha = .42f
                                  ),
                          ) {
                              IconButton(
                                  onClick = {
                                      savePosition()
                                      onBack()
                                  },
                              ) {
                                  Icon(
                                      Icons.Default.ArrowBack,
                                      contentDescription =
                                          "Back",
                                      tint = Color.White,
                                  )
                              }
                          }

                          Spacer(
                              Modifier.width(
                                  10.dp
                              )
                          )

                          Column(
                              modifier =
                                  Modifier.weight(
                                      1f
                                  ),
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      2.dp
                                  ),
                          ) {
                              Text(
                                  title,
                                  color = Color.White,
                                  fontSize = 17.sp,
                                  fontWeight =
                                      FontWeight.Black,
                                  maxLines = 1,
                                  overflow =
                                      TextOverflow.Ellipsis,
                              )

                              Text(
                                  buildString {
                                      episode?.let {
                                          append(
                                              "S${it.season} E${it.episode} • "
                                          )
                                      }
                                      append(
                                          source.providerName
                                      )
                                  },
                                  color =
                                      Color.White.copy(
                                          alpha = .68f
                                      ),
                                  fontSize = 11.sp,
                                  maxLines = 1,
                                  overflow =
                                      TextOverflow.Ellipsis,
                              )
                          }

                          Surface(
                              shape =
                                  RoundedCornerShape(
                                      50
                                  ),
                              color =
                                  Color.Black.copy(
                                      alpha = .42f
                                  ),
                              border =
                                  androidx.compose
                                      .foundation
                                      .BorderStroke(
                                          1.dp,
                                          VueoPalette
                                              .Accent
                                              .copy(
                                                  alpha =
                                                      .42f
                                              ),
                                      ),
                          ) {
                              Row(
                                  modifier =
                                      Modifier.padding(
                                          horizontal =
                                              11.dp,
                                          vertical =
                                              7.dp,
                                      ),
                                  verticalAlignment =
                                      Alignment
                                          .CenterVertically,
                                  horizontalArrangement =
                                      Arrangement.spacedBy(
                                          6.dp
                                      ),
                              ) {
                                  Box(
                                      modifier =
                                          Modifier
                                              .size(
                                                  6.dp
                                              )
                                              .clip(
                                                  CircleShape
                                              )
                                              .background(
                                                  if (
                                                      playbackError ==
                                                          null
                                                  ) {
                                                      VueoPalette
                                                          .Success
                                                  } else {
                                                      MaterialTheme
                                                          .colorScheme
                                                          .error
                                                  }
                                              )
                                  )

                                  Text(
                                      if (isBuffering) {
                                          "BUFFERING"
                                      } else {
                                          source.quality
                                              ?: "AUTO"
                                      },
                                      color =
                                          if (
                                              isBuffering
                                          ) {
                                              VueoPalette
                                                  .Accent
                                          } else {
                                              Color.White
                                          },
                                      fontSize = 10.sp,
                                      fontWeight =
                                          FontWeight.Black,
                                  )
                              }
                          }
                      }

                      Row(
                          modifier =
                              Modifier
                                  .align(
                                      Alignment.Center
                                  )
                                  .padding(
                                      12.dp
                                  ),
                          horizontalArrangement =
                              Arrangement.spacedBy(
                                  26.dp
                              ),
                          verticalAlignment =
                              Alignment.CenterVertically,
                      ) {
                          PlayerRoundAction(
                              label = "−10",
                              onClick = {
                                  player.seekTo(
                                      (
                                          player.currentPosition -
                                              10_000L
                                      ).coerceAtLeast(
                                          0L
                                      )
                                  )
                                  gestureMessage =
                                      "10 sec back"
                              },
                          )

                          PlayerRoundAction(
                              label =
                                  if (isPlaying) {
                                      "Pause"
                                  } else {
                                      "Play"
                                  },
                              primary = true,
                              onClick = {
                                  if (player.isPlaying) {
                                      player.pause()
                                  } else {
                                      player.play()
                                  }
                                  controlsVisible = true
                              },
                          )

                          PlayerRoundAction(
                              label = "+10",
                              onClick = {
                                  player.seekTo(
                                      player.currentPosition +
                                          10_000L
                                  )
                                  gestureMessage =
                                      "10 sec forward"
                              },
                          )
                      }

                      Column(
                          modifier =
                              Modifier
                                  .fillMaxWidth()
                                  .align(
                                      Alignment.BottomCenter
                                  )
                                  .padding(
                                      horizontal = 14.dp,
                                      vertical = 12.dp,
                                  ),
                          verticalArrangement =
                              Arrangement.spacedBy(
                                  8.dp
                              ),
                      ) {
                          playbackError?.let {
                              error ->
                              Surface(
                                  modifier =
                                      Modifier.fillMaxWidth(),
                                  shape =
                                      RoundedCornerShape(
                                          18.dp
                                      ),
                                  color =
                                      Color.Black.copy(
                                          alpha = .72f
                                      ),
                                  border =
                                      androidx.compose
                                          .foundation
                                          .BorderStroke(
                                              1.dp,
                                              MaterialTheme
                                                  .colorScheme
                                                  .error
                                                  .copy(
                                                      alpha =
                                                          .42f
                                                  ),
                                          ),
                              ) {
                                  Row(
                                      modifier =
                                          Modifier
                                              .fillMaxWidth()
                                              .padding(
                                                  13.dp
                                              ),
                                      verticalAlignment =
                                          Alignment
                                              .CenterVertically,
                                  ) {
                                      Column(
                                          modifier =
                                              Modifier.weight(
                                                  1f
                                              ),
                                          verticalArrangement =
                                              Arrangement.spacedBy(
                                                  2.dp
                                              ),
                                      ) {
                                          Text(
                                              "Playback problem",
                                              color =
                                                  Color.White,
                                              fontWeight =
                                                  FontWeight
                                                      .Black,
                                          )
                                          Text(
                                              error,
                                              color =
                                                  VueoPalette
                                                      .Muted,
                                              fontSize =
                                                  11.sp,
                                              maxLines = 2,
                                              overflow =
                                                  TextOverflow
                                                      .Ellipsis,
                                          )
                                      }

                                      TextButton(
                                          onClick = {
                                              playbackError =
                                                  null
                                              player.prepare()
                                              player.play()
                                          },
                                      ) {
                                          Text(
                                              "Retry"
                                          )
                                      }

                                      if (
                                          playableSources
                                              .size > 1
                                      ) {
                                          TextButton(
                                              onClick = {
                                                  showSourceDialog =
                                                      true
                                              },
                                          ) {
                                              Text(
                                                  "Sources"
                                              )
                                          }
                                      }
                                  }
                              }
                          }

                          nextEpisodeCountdown?.let {
                              count ->
                              nextEpisode?.let {
                                  next ->
                                  Surface(
                                      modifier =
                                          Modifier.fillMaxWidth(),
                                      shape =
                                          RoundedCornerShape(
                                              18.dp
                                          ),
                                      color =
                                          Color.Black.copy(
                                              alpha = .70f
                                          ),
                                      border =
                                          androidx.compose
                                              .foundation
                                              .BorderStroke(
                                                  1.dp,
                                                  VueoPalette
                                                      .Accent
                                                      .copy(
                                                          alpha =
                                                              .35f
                                                      ),
                                              ),
                                  ) {
                                      Row(
                                          modifier =
                                              Modifier
                                                  .fillMaxWidth()
                                                  .padding(
                                                      12.dp
                                                  ),
                                          verticalAlignment =
                                              Alignment
                                                  .CenterVertically,
                                      ) {
                                          Column(
                                              modifier =
                                                  Modifier.weight(
                                                      1f
                                                  ),
                                          ) {
                                              Text(
                                                  "Up Next",
                                                  color =
                                                      VueoPalette
                                                          .Accent,
                                                  fontSize =
                                                      10.sp,
                                                  fontWeight =
                                                      FontWeight
                                                          .Black,
                                              )
                                              Text(
                                                  "S${next.season} E${next.episode} • ${next.title}",
                                                  color =
                                                      Color.White,
                                                  fontWeight =
                                                      FontWeight
                                                          .Bold,
                                                  maxLines = 1,
                                                  overflow =
                                                      TextOverflow
                                                          .Ellipsis,
                                              )
                                          }

                                          TextButton(
                                              onClick = {
                                                  nextEpisodeCountdown =
                                                      null
                                              },
