name: Fix VUEO v0.5.0 Coroutine Returns v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize v0.5.0 coroutine returns
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          )

          if not path.exists():
              raise SystemExit(
                  "UnifiedMediaEngine.kt not found. Apply v0.5.0 first."
              )

          text = path.read_text(encoding="utf-8")
          original = text

          text = re.sub(
              r"return@coroutineScope\s+it\.take\(maxRows\)",
              "return@coroutineScope it.take(maxRows)",
              text,
              count=1,
          )

          text = re.sub(
              r"return@coroutineScope\s+emptyList(?:<MediaItem>)?\(\)",
              "return@coroutineScope emptyList<MediaItem>()",
              text,
              count=1,
          )

          text = re.sub(
              r"return@coroutineScope\s+it\.take\(maxResults\)",
              "return@coroutineScope it.take(maxResults)",
              text,
              count=1,
          )

          required = [
              "return@coroutineScope it.take(maxRows)",
              "return@coroutineScope emptyList<MediaItem>()",
              "return@coroutineScope it.take(maxResults)",
          ]

          missing = [
              item
              for item in required
              if item not in text
          ]

          if missing:
              print("Current relevant source:")
              for number, line in enumerate(
                  text.splitlines(),
                  start=1,
              ):
                  if (
                      "return@coroutineScope" in line
                      or "maxRows" in line
                      or "maxResults" in line
                  ):
                      print(f"{number}: {line}")

              raise SystemExit(
                  "Could not normalize expected returns: "
                  + ", ".join(missing)
              )

          if text != original:
              path.write_text(
                  text,
                  encoding="utf-8",
              )
              print(
                  "Normalized v0.5.0 coroutine returns."
              )
          else:
              print(
                  "Coroutine return hotfix already present."
              )
          PY

      - name: Show corrected source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"

          echo "Relevant coroutine returns:"
          grep -n             'return@coroutineScope'             "$FILE" || true

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          )
          text = path.read_text(
              encoding="utf-8"
          )

          required = [
              "return@coroutineScope it.take(maxRows)",
              "return@coroutineScope emptyList<MediaItem>()",
              "return@coroutineScope it.take(maxResults)",
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      f"Missing corrected expression: {item}"
                  )

          print(
              "Coroutine return source checks passed."
          )
          PY

      - name: Commit and push hotfix
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            git config user.name               "github-actions[bot]"
            git config user.email               "41898282+github-actions[bot]@users.noreply.github.com"

            git add               app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

            git commit -m               "Normalize v0.5.0 coroutine returns"

            git push origin               "HEAD:${GITHUB_REF_NAME}"
          else
            echo               "Hotfix already present. Continuing to build."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if               [ -n "${ANDROID_HOME:-}" ] &&               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo                 "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin first
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build VUEO v0.5.0 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          find "$APK_DIR"             -maxdepth 1             -type f             -name "*.apk"             -print || true

          APK="$(
            find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit
          )"

          if [ -z "$APK" ]; then
            echo               "::error::Build completed without an APK."
            exit 1
          fi

      - name: Upload fixed VUEO v0.5.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.5.0-fixed-v2-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.5.0 Hotfix v2"
            echo
            echo "- Normalized coroutineScope returns"
            echo "- Added explicit Kotlin compile step"
            echo "- Discovery Experience retained"
            echo "- Fast Source Engine retained"
          } >> "$GITHUB_STEP_SUMMARY"
