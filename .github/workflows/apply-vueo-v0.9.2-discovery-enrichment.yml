      - name: Sanity check v0.9.2
        shell: bash
        run: |
          set -euo pipefail

          BUILD="app/build.gradle.kts"
          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          SETTINGS="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          STORE="app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          CACHE="app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ENGINE="app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          TMDB="app/src/main/java/com/vueo/app/core/enrichment/TmdbEnhancementClient.kt"
          MDB="app/src/main/java/com/vueo/app/core/enrichment/MdblistClient.kt"

          grep -q 'versionCode = 19' "$BUILD"
          grep -q 'versionName = "0.9.2"' "$BUILD"

          test -f "$TMDB"
          test -f "$MDB"

          grep -Fq '/recommendations' "$TMDB"
          grep -Fq '/similar' "$TMDB"
          grep -Fq 'prepareForCore' "$TMDB"
          grep -Fq 'optNullableString("imdb_id")' "$TMDB"
          grep -Fq 'testConnection' "$TMDB"

          grep -Fq 'https://api.mdblist.com' "$MDB"
          grep -Fq 'suspend fun ratings' "$MDB"
          grep -Fq '"imdb"' "$MDB"
          grep -Fq '"tomatoes"' "$MDB"
          grep -Fq '"metacritic"' "$MDB"
          grep -Fq '"tmdb"' "$MDB"
          grep -Fq '"trakt"' "$MDB"

          grep -Fq 'TmdbEnhancementClient' "$APP"
          grep -Fq 'MdblistClient' "$APP"
          grep -Fq 'MediaRatingsStrip' "$APP"
          grep -Fq 'TMDB enhanced' "$APP"
          grep -Fq 'Settings > Enhancements > TMDB' "$APP"

          grep -Fq 'TmdbEnhancementClient' "$SETTINGS"
          grep -Fq 'MdblistClient' "$SETTINGS"
          grep -Fq 'Test Connection' "$SETTINGS"
          grep -Fq 'TMDB Attribution' "$SETTINGS"
          grep -Fq 'This product uses the TMDB API but is not endorsed or certified by TMDB.' "$SETTINGS"

          grep -Fq 'fun tmdbMetadataEnrichmentEnabled' "$STORE"
          grep -Fq 'fun tmdbRecommendationsEnabled' "$STORE"
          grep -Fq 'fun tmdbSimilarTitlesEnabled' "$STORE"
          grep -Fq 'fun tmdbArtworkEnrichmentEnabled' "$STORE"
          grep -Fq 'fun mdblistApiKey' "$STORE"
          grep -Fq 'fun mdblistRatingsEnabled' "$STORE"

          grep -Fq '@kotlin.jvm.JvmName("catalogRowsToJson")' "$CACHE"
          grep -Fq '@kotlin.jvm.JvmName("mediaItemsToJson")' "$CACHE"

          grep -Fq 'withTimeoutOrNull' "$ENGINE"
          grep -Fq 'PlayerFullscreenEffect' "$APP"
          grep -Fq 'librarySaveTicks' "$APP"

          if grep -R -Fq             'Settings > Content Manager > Plugins'             app/src/main/java; then
            echo "::error::Legacy TMDB Settings path remains."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(encoding="utf-8")

          settings = Path(
              "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          ).read_text(encoding="utf-8")

          cache = Path(
              "app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt"
          ).read_text(encoding="utf-8")

          engine = Path(
              "app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt"
          ).read_text(encoding="utf-8")

          tmdb = Path(
              "app/src/main/java/com/vueo/app/core/enrichment/TmdbEnhancementClient.kt"
          ).read_text(encoding="utf-8")

          mdblist = Path(
              "app/src/main/java/com/vueo/app/core/enrichment/MdblistClient.kt"
          ).read_text(encoding="utf-8")

          app_start = app.index("fun VueoApp()")
          details_start = app.index(
              "private fun MediaDetailsScreen("
          )
          details_state = app.index(
              "    var item by remember",
              details_start,
          )

          root_count = app[
              app_start:details_start
          ].count(
              "val libraryStore = remember {"
          )

          details_count = app[
              details_start:details_state
          ].count(
              "val libraryStore = remember {"
          )

          if root_count != 1:
              raise SystemExit(
                  f"Root LibraryStore regression: {root_count}"
              )

          if details_count != 1:
              raise SystemExit(
                  f"Details LibraryStore regression: {details_count}"
              )

          bad_value_returns = [
              (
                  cache,
                  r"return@withContext\s*\n\s*emptyList",
              ),
              (
                  cache,
                  r"return@runCatching\s*\n\s*emptyList",
              ),
              (
                  engine,
                  r"return@runCatching\s*\n\s*null",
              ),
          ]

          for text, pattern in bad_value_returns:
              if re.search(pattern, text):
                  raise SystemExit(
                      "Split labelled value return regression."
                  )

          if "return@OutlinedButton" in settings:
              raise SystemExit(
                  "Unsafe OutlinedButton labelled return remains."
              )

          required_tmdb = [
              "suspend fun testConnection",
              "suspend fun prepareForCore",
              "suspend fun enrich",
              "suspend fun moreLikeThis",
              "/recommendations",
              "/similar",
              "external_ids",
          ]

          for token in required_tmdb:
              if token not in tmdb:
                  raise SystemExit(
                      f"Missing TMDB feature: {token}"
                  )

          required_mdblist = [
              "suspend fun testConnection",
              "suspend fun ratings",
              "CACHE_TTL_MS",
              '"imdb"',
              '"tomatoes"',
              '"metacritic"',
              '"tmdb"',
              '"trakt"',
          ]

          for token in required_mdblist:
              if token not in mdblist:
                  raise SystemExit(
                      f"Missing MDBList feature: {token}"
                  )

          if app.count("private fun MediaRatingsStrip(") != 1:
              raise SystemExit(
                  "MediaRatingsStrip declaration regression."
              )

          print(
              "VUEO v0.9.2 structural checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/build.gradle.kts             app/src/main/java/com/vueo/app/core/stremio/SimpleHttp.kt             app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt             app/src/main/java/com/vueo/app/core/enrichment             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt             README.md             ARCHITECTURE.md

          if ! git diff --cached --quiet; then
            git commit -m               "Add VUEO v0.9.2 discovery and enrichment"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "v0.9.2 patch already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build VUEO v0.9.2 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"
          APK="$(
            find "$APK_DIR"               -maxdepth 1               -type f               -name "*.apk"               -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.2-discovery-enrichment-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.2 Discovery and Enrichment"
            echo
            echo "- Optional TMDB metadata and artwork enrichment"
            echo "- TMDB Recommendations and Similar titles"
            echo "- VUEO local More Like This fallback remains active"
            echo "- Optional MDBList rating enrichment"
            echo "- IMDb, Rotten Tomatoes, Metacritic, TMDB and Trakt toggles"
            echo "- TMDB and MDBList Test Connection actions"
            echo "- In-memory enhancement request caching"
            echo "- Existing v0.9.1 Settings and compile hotfixes retained"
            echo "- Version 0.9.2, code 19"
          } >> "$GITHUB_STEP_SUMMARY"
