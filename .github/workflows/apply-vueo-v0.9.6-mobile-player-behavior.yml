      - name: Enable Android PiP and orientation handling
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          if not manifest.is_file():
              raise SystemExit(
                  "AndroidManifest.xml was not found."
              )

          text = manifest.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r'<activity\b(?P<attrs>[^>]*'
              r'android:name="(?:\.MainActivity|'
              r'com\.vueo\.app\.MainActivity)"'
              r'[^>]*)>',
              re.S,
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "Could not locate MainActivity in AndroidManifest.xml."
              )

          attrs = match.group("attrs")

          if "android:supportsPictureInPicture=" not in attrs:
              attrs += (
                  '\n            '
                  'android:supportsPictureInPicture="true"'
              )

          config_match = re.search(
              r'android:configChanges="([^"]*)"',
              attrs,
          )

          required_changes = [
              "keyboardHidden",
              "orientation",
              "screenSize",
          ]

          if config_match:
              current = [
                  part
                  for part in
                  config_match.group(1).split("|")
                  if part
              ]

              for change in required_changes:
                  if change not in current:
                      current.append(change)

              replacement = (
                  'android:configChanges="' +
                  "|".join(current) +
                  '"'
              )

              attrs = (
                  attrs[:config_match.start()] +
                  replacement +
                  attrs[config_match.end():]
              )
          else:
              attrs += (
                  '\n            '
                  'android:configChanges="'
                  'keyboardHidden|orientation|screenSize"'
              )

          replacement = "<activity" + attrs + ">"

          text = (
              text[:match.start()] +
              replacement +
              text[match.end():]
          )

          manifest.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "Enabled PiP and orientation config handling."
          )
          PY

      - name: Sanity check player patch
        shell: bash
        run: |
          set -euo pipefail

          APP="app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          SETTINGS="app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          STORE="app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          BUILD="app/build.gradle.kts"

          grep -q 'versionCode = 23' "$BUILD"
          grep -q 'versionName = "0.9.6"' "$BUILD"

          grep -Fq 'detectDragGestures' "$APP"
          grep -Fq 'detectTransformGestures' "$APP"
          grep -Fq 'PlayerPictureInPictureEffect' "$APP"
          grep -Fq 'enterVueoPictureInPicture' "$APP"
          grep -Fq 'showSourceDialog' "$APP"
          grep -Fq 'showSpeedDialog' "$APP"
          grep -Fq 'controlsLocked' "$APP"
          grep -Fq 'nextEpisodeCountdown' "$APP"
          grep -Fq 'startSourceDiscovery(' "$APP"
          grep -Fq 'onSwitchSource' "$APP"
          grep -Fq 'Auto Source Recovery' "$SETTINGS"
          grep -Fq 'Player Orientation' "$SETTINGS"
          grep -Fq 'enum class PlayerOrientation' "$STORE"
          grep -Fq 'autoSourceRecoveryEnabled' "$STORE"
          grep -Fq 'android:supportsPictureInPicture="true"' "$MANIFEST"
          grep -Fq 'orientation' "$MANIFEST"
          grep -Fq 'screenSize' "$MANIFEST"

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(encoding="utf-8")

          settings = Path(
              "app/src/main/java/com/vueo/app/ui/VueoSettings.kt"
          ).read_text(encoding="utf-8")

          store = Path(
              "app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt"
          ).read_text(encoding="utf-8")

          for name, text in [
              ("VueoApp.kt", app),
              ("VueoSettings.kt", settings),
              ("SettingsStore.kt", store),
          ]:
              if text.count("{") != text.count("}"):
                  raise SystemExit(
                      f"Kotlin brace mismatch in {name}"
                  )

              if text.count("(") != text.count(")"):
                  raise SystemExit(
                      f"Kotlin parenthesis mismatch in {name}"
                  )

          required = [
              "PlayerTapZone",
              "PlayerRoundAction",
              "PlayerControlChip",
              "PlayerFullscreenEffect",
              "PlayerPictureInPictureEffect",
          ]

          for token in required:
              if token not in app:
                  raise SystemExit(
                      f"Missing player helper: {token}"
                  )

          if re.search(
              r"return@runCatching\s*\n\s*null",
              app,
          ):
              raise SystemExit(
                  "Split labelled return regression"
              )

          print(
              "VUEO mobile player structural checks passed."
          )
          PY

          if git status --short |              grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/com/vueo/app/ui/VueoApp.kt             app/src/main/java/com/vueo/app/ui/VueoSettings.kt             app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt             app/src/main/AndroidManifest.xml

          if ! git diff --cached --quiet; then
            git commit -m               "Improve VUEO mobile player behavior"
            git push origin               "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Mobile player patch already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f             ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] &&                [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null |             "$SDKMANAGER" --licenses             >/dev/null 2>&1 || true

          "$SDKMANAGER"             --channel=0             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:compileDebugKotlin             --stacktrace             --no-daemon

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             :app:assembleDebug             --stacktrace             --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.6-mobile-player-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.6 Mobile Player"
            echo
            echo "- Custom fullscreen mobile controls"
            echo "- Single tap controls, double tap seek/play behavior"
            echo "- Horizontal seek gesture"
            echo "- Left brightness and right volume vertical gestures"
            echo "- Pinch and button Fit/Zoom"
            echo "- 3 second control auto-hide while playing"
            echo "- Lock controls mode"
            echo "- In-player source switching with timestamp carry-over"
            echo "- Optional Auto Source Recovery, default OFF"
            echo "- Audio and subtitle selectors"
            echo "- Playback speed selector"
            echo "- Next Episode 8 second countdown and progressive source discovery"
            echo "- Android Picture-in-Picture support"
            echo "- Player orientation options in Settings"
            echo "- Keeps version 0.9.6, code 23"
          } >> "$GITHUB_STEP_SUMMARY"
