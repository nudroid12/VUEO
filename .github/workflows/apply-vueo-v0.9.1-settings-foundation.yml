      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionName = "0.9.1"' \
            app/build.gradle.kts

          grep -q 'versionCode = 18' \
            app/build.gradle.kts

          grep -q 'enum class PreferredQuality' \
            app/src/main/java/com/vueo/app/core/storage/SettingsStore.kt

          grep -q 'suspend fun restoreHome' \
            app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt

          grep -q 'suspend fun clearAll' \
            app/src/main/java/com/vueo/app/core/extensions/CatalogDiscoveryCache.kt

          grep -q 'preferenceBoost' \
            app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          grep -q 'ADDON_REQUEST_TIMEOUT_MS' \
            app/src/main/java/com/vueo/app/core/extensions/UnifiedMediaEngine.kt

          grep -q 'fun clearAll()' \
            app/src/main/java/com/vueo/app/core/extensions/SourceDiscoveryCache.kt

          grep -q 'PluginHttp.client' \
            app/src/main/java/com/vueo/app/core/stremio/SimpleHttp.kt

          grep -q 'record_v2:' \
            app/src/main/java/com/vueo/app/core/plugin/PluginHealthStore.kt

          grep -q 'AppTab.SETTINGS' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'private fun SettingsScreen' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'Preferred Quality' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'BuildConfig.VERSION_NAME' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'librarySaveTicks' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'PlayerFullscreenEffect' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          grep -q 'VUEO RECOMMENDS' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt

          if grep -q 'AppTab.CONTENT_MANAGER' \
            app/src/main/java/com/vueo/app/ui/VueoApp.kt
          then
            echo "::error::Legacy Content bottom tab remains."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          ui = Path(
              "app/src/main/java/com/vueo/app/ui/VueoApp.kt"
          ).read_text(
              encoding="utf-8"
          )

          app_start = ui.index(
              "fun VueoApp()"
          )

          details_start = ui.index(
              "private fun MediaDetailsScreen("
          )

          details_state = ui.index(
              "    var item by remember",
              details_start,
          )

          root_count = ui[
              app_start:
              details_start
          ].count(
              "val libraryStore = remember {"
          )

          details_count = ui[
              details_start:
              details_state
          ].count(
              "val libraryStore = remember {"
          )

          if root_count != 1:
              raise SystemExit(
                  f"Root LibraryStore regression: {root_count}"
              )

          if details_count != 1:
              raise SystemExit(
                  f"Details LibraryStore regression: {details_count}"
              )

          print(
              "v0.9.1 structural checks passed."
          )
          PY

          if git status --short | \
             grep -E '^.. \.github/workflows/'; then
            echo "::error::Patch attempted to modify workflow files."
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet || \
             [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git config user.name \
              "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A app README.md ARCHITECTURE.md

            if ! git diff --cached --quiet; then
              git commit -m \
                "Add VUEO v0.9.1 settings foundation"

              git push origin \
                "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f \
            ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            if \
              [ -n "${ANDROID_HOME:-}" ] && \
              [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | \
            "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Build VUEO v0.9.1 APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload VUEO v0.9.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-v0.9.1-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO v0.9.1 Settings Foundation"
            echo
            echo "- Includes v0.9 performance and stability hardening"
            echo "- Bottom Content tab replaced by Settings"
            echo "- Content Manager moved inside Settings"
            echo "- Resume Playback preference"
            echo "- Preferred Quality Smart Source ranking"
            echo "- Technical Source Details preference"
            echo "- Catalog and Search cache controls"
            echo "- Source cache controls"
            echo "- Continue Watching and History controls"
            echo "- About and installed version"
          } >> "$GITHUB_STEP_SUMMARY"
